<script>
(function(){ var P={theme:'auto',text:100,contrast:false,motion:false};

  window.__prefs=P; var h=document.documentElement;
  h.dataset.theme=P.theme; h.dataset.contrast=P.contrast?'high':'normal'; h.dataset.motion=P.motion?'reduce':'auto';
  h.style.setProperty('--fs', (P.text||100)/100);
})();
</script>
<script>

<style>
  :root{

  html[data-theme=dark]{

  }

    html[data-theme=auto]{
    --ink:#E9EEE6; --ink-soft:#A8B7AB; --canvas:#121A15; --paper:#1B2620; --line:#33433A;
    --gold:#EDB04F; --gold-deep:#E3A23B; --moss:#4F7256; --moss-deep:#9CC9A3; --stamp:#EE7A62;
    --fill:#2D5A40; --on-fill:#F1F5EE; --text2:#D2DBD3; --glass:rgba(27,38,32,.92); --mapbg:#1D2A22;
    --shadow: 0 18px 40px -18px rgba(0,0,0,.7);
    color-scheme:dark;
    }
  }
  html[data-contrast=high]{ --line:#8B8466; --ink-soft:#26402F; --moss-deep:#2F5237; }
  html[data-contrast=high][data-theme=dark]{ --line:#7C9183; --ink-soft:#D5E0D7; }
  @media (prefers-color-scheme:dark){ html[data-contrast=high][data-theme=auto]{ --line:#7C9183; --ink-soft:#D5E0D7; } }
  html[data-contrast=high] .card, html[data-contrast=high] .profile-row, html[data-contrast=high] .field input, html[data-contrast=high] .field textarea, html[data-contrast=high] .field select{ border-width:2px; }
  html[data-contrast=high] a, html[data-contrast=high] .pp-link{ text-decoration:underline; }
  /* dark map tiles + imagery */
  html[data-theme=dark] .leaflet-tile-pane{ filter:invert(1) hue-rotate(180deg) brightness(.92) contrast(.88) saturate(.7); }
  html[data-theme=dark] .leaflet-container{ background:var(--mapbg); }
  html[data-theme=dark] .leaflet-control-attribution{ background:rgba(27,38,32,.8) !important; color:#A8B7AB; }
  html[data-theme=dark] .leaflet-control-attribution a{ color:#9CC9A3; }

  @media (prefers-color-scheme:dark){
    html[data-theme=auto] .leaflet-tile-pane{ filter:invert(1) hue-rotate(180deg) brightness(.92) contrast(.88) saturate(.7); }
    html[data-theme=auto] .leaflet-container{ background:var(--mapbg); }
    html[data-theme=auto] .leaflet-control-attribution{ background:rgba(27,38,32,.8) !important; color:#A8B7AB; }
    html[data-theme=auto] .leaflet-control-attribution a{ color:#9CC9A3; }
    html[data-theme=auto] img, html[data-theme=auto] .pp-img, html[data-theme=auto] .card-img{ filter:brightness(.9); }
  }
  /* accessibility: focus, motion, skip */
  :focus{ outline:none; }
  :focus-visible{ outline:3px solid var(--gold); outline-offset:2px; border-radius:8px; }
  html[data-motion=reduce] *, html[data-motion=reduce] *::before, html[data-motion=reduce] *::after{ animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important; scroll-behavior:auto !important; }
  @media (prefers-reduced-motion:reduce){ html[data-motion=auto] *, html[data-motion=auto] *::before, html[data-motion=auto] *::after{ animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important; } }
  .offlinebar{ position:absolute; left:0; right:0; top:0; z-index:50; background:#7A4B0C; color:#fff; font-size:calc(12px*var(--fs)); font-weight:600; text-align:center; padding:calc(env(safe-area-inset-top,0px) + 6px) 12px 6px; transform:translateY(-110%); transition:transform .25s; }
  .offlinebar.show{ transform:translateY(0); }
  /* round 9 */

  .rp-cell i{ font-style:normal; font-size:calc(18px*var(--fs)); grid-row:span 2; }
  .rp-cell span{ font-size:calc(10.5px*var(--fs)); color:var(--ink-soft); text-transform:uppercase; letter-spacing:.06em; }
  .rp-cell b{ font-size:calc(12.5px*var(--fs)); line-height:1.3; }
  .rp-note{ font-size:calc(13px*var(--fs)); line-height:1.55; margin:10px 0 0; color:var(--text2); }
  .rp-photo{ height:150px; border-radius:14px; background-size:cover; background-position:center; margin-top:10px; background-color:rgba(110,143,114,.15); }
  .chat-report{ max-width:92%; margin:6px 0; display:flex; flex-direction:column; }

  .attachbtn{ width:42px; height:42px; border-radius:50%; background:var(--paper); border:1.5px solid var(--line); color:var(--ink-soft); display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0; }
  .attachbtn:focus-within{ outline:3px solid var(--gold); outline-offset:2px; }
  .chat-preview{ display:flex; align-items:center; gap:10px; background:var(--paper); border:1px solid var(--line); border-radius:14px; padding:6px 8px; margin-top:8px; }
  .chat-preview img, .chat-preview video{ width:44px; height:44px; border-radius:10px; object-fit:cover; }
  .chat-preview span{ flex:1; min-width:0; font-size:calc(12px*var(--fs)); color:var(--ink-soft); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .chat-preview button{ border:none; background:none; color:var(--ink-soft); cursor:pointer; padding:6px; }

  video.chat-media{ cursor:default; }
  #lightbox{ position:fixed; inset:0; z-index:200; background:rgba(0,0,0,.88); display:none; align-items:center; justify-content:center; padding:20px; }
  #lightbox.show{ display:flex; }
  #lightbox img{ max-width:100%; max-height:100%; border-radius:10px; }
  #lightbox button{ position:absolute; top:calc(env(safe-area-inset-top,0px) + 14px); right:14px; width:40px; height:40px; border-radius:50%; border:none; background:rgba(255,255,255,.18); color:#fff; display:flex; align-items:center; justify-content:center; cursor:pointer; }
  .meetcard{ background:var(--paper); border:1px solid var(--line); border-radius:18px; padding:14px; margin-bottom:12px; }
  .mc-top{ display:flex; gap:12px; align-items:center; }
  .mc-top .avatar{ width:46px; height:46px; border-radius:50%; background-size:cover; background-position:center; background-color:var(--moss); flex-shrink:0; }
  .mc-body{ flex:1; min-width:0; display:flex; flex-direction:column; gap:1px; }
  .mc-body b{ font-size:calc(14.5px*var(--fs)); } .mc-body span{ font-size:calc(12px*var(--fs)); color:var(--ink-soft); }
  .mc-note{ font-size:calc(12.5px*var(--fs)); color:var(--text2); font-style:italic; margin:10px 0 0; line-height:1.5; }
  .mc-actions{ display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; }
  .mc-actions .btn{ padding:10px 12px; font-size:calc(12.5px*var(--fs)); }
  .mpill{ font-size:calc(10.5px*var(--fs)); font-weight:700; padding:4px 9px; border-radius:999px; white-space:nowrap; background:rgba(227,162,59,.18); color:var(--gold-deep); }
  .mpill.confirmed, .mpill.resolved{ background:rgba(110,143,114,.18); color:var(--moss-deep); }
  .mpill.declined, .mpill.cancelled{ background:rgba(193,68,46,.12); color:var(--stamp); }
  .mpill.review{ background:rgba(44,92,224,.12); color:#2C5CE0; }
  html[data-theme=dark] .mpill.review{ color:#8FB0FF; } @media (prefers-color-scheme:dark){ html[data-theme=auto] .mpill.review{ color:#8FB0FF; } }
  .incidentcard{ background:var(--paper); border:1px solid var(--line); border-radius:16px; padding:13px 14px; margin-bottom:10px; cursor:pointer; display:flex; flex-direction:column; gap:3px; }
  .incidentcard span{ font-size:calc(12px*var(--fs)); color:var(--ink-soft); }
  .ic-top{ display:flex; justify-content:space-between; align-items:center; gap:8px; } .ic-top b{ font-size:calc(14.5px*var(--fs)); }
  .timeline{ display:flex; flex-direction:column; gap:0; margin:4px 0 6px; }
  .tl-step{ display:flex; gap:12px; padding:8px 0; position:relative; }
  .tl-step i{ width:12px; height:12px; border-radius:50%; background:var(--moss); margin-top:4px; flex-shrink:0; }
  .tl-step:not(:last-child)::after{ content:''; position:absolute; left:5px; top:22px; bottom:-6px; width:2px; background:var(--line); }
  .tl-step b{ display:block; font-size:calc(13px*var(--fs)); } .tl-step span{ font-size:calc(11.5px*var(--fs)); color:var(--ink-soft); }
  .breakdown{ background:var(--paper); border:1px solid var(--line); border-radius:16px; padding:12px 14px; margin-bottom:6px; }
  .subbar{ display:grid; grid-template-columns:104px 1fr 30px; gap:10px; align-items:center; padding:5px 0; font-size:calc(12.5px*var(--fs)); }
  .subbar .bar-track{ height:7px; border-radius:99px; background:rgba(110,143,114,.2); overflow:hidden; } .subbar .bar-track div{ height:100%; background:var(--gold); border-radius:99px; }
  .subbar b{ text-align:right; }
  .reviewreply{ margin-top:10px; padding:10px 12px; background:rgba(110,143,114,.12); border-left:3px solid var(--moss); border-radius:0 12px 12px 0; }
  .reviewreply b{ font-size:calc(12px*var(--fs)); } .reviewreply p{ margin:4px 0 2px; font-size:calc(12.5px*var(--fs)); } .reviewreply span{ font-size:calc(11px*var(--fs)); color:var(--ink-soft); }
  .upload-tile[data-upload=reportPhoto], .upload-tile[data-upload=incidentPhoto]{ height:130px; aspect-ratio:auto; min-height:0; }
  .meetprompt{ display:flex; align-items:center; gap:12px; background:var(--paper); border:1px dashed var(--line); border-radius:16px; padding:12px 14px; margin:14px 0 4px; }
  .meetprompt div{ flex:1; font-size:calc(12.5px*var(--fs)); color:var(--ink-soft); line-height:1.4; } .meetprompt b{ display:block; color:var(--ink); font-size:calc(13.5px*var(--fs)); }
  .sr-only{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
  .seg{ display:flex; gap:6px; background:rgba(110,143,114,.14); padding:4px; border-radius:14px; margin:0 0 6px; }
  .seg button{ flex:1; border:none; background:transparent; color:var(--ink); border-radius:11px; padding:10px 6px; font-size:calc(13px*var(--fs)); font-weight:600; cursor:pointer; font-family:inherit; }

  .setrow b{ display:block; font-size:calc(14px*var(--fs)); }
  .setrow small{ display:block; color:var(--ink-soft); font-size:calc(12px*var(--fs)); margin-top:2px; line-height:1.4; }
  .switch{ position:relative; width:46px; height:28px; border-radius:999px; background:var(--line); border:none; flex-shrink:0; cursor:pointer; }
  .switch::after{ content:''; position:absolute; top:3px; left:3px; width:22px; height:22px; border-radius:50%; background:#fff; transition:transform .15s; }
  .switch[aria-checked=true]{ background:var(--moss); }
  .switch[aria-checked=true]::after{ transform:translateX(18px); }
  .prefsample{ background:var(--paper); border:1px solid var(--line); border-radius:16px; padding:14px 16px; margin:10px 0 16px; font-size:calc(14px*var(--fs)); line-height:1.5; }
  :root{
    --ink:#1E3A2B;
    --ink-soft:#4A5F4F;
    --canvas:#F1EFE2;
    --paper:#FFFFFF;
    --line:#DAD5BF;
    --gold:#E3A23B;
    --gold-deep:#84510F;
    --moss:#587A5D;
    --moss-deep:#3F6247;
    --stamp:#B03A25;
    --shadow: 0 18px 40px -18px rgba(30,58,43,0.35);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0; height:100%;}
  body{
    background:var(--canvas);
    font-family:'Inter',sans-serif;
    color:var(--ink);
    overflow:hidden;
  }

  /* ---------- app shell (fills the real page width) ---------- */
  .screen-wrap{
    width:100%;
    height:100dvh;
    background:var(--canvas);
    position:relative;
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }

  /* content that should stay a comfortable reading/form width even on a wide browser */
  .narrow{ max-width:640px; margin:0 auto; width:100%; }

  /* card lists: single column on phones, multi-column grid once there's room */
  .card-grid{ display:block; }
  @media (min-width:760px){
    .card-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(300px,1fr)); gap:16px; align-items:start; }
    .card-grid .card{ margin-bottom:0; }
  }

  /* ---------- top bar / mode switch ---------- */
  .topbar{
    padding:calc(env(safe-area-inset-top, 0px) + 16px) 20px 14px;
    flex-shrink:0;
  }
  .topbar-row{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    margin-bottom:12px;
  }
  .brand{
    display:flex; align-items:center; gap:8px;
    font-family:'Fraunces',serif; font-weight:700; font-size:calc(19px*var(--fs));
  }
  .brand .mark{
    width:30px;height:30px;border-radius:9px;
    background:var(--ink);
    display:flex;align-items:center;justify-content:center;
    color:var(--gold);
  }
  .backbtn{
    width:34px;height:34px;border-radius:50%;
    background:var(--paper);
    display:flex;align-items:center;justify-content:center;
    border:1px solid var(--line);
    cursor:pointer;
    flex-shrink:0;
  }
  .modeswitch{
    display:flex;
    background:rgba(30,58,43,0.08);
    border-radius:999px;
    padding:3px;
    gap:2px;
  }
  .modeswitch button{
    border:none; background:transparent;
    font-family:'Inter',sans-serif; font-size:calc(12px*var(--fs)); font-weight:600;
    padding:8px 8px; border-radius:999px;
    color:var(--ink-soft);
    cursor:pointer;
    transition:.2s;
    flex:1;
    text-align:center;
    white-space:nowrap;
  }
  .modeswitch button.active{
    background:var(--fill); color:var(--on-fill);
  }

  /* ---------- content area ---------- */
  .content{
    flex:1;
    overflow-y:auto; overflow-x:hidden;
    padding:0 20px 100px;
  }
  @media (min-width:900px){
    .content{ padding:0 40px 100px; }
    .topbar{ padding-left:40px; padding-right:40px; }
  }
  .content::-webkit-scrollbar{display:none;}
  h2.title{
    font-family:'Fraunces',serif; font-weight:600; font-size:calc(24px*var(--fs));
    margin:2px 0 4px;
  }
  .subtitle{
    font-size:calc(13.5px*var(--fs)); color:var(--ink-soft); margin:0 0 18px; line-height:1.5;
  }

  /* ---------- search ---------- */
  .searchbar{
    display:flex; align-items:center; gap:10px;
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:16px;
    padding:12px 14px;
    margin-bottom:16px;
  }
  .searchbar input{
    border:none; outline:none; background:transparent;
    font-family:'Inter',sans-serif; font-size:calc(14px*var(--fs)); color:var(--ink);
    width:100%;
  }
  .searchbar input::placeholder{color:#9CA694;}

  .chiprow{display:flex; gap:8px; overflow-x:auto; margin-bottom:18px; padding-bottom:2px;}
  .chiprow::-webkit-scrollbar{display:none;}
  .chip{
    flex-shrink:0;
    font-size:calc(12.5px*var(--fs)); font-weight:600;
    padding:8px 14px; border-radius:999px;
    background:var(--paper); border:1px solid var(--line);
    color:var(--ink-soft);
    cursor:pointer;
    white-space:nowrap;
  }
  .chip.active{ background:var(--moss); border-color:var(--moss); color:#fff; }

  /* ---------- sitter / pet cards ---------- */
  .card{
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:20px;
    padding:14px;
    margin-bottom:14px;
    display:flex; gap:12px;
    cursor:pointer;
    transition:transform .15s ease;
  }
  .card:active{ transform:scale(0.98); }
  .thumb{
    width:78px;height:78px;border-radius:14px;flex-shrink:0;
    background-size:cover; background-position:center;
    display:flex; align-items:flex-end; justify-content:flex-end;
    position:relative;
  }
  .heart-btn{
    position:absolute; top:5px; right:5px; width:24px; height:24px; border-radius:50%;
    background:var(--glass); display:flex; align-items:center; justify-content:center;
    color:var(--stamp); cursor:pointer; z-index:2;
  }
  .heart-btn svg{ width:13px; height:13px; }
  .heart-btn.active svg{ fill:var(--stamp); }
  .hero-img .heart-btn{ top:16px; right:16px; width:38px; height:38px; }
  .hero-img .heart-btn svg{ width:18px; height:18px; }
  .card-body{flex:1; min-width:0;}
  .card-toprow{display:flex; justify-content:space-between; align-items:flex-start; gap:6px;}
  .card-name{font-family:'Fraunces',serif; font-weight:600; font-size:calc(16px*var(--fs));}
  .rating{
    display:flex; align-items:center; gap:3px;
    font-family:'IBM Plex Mono',monospace; font-size:calc(12px*var(--fs)); font-weight:600;
    color:var(--gold-deep); flex-shrink:0;
  }
  .card-loc{font-size:calc(12.5px*var(--fs)); color:var(--ink-soft); margin:2px 0 6px; display:flex; align-items:center; gap:4px;}
  .tagrow{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:6px;}
  .tag{
    font-size:calc(11px*var(--fs)); font-weight:600; color:var(--moss-deep);
    background:rgba(110,143,114,0.14);
    padding:3px 8px; border-radius:8px;
  }
  .price{font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:calc(13.5px*var(--fs));}
  .price span{color:var(--ink-soft); font-weight:400; font-size:calc(11.5px*var(--fs));}

  /* ---------- section label ---------- */
  .section-label{
    font-family:'IBM Plex Mono',monospace;
    font-size:calc(11px*var(--fs)); font-weight:600; letter-spacing:.1em; text-transform:uppercase;
    color:var(--ink-soft); margin:22px 0 10px;
  }

  /* ---------- onboarding ---------- */
  .onboard{
    height:100%; max-width:460px; margin:0 auto; display:flex; flex-direction:column; justify-content:center;
    padding:0 22px 60px; text-align:center; position:relative;
  }
  .onboard .mark-lg{
    width:64px;height:64px;flex-shrink:0;border-radius:20px; background:var(--fill); color:var(--gold);
    display:flex;align-items:center;justify-content:center; margin:0 auto 18px;
  }
  .onboard h1{
    font-family:'Fraunces',serif; font-size:calc(30px*var(--fs)); font-weight:600; margin:0 0 8px; line-height:1.15;
  }
  .onboard p.tag{

  .trustbadge{
    display:flex; align-items:center; gap:5px;
    font-size:calc(11px*var(--fs)); font-weight:600; color:var(--moss-deep);
    background:rgba(110,143,114,0.14);
    padding:5px 10px 5px 8px; border-radius:999px;
  }
  .trustbadge svg{width:12px;height:12px;flex-shrink:0;}
  .trustbadge.instant{ color:var(--gold-deep); background:rgba(227,162,59,0.18); }
  .responsetime{
    display:flex; align-items:center; gap:6px; font-size:calc(12px*var(--fs)); color:var(--ink-soft);
    margin:8px 0 2px;
  }
  .responsetime svg{width:13px;height:13px;flex-shrink:0;color:var(--moss-deep);}

  /* ---------- stay updates ---------- */
  .stayupdate{
    display:flex; gap:12px; background:var(--paper); border:1px solid var(--line);
    border-radius:16px; padding:10px; margin-bottom:10px;
  }
  .su-img{width:64px;height:64px;border-radius:12px;flex-shrink:0; background-size:cover; background-position:center;}
  .su-body{flex:1; min-width:0;}
  .su-body p{font-size:calc(13px*var(--fs)); margin:0 0 4px; line-height:1.4;}
  .su-body span{font-size:calc(11px*var(--fs)); color:var(--ink-soft);}

  /* ---------- star picker (reviews) ---------- */
  .starpicker{display:flex; gap:6px;}
  .starpicker span{width:26px;height:26px; display:flex; align-items:center; justify-content:center; color:var(--line); cursor:pointer;}
  .starpicker span svg{width:22px;height:22px;}
  .starpicker span.filled{color:var(--gold);}

  /* ---------- SOS ---------- */
  .sos-btn{ border-color:var(--stamp) !important; color:var(--stamp) !important; display:flex; align-items:center; gap:8px; justify-content:center; }
  .sos-btn svg{width:16px;height:16px;}
  .sos-banner{
    background:rgba(193,68,46,0.1); border:1.5px solid rgba(193,68,46,0.3); border-radius:16px;
    padding:14px; display:flex; gap:10px; align-items:flex-start; margin-bottom:18px; color:var(--stamp);
  }
  .sos-banner svg{width:20px;height:20px;flex-shrink:0;margin-top:1px;}
  .sos-banner p{margin:0; font-size:calc(12.5px*var(--fs)); line-height:1.5; color:var(--ink);}
  .sos-option{
    display:flex; align-items:center; gap:12px; background:var(--paper); border:1px solid var(--line);
    border-radius:16px; padding:14px; margin-bottom:10px; cursor:pointer;
  }
  .sos-option .soicon{width:38px;height:38px;border-radius:11px; background:rgba(193,68,46,0.12); color:var(--stamp); display:flex; align-items:center; justify-content:center; flex-shrink:0;}
  .sos-option b{display:block; font-size:calc(13.5px*var(--fs));}
  .sos-option span{font-size:calc(11.5px*var(--fs)); color:var(--ink-soft);}

  .stickybar{
    position:sticky; bottom:0; background:linear-gradient(0deg, var(--canvas) 60%, rgba(241,239,226,0));
    padding:18px 0 6px; display:flex; align-items:center; gap:12px;
  }
  .stickybar .pricebox{flex-shrink:0;}
  .stickybar .pricebox b{font-family:'IBM Plex Mono',monospace; font-size:calc(17px*var(--fs));}
  .stickybar .pricebox span{display:block; font-size:calc(11px*var(--fs)); color:var(--ink-soft);}

  /* ---------- form ---------- */
  .field{ margin-bottom:14px; }
  .field label{ font-size:calc(12px*var(--fs)); font-weight:600; color:var(--ink-soft); display:block; margin-bottom:6px; text-transform:uppercase; letter-spacing:.05em;}
  .field input, .field select, .field textarea{
    width:100%; border:1.5px solid var(--line); border-radius:12px; padding:12px 13px;
    font-family:'Inter',sans-serif; font-size:calc(14px*var(--fs)); color:var(--ink); background:var(--paper);
    outline:none;
  }
  .field textarea{resize:vertical; min-height:70px;}
  .field-row{display:flex; gap:10px;}
  .field-row .field{flex:1; min-width:0;}
  .field input, .field select{ min-width:0; max-width:100%; }

  /* ---------- ticket / pawcation pass ---------- */
  .ticket{
    background:var(--paper);
    border-radius:22px;
    position:relative;
    box-shadow: 0 14px 30px -14px rgba(30,58,43,0.3);
    margin-bottom:18px;
    overflow:visible;
  }
  .ticket-top{ padding:20px 20px 16px; position:relative; }
  .ticket-brand{ display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;}
  .ticket-brand .tb-name{ font-family:'Fraunces',serif; font-weight:700; font-size:calc(15px*var(--fs));}
  .stampbadge{
    font-family:'IBM Plex Mono',monospace; font-size:calc(10.5px*var(--fs)); font-weight:700;
    color:var(--stamp); border:1.5px solid var(--stamp); border-radius:8px;
    padding:3px 8px; transform:rotate(-6deg); letter-spacing:.05em;
  }
  .ticket-route{ display:flex; align-items:center; gap:10px; margin-bottom:14px;}
  .ticket-route .pt{flex:1;}
  .ticket-route .pt b{display:block; font-family:'IBM Plex Mono',monospace; font-size:calc(19px*var(--fs));}
  .ticket-route .pt span{font-size:calc(10.5px*var(--fs)); color:var(--ink-soft); text-transform:uppercase; letter-spacing:.05em;}
  .ticket-route .dots{flex:1; border-top:2px dotted var(--line); position:relative; top:-2px;}
  .ticket-grid{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; }
  .ticket-grid div span{display:block; font-size:calc(9.5px*var(--fs)); color:var(--ink-soft); text-transform:uppercase; letter-spacing:.05em; margin-bottom:3px;}
  .ticket-grid div b{font-family:'IBM Plex Mono',monospace; font-size:calc(12.5px*var(--fs));}
  .tear{
    position:relative; height:0; border-top:2px dashed var(--line); margin:0 0;
  }
  .tear::before, .tear::after{
    content:''; position:absolute; top:-11px; width:22px; height:22px; border-radius:50%;
    background: #DCD8C1;
  }
  .tear::before{ left:-31px; }
  .tear::after{ right:-31px; }
  .ticket-bottom{ padding:16px 20px 20px; display:flex; justify-content:space-between; align-items:center;}
  .ticket-code{ font-family:'IBM Plex Mono',monospace; font-size:calc(11px*var(--fs)); color:var(--ink-soft); letter-spacing:.05em;}
  .pawstamp{ color:var(--moss-deep); }

  .emptystate{ text-align:center; padding:60px 20px; color:var(--ink-soft); }
  .emptystate .ico{ margin-bottom:14px; opacity:.5; }
  .emptystate h3{font-family:'Fraunces',serif; font-size:calc(17px*var(--fs)); color:var(--ink); margin:0 0 6px;}
  .emptystate p{font-size:calc(13px*var(--fs)); margin:0;}

  /* ---------- messages ---------- */
  .msgrow{ display:flex; gap:12px; align-items:center; padding:12px 0; border-bottom:1px solid var(--line); cursor:pointer;}
  .avatar{ width:46px;height:46px;border-radius:50%; background-size:cover; background-position:center; flex-shrink:0; }
  .msgrow .mbody{flex:1; min-width:0;}
  .msgrow .mtop{display:flex; justify-content:space-between; font-size:calc(13.5px*var(--fs));}
  .msgrow .mtop b{font-weight:600;}
  .msgrow .mtop span{font-size:calc(11px*var(--fs)); color:var(--ink-soft);}
  .msgrow p{margin:2px 0 0; font-size:calc(12.5px*var(--fs)); color:var(--ink-soft); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .unreaddot{width:8px; height:8px; border-radius:50%; background:var(--stamp); flex-shrink:0;}

  /* ---------- chat thread ---------- */
  .chat-header{ display:flex; align-items:center; gap:10px; margin-bottom:14px; }
  .chat-header .avatar{ width:36px;height:36px;border-radius:50%;background-size:cover;background-position:center; }
  .chat-header b{ font-family:'Fraunces',serif; font-size:calc(15.5px*var(--fs)); }
  .chat-messages{ display:flex; flex-direction:column; gap:8px; padding-bottom:12px; }
  .chat-bubble{ max-width:78%; padding:10px 13px; border-radius:16px; font-size:calc(13.5px*var(--fs)); line-height:1.45; }
  .chat-bubble p{ margin:0; }
  .chat-bubble span{ display:block; font-size:calc(10px*var(--fs)); margin-top:4px; opacity:.75; }
  .chat-bubble.them span{ color:var(--ink-soft); opacity:1; }
  .chat-bubble.them{ align-self:flex-start; background:var(--paper); border:1px solid var(--line); border-bottom-left-radius:4px; }
  .chat-bubble.me{ align-self:flex-end; background:var(--fill); color:var(--on-fill); border-bottom-right-radius:4px; }
  .chat-inputbar{
    position:sticky; bottom:0; display:flex; gap:8px; align-items:center;
    background:var(--canvas); padding:10px 0 4px; margin-top:auto;
  }
  .chat-inputbar input{
    flex:1; border:1.5px solid var(--line); border-radius:999px; padding:11px 16px;
    font-family:'Inter',sans-serif; font-size:calc(13.5px*var(--fs)); background:var(--paper); outline:none;
  }
  .sendbtn{
    width:42px; height:42px; border-radius:50%; background:var(--fill); color:var(--gold);
    border:none; display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0;
  }
  .sendbtn svg{ width:17px; height:17px; }

  /* ---------- mini calendar ---------- */
  .cal-grid-head{ display:grid; grid-template-columns:repeat(7,1fr); font-size:calc(10px*var(--fs)); color:var(--ink-soft); text-align:center; margin-bottom:5px; }
  .cal-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:5px; margin-bottom:10px; }
  .cal-cell{
    aspect-ratio:1; display:flex; align-items:center; justify-content:center;
    border-radius:8px; font-size:calc(11px*var(--fs)); font-weight:600;
    background:rgba(110,143,114,0.12); color:var(--moss-deep);
  }
  .cal-cell.blocked{ background:rgba(193,68,46,0.12); color:var(--stamp); }
  .cal-cell.empty{ background:transparent; }
  .cal-cell.editable{ cursor:pointer; }
  .cal-legend{ display:flex; gap:14px; font-size:calc(11px*var(--fs)); color:var(--ink-soft); margin-bottom:18px; }
  .cal-legend .caldot{ width:8px; height:8px; border-radius:50%; display:inline-block; margin-right:4px; }
  .cal-legend .caldot.open{ background:var(--moss); }
  .cal-legend .caldot.blocked{ background:var(--stamp); }

  /* ---------- profile ---------- */
  .profile-head{ text-align:center; padding:10px 0 20px; }
  .profile-head .avatar{ width:84px; height:84px; margin:0 auto 12px; }
  .profile-head h2{ font-family:'Fraunces',serif; font-size:calc(20px*var(--fs)); margin:0 0 2px;}
  .profile-head p{ font-size:calc(12.5px*var(--fs)); color:var(--ink-soft); margin:0;}
  .profile-row{
    display:flex; align-items:center; justify-content:space-between;
    background:var(--paper); border:1px solid var(--line); padding:15px 16px; border-radius:16px; margin-bottom:10px;
    font-size:calc(13.5px*var(--fs)); font-weight:500; cursor:pointer;
  }
  .profile-row .left{display:flex; align-items:center; gap:12px;}

  /* ---------- bottom nav ---------- */
  .bottomnav{
    position:absolute; bottom:0; left:0; right:0;
    background:var(--glass); backdrop-filter:blur(10px);
    border-top:1px solid var(--line);
    display:flex; padding:10px 10px calc(env(safe-area-inset-bottom, 0px) + 10px);
  }
  .navitem{
    flex:1; display:flex; flex-direction:column; align-items:center; gap:4px;
    color:var(--ink-soft); cursor:pointer; font-size:calc(10.5px*var(--fs)); font-weight:600;
  }
  .navitem.active{ color:var(--ink); }

  /* toast */
  .toast{
    position:absolute; left:20px; right:20px; bottom:100px;
    background:var(--fill); color:var(--on-fill);
    padding:14px 16px; border-radius:14px;
    display:flex; align-items:center; gap:10px;
    font-size:calc(13px*var(--fs)); font-weight:500;
    box-shadow:0 10px 24px rgba(0,0,0,0.25);
    z-index:80;
    opacity:0; transform:translateY(10px); pointer-events:none;
    transition:.25s ease;
  }
  .toast.show{ opacity:1; transform:translateY(0); }

  .fade-in{ animation: fadein .25s ease; }
  @keyframes fadein{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }

  /* ---------- trust banner ---------- */
  .trustnote{
    display:flex; gap:10px; background:rgba(110,143,114,0.12);
    border:1px solid rgba(110,143,114,0.3); border-radius:14px;
    padding:12px 14px; font-size:calc(12px*var(--fs)); line-height:1.5; color:var(--moss-deep);
    margin-bottom:18px;
  }
  .trustnote svg{flex-shrink:0; margin-top:1px;}

  .statuspill{
    display:inline-flex; align-items:center; gap:6px;
    font-size:calc(11.5px*var(--fs)); font-weight:700; letter-spacing:.03em;
    padding:6px 12px; border-radius:999px; margin-bottom:18px;
  }
  .statuspill.unverified{ background:rgba(193,68,46,0.12); color:var(--stamp); }
  .statuspill.pending{ background:rgba(227,162,59,0.16); color:var(--gold-deep); }
  .statuspill.verified{ background:rgba(110,143,114,0.16); color:var(--moss-deep); }
  .statuspill .dot{ width:6px;height:6px;border-radius:50%; background:currentColor; }

  .upload-tile{
    position:relative;
    aspect-ratio:1/1;
    border-radius:18px;
    border:1.5px dashed var(--line);
    background:var(--paper);
    background-size:cover; background-position:center;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:6px; cursor:pointer; overflow:hidden;
    color:var(--ink-soft);
  }
  .upload-tile.filled{ border-style:solid; border-color:var(--moss); }
  .upload-tile.filled .uplabel{
    position:absolute; bottom:0; left:0; right:0;
    background:linear-gradient(0deg, rgba(14,26,18,0.75), rgba(14,26,18,0));
    color:#fff; padding:20px 8px 8px; font-size:calc(11px*var(--fs)); font-weight:600; text-align:center;
  }
  .upload-tile .uplabel-empty{ font-size:calc(11.5px*var(--fs)); font-weight:600; text-align:center; padding:0 8px; }
  .upload-tile input[type=file]{ position:absolute; inset:0; opacity:0; cursor:pointer; }
  .upload-tile .checkmark{
    position:absolute; top:8px; right:8px; width:22px;height:22px;border-radius:50%;
    background:var(--moss); color:#fff; display:flex; align-items:center; justify-content:center;
  }
  .upload-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:8px; }
  .upload-grid .full{ grid-column:1/-1; }

  /* ---------- credit card visual: true 3D flip ---------- */
  .cc-perspective{ position:relative; margin-bottom:20px; perspective:1400px; }
  .cc-flipper{
    position:relative; width:100%; aspect-ratio:1.586/1;
    transform-style:preserve-3d; -webkit-transform-style:preserve-3d;
    transform:rotateY(0deg);
    transition:transform .8s cubic-bezier(.45,.05,.15,1);
    border-radius:20px;
  }
  .cc-flipper.flipped{ transform:rotateY(180deg); }

  .cc-face{
    position:absolute; inset:0; border-radius:20px;
    backface-visibility:hidden; -webkit-backface-visibility:hidden;
    overflow:hidden; color:#F1EFE2;
    box-shadow:0 10px 20px -10px rgba(20,32,24,0.28);
    /* extra safety net: force the hidden face fully transparent exactly at the edge-on
       midpoint, so no browser can let the "wrong" face ghost/bleed through */
    transition:opacity 0s linear .4s;
  }
  .cc-flipper:not(.flipped) .cc-back{ opacity:0; }
  .cc-flipper.flipped .cc-front{ opacity:0; }
  .cc-front{
    background: linear-gradient(135deg, #1E3A2B 0%, #2C4A36 55%, #3E5C45 100%);
    padding:20px 22px; display:flex; flex-direction:column; justify-content:space-between;
  }
  .cc-front::after{
    content:''; position:absolute; width:200px; height:200px; border-radius:50%;
    background:radial-gradient(circle, rgba(227,162,59,0.25), transparent 70%);
    top:-80px; right:-60px;
  }
  .cc-back{
    background: linear-gradient(135deg, #2C4A36 0%, #1E3A2B 100%);
    transform:rotateY(180deg);
    display:flex; flex-direction:column;
  }
  /* a genuine, physically-positioned right-hand edge — hinges with the card in real 3D
     space, so it naturally comes into view exactly when the card is edge-on, giving it
     real thickness instead of vanishing to a flat line. Solid (no transparency) so
     nothing behind it can show through, and inset slightly with a small radius of its
     own so it doesn't create a seam against the face's much larger corner radius. */
  .cc-edge{
    position:absolute; top:3px; right:0; width:8px; height:calc(100% - 6px);
    background:linear-gradient(90deg, #0C130E 0%, #4C6A53 45%, #0C130E 100%);
    transform-origin:right center;
    transform:rotateY(90deg);
    border-radius:3px;
    backface-visibility:hidden; -webkit-backface-visibility:hidden;
  }
  .cc-stripe{ width:100%; height:38px; background:#14201A; margin-top:20px; }
  .cc-sigrow{ display:flex; align-items:center; gap:10px; margin:18px 20px 0; }
  .cc-sigline{
    flex:1; height:34px; border-radius:4px;
    background:repeating-linear-gradient(45deg, #E9E5D6, #E9E5D6 3px, #DDD8C4 3px, #DDD8C4 6px);
  }
  .cc-cvvbox{
    background:#F1EFE2; color:#1E3A2B; border-radius:4px;
    padding:8px 12px; font-family:'IBM Plex Mono',monospace; font-style:italic; font-weight:600; font-size:calc(13px*var(--fs));
    min-width:44px; text-align:center;
  }
  .cc-backbottom{
    display:flex; align-items:center; gap:8px; margin:14px 20px 0;
    font-size:calc(9.5px*var(--fs)); text-transform:uppercase; letter-spacing:.06em; opacity:.8;
  }
  .cc-backbottom b{ font-family:'IBM Plex Mono',monospace; font-size:calc(13px*var(--fs)); text-transform:none; letter-spacing:.03em; opacity:1;}

  .cc-top{ display:flex; justify-content:space-between; align-items:flex-start; z-index:1; }
  .cc-chip{ width:38px; height:28px; border-radius:6px; background:linear-gradient(135deg,#E3A23B,#C67F1E); }
  .cc-scheme{
    font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:calc(11.5px*var(--fs));
    letter-spacing:.06em; text-transform:uppercase;
    border-radius:6px; padding:4px 9px;
    background:rgba(241,239,226,0.16); color:#F1EFE2;
    transition:background .2s;
  }
  .cc-bankline{
    font-family:'Inter',sans-serif; font-size:calc(11px*var(--fs)); opacity:.75; margin-top:4px;
    display:flex; align-items:center; gap:5px; min-height:15px;
  }
  .cc-bankline .spinner{
    width:9px;height:9px;border-radius:50%;border:1.5px solid rgba(241,239,226,0.4);
    border-top-color:#F1EFE2; animation:spin .7s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .cc-number{
    font-family:'IBM Plex Mono',monospace; font-size:calc(19px*var(--fs)); font-weight:600; letter-spacing:.12em; z-index:1;
    text-shadow: 0 1px 1px rgba(0,0,0,0.5), 0 -1px 0 rgba(255,255,255,0.15);
  }
  .cc-bottom{ display:flex; justify-content:space-between; align-items:flex-end; z-index:1; }
  .cc-bottom div span{ display:block; font-size:calc(8.5px*var(--fs)); opacity:.7; text-transform:uppercase; letter-spacing:.08em; margin-bottom:2px;}
  .cc-bottom div b{ font-family:'IBM Plex Mono',monospace; font-size:calc(12.5px*var(--fs)); font-weight:500; }


  .savedcard{
    display:flex; align-items:center; gap:12px;
    background:var(--paper); border:1px solid var(--line); border-radius:16px;
    padding:14px; margin-bottom:10px;
  }
  .savedcard .ccmini{
    width:44px; height:30px; border-radius:6px; flex-shrink:0;
    background:linear-gradient(135deg, #1E3A2B, #3E5C45);
    display:flex; align-items:center; justify-content:center; color:var(--gold);
    font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:calc(9.5px*var(--fs)); color:#fff; letter-spacing:.02em;
  }
  .savedcard b{ font-size:calc(13.5px*var(--fs)); display:block; }
  .savedcard span{ font-size:calc(11.5px*var(--fs)); color:var(--ink-soft); }
  .secure-note{
    display:flex; align-items:center; gap:8px; font-size:calc(11.5px*var(--fs)); color:var(--ink-soft);
    margin-top:2px; margin-bottom:18px;
  }

  /* ---------- pet grid ---------- */
  .petgrid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:14px; }
  @media (min-width:760px){
    .petgrid{ grid-template-columns:repeat(auto-fill, minmax(180px,1fr)); }
  }
  .petcard{
    background:var(--paper); border:1px solid var(--line); border-radius:18px; overflow:hidden; cursor:pointer;
  }
  .petcard .pimg{ height:110px; background-size:cover; background-position:center; }
  .petcard .pinfo{ padding:10px 12px 12px; }
  .petcard b{ font-family:'Fraunces',serif; font-size:calc(14px*var(--fs)); display:block; }
  .petcard span{ font-size:calc(11px*var(--fs)); color:var(--ink-soft); }
  .addpet-tile{
    border:1.5px dashed var(--line); border-radius:18px;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px;
    color:var(--ink-soft); font-size:calc(12px*var(--fs)); font-weight:600; cursor:pointer;
    min-height:150px;
  }

  ::selection{ background:var(--gold); color:#fff; }

  /* ---------- loading screen ---------- */
  .loader{
    position:fixed; inset:0; z-index:1000;
    background: linear-gradient(180deg,#1E3A2B, #16291D);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:26px;
    transition: opacity .5s ease, visibility .5s ease;
  }
  .loader.hide{ opacity:0; visibility:hidden; pointer-events:none; }
  .loader-brand{
    display:flex; align-items:center; gap:10px;
    font-family:'Fraunces',serif; font-weight:700; font-size:calc(22px*var(--fs)); color:var(--canvas);
  }
  .loader-brand .mk{
    width:38px; height:38px; border-radius:11px; background:var(--gold);

/* ============ AVAILABILITY CALENDAR (fixed demo month: July 2026) ============ */
const CAL_MONTH = { year:2026, month:6, label:'July 2026' };
function renderMiniCalendar(blockedDates, editable){
  const year = CAL_MONTH.year, month = CAL_MONTH.month;
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const firstDow = new Date(year, month, 1).getDay();
  const cells = [];
  for(let i=0;i<firstDow;i++) cells.push('<div class="cal-cell empty"></div>');
  for(let d=1; d<=daysInMonth; d++){
    const iso = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const blocked = blockedDates.includes(iso);
    cells.push(`<div class="cal-cell ${blocked?'blocked':'open'} ${editable?'editable':''}" ${editable?`data-action="toggle-avail-${iso}"`:''}>${d}</div>`);
  }
  return `
    <div class="cal-grid-head">${['S','M','T','W','T','F','S'].map(d=>`<div>${d}</div>`).join('')}</div>
    <div class="cal-grid">${cells.join('')}</div>
    <div class="cal-legend"><span><i class="caldot open"></i>Available</span><span><i class="caldot blocked"></i>Not available</span></div>
  `;
}
function isRangeBlocked(s, checkIn, checkOut){
  if((!s.blockedDates || !s.blockedDates.length) && !(s.holidays && s.holidays.length)) return false;
  let d = new Date(checkIn+'T00:00:00');
  const end = new Date(checkOut+'T00:00:00');
  while(d < end){
    const iso = isoLocal(d);
    if((s.blockedDates||[]).includes(iso) || holidayBlocked(s, iso)) return true;
    d.setDate(d.getDate()+1);
  }
  return false;
}

const SUPER_RULES = [

];
function superMetrics(s){
  if(s.id==='me'){
    const hs = state.hostStats, done = hostedBookings().filter(b=>b.status==='completed').length;
    return { rating:hs.rating, responseRate:hs.responseRate, responseMinutes:hs.responseMinutes, stays:hs.stays+done, occupancy:earningsSummary().occupancy };
  }
  return { rating:s.rating, responseRate:s.stats && s.stats.responseRate, responseMinutes:s.responseMinutes, stays:s.reviews, occupancy:s.stats && s.stats.occupancy };
}
function superEval(s){
  const m = superMetrics(s);
  const checks = SUPER_RULES.map(r => { const have = m[r.key]; const pass = have!=null && (r.max ? have<=r.need : have>=r.need); return { ...r, have, pass }; });
  return { ok: checks.every(c=>c.pass), checks, passed: checks.filter(c=>c.pass).length };
}
function isSuper(s){ return !!s && superEval(s).ok; }

function fileToImage(file, max){
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => { const img = new Image(); img.onload = () => {
      const sc = Math.min(1, (max||1000)/Math.max(img.width, img.height)), c = document.createElement('canvas');
      c.width = Math.round(img.width*sc); c.height = Math.round(img.height*sc); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      res(c.toDataURL('image/jpeg', 0.82)); }; img.onerror = rej; img.src = fr.result; };
    fr.onerror = rej; fr.readAsDataURL(file);
  });
}

const FIRST_OFFER = { value:15, cap:300 };
const PROMOS = {
  PAWS100:{ type:'fixed', value:100, min:600, exp:'2026-07-26', title:'₺100 off stays over ₺600' },
  PAWS10:{  type:'pct',   value:10,  cap:200, exp:'2026-12-31', title:'10% off any stay (up to ₺200)' },
  YAZ10:{   type:'pct',   value:10,  cap:200, exp:'2026-06-30', title:'Summer launch — 10% off' },

function promoEligibleFirst(){
  return !state.promo.firstUsed && !state.bookings.some(b => !b.seed && b.hostName!=='You' && !b.trainerBooking && b.status!=='cancelled');
}
function promoSubtotal(q){ return q.lines.filter(l => l.label!=='Pawcation Protect' && !l.promo).reduce((a,l)=>a+l.amount, 0); }
function evalCode(raw, q, protect){
  const code = String(raw||'').trim().toUpperCase(); if(!code) return null;
  const sub = promoSubtotal(q);
  const rw = state.redeemedRewards.find(r => String(r.code).toUpperCase()===code);
  if(rw){
    if(rw.used) return { error:'This reward code was already used.' };
    if(rw.rewardId==='r2'){ if(!protect) return { error:'Add Pawcation Protect to use this reward.' }; return { code, kind:'reward', discount:99, label:'Reward · Free Protect' }; }
    return { code, kind:'reward', discount:Math.min(50, sub), label:'Reward · ₺50 off' };
  }
  const p = PROMOS[code];
  if(!p) return { error:'That code isn’t valid.' };
  if(p.exp < DEMO_TODAY) return { error:'This code has expired.' };
  if(state.promo.used.includes(code)) return { error:'You’ve already used this code.' };
  if(p.min && sub < p.min) return { error:`This code needs a stay of at least ₺${p.min}.` };
  const d = p.type==='pct' ? Math.min(p.cap||1e9, Math.round(sub*p.value/100)) : Math.min(p.value, sub);
  return { code, kind:'code', discount:d, label:code };
}
function resolvePromo(q, protect){
  const entered = state.form.promoCode ? evalCode(state.form.promoCode, q, protect) : null;
  const first = promoEligibleFirst() ? { code:'first', kind:'first', discount:Math.min(FIRST_OFFER.cap, Math.round(promoSubtotal(q)*FIRST_OFFER.value/100)), label:'First booking −15%' } : null;
  let best = null;
  if(first && first.discount>0) best = first;
  if(entered && entered.discount>0 && (!best || entered.discount>best.discount)) best = entered;
  return { best, entered, first };
}

async function systemNotify(title, body){
  try{
    if(typeof Notification==='undefined' || Notification.permission!=='granted') return false;
    const reg = navigator.serviceWorker && navigator.serviceWorker.getRegistration ? await navigator.serviceWorker.getRegistration() : null;
    if(reg && reg.showNotification) await reg.showNotification(title, { body, icon:'icons/icon-192.png', badge:'icons/icon-192.png', tag:'pawcation-'+title.slice(0,20) });
    else new Notification(title, { body, icon:'icons/icon-192.png' });
    return true;
  }catch(e){ return false; }
}
function maybeSystemNotify(){

/* ============ ROUND 11 — MONEY FLOW (payment · escrow · commission · receipts · cancellation) ============ */
/* NOTE: every rate and window below is a PLACEHOLDER for the demo. Real money movement must run through a licensed
   payment provider (iyzico / PayTR marketplace sub-merchants) and be calculated server-side. */
const COMMISSION = 0.15;           // platform commission on the stay amount, taken from the sitter's side
const RELEASE_DELAY_DAYS = 1;      // escrow is released this many days after check-out
const DEMO_IBAN = 'TR00 0000 0000 0000 0000 0000 00';
const PAY_METHODS = {
  card:  { label:'Credit / debit card',          note:'Visa, Mastercard or Amex' },
  troy:  { label:'Troy card',                    note:'Domestic Troy-branded cards' },
  havale:{ label:'Bank transfer (havale / EFT)', note:'Transfer within 24 hours to keep the booking' },
};
const PAY_STATUS = {
  authorized:{ label:'Card on hold',            tone:'wait', hint:'You are charged when the sitter accepts.' },
  awaiting:  { label:'Waiting for your transfer',tone:'wait', hint:'Send the transfer within 24 hours or the booking is cancelled.' },
  held:      { label:'Held by Pawcation',       tone:'ok',   hint:'The sitter is paid after check-out.' },
  released:  { label:'Paid out to sitter',      tone:'done', hint:'The stay is over and the payment was released.' },
  refunded:  { label:'Refunded',                tone:'done', hint:'The full amount was returned.' },
  partial:   { label:'Partly refunded',         tone:'done', hint:'Part of the amount was returned under the cancellation policy.' },
  kept:      { label:'Not refundable',          tone:'done', hint:'Under the cancellation policy this was paid to the sitter.' },
};
const SITTER_POLICY = { s1:'flexible', s2:'moderate', s3:'flexible', s4:'strict', s5:'moderate', s6:'strict', s7:'moderate', s8:'flexible' };
SITTERS.forEach(s => { s.policy = SITTER_POLICY[s.id] || 'moderate'; });
const CANCEL_POLICIES = {
  flexible:{ label:'Flexible', blurb:'Best for last-minute plans. Free cancellation until 2 days before check-in.', tiers:[{ days:2, pct:100 }, { days:0, pct:50 }] },
  moderate:{ label:'Moderate', blurb:'The Pawcation standard. Free cancellation until 7 days before check-in.',     tiers:[{ days:7, pct:100 }, { days:3, pct:50 }, { days:0, pct:0 }] },
  strict:  { label:'Strict',   blurb:'For busy seasons. Free cancellation until 14 days before check-in.',          tiers:[{ days:14, pct:100 }, { days:7, pct:50 }, { days:0, pct:0 }] },
};
function refundPct(key, daysBefore){
  const p = CANCEL_POLICIES[key] || CANCEL_POLICIES.moderate;
  if(daysBefore < 0) return 0;
  for(const t of p.tiers) if(daysBefore >= t.days) return t.pct;
  return 0;
}
function tierRows(key){
  const p = CANCEL_POLICIES[key] || CANCEL_POLICIES.moderate, out = [];
  p.tiers.forEach((t, i) => {
    const prev = i ? p.tiers[i-1].days : null;
    const when = i===0 ? `${t.days}+ days before check-in` : t.days===0 ? `Less than ${prev} days before check-in` : `${t.days}–${prev} days before check-in`;
    out.push([when, t.pct ? `${t.pct}% refund` : 'No refund']);
  });
  return out;
}
function policyCardHTML(key, highlightPct){
  const p = CANCEL_POLICIES[key] || CANCEL_POLICIES.moderate;
  const rows = tierRows(key), cur = p.tiers.map(t=>t.pct);
  return `<div class="section-label">Cancellation policy</div>
  <div class="policycard"><div class="pc-head"><span class="trustbadge">${ICON.shield}${p.label}</span></div><p>${p.blurb}</p>
    ${rows.map((r,i)=>`<div class="pc-row ${highlightPct!=null && cur[i]===highlightPct ? 'now' : ''}"><span>${r[0]}</span><b>${r[1]}</b></div>`).join('')}
    <div class="pc-row"><span>After check-in</span><b>Handled by support</b></div></div>`;
}

/* ---------- money maths ---------- */
function bkISO(b, which){
  const k = which==='in' ? 'checkInISO' : 'checkOutISO'; if(b[k]) return b[k];
  const p = mdParts(which==='in' ? b.checkIn : b.checkOut); return p ? isoLocal(new Date(2026, p.month, p.day)) : null;
}
function stayParts(lines){
  const sum = f => lines.filter(f).reduce((a,l)=>a+l.amount, 0);
  return { protect:sum(l=>l.label==='Pawcation Protect'), promo:-sum(l=>l.promo), stay:sum(l=>l.label!=='Pawcation Protect' && !l.promo) };
}
function finOf0(b){
  let lines = b.lines;
  if(!lines){
    if(b.hostName==='You') lines = [{ label:'Stay', amount:b.gross || b.earn || 0 }];
    else { const s = sitterById(b.sitterId), a = bkISO(b,'in'), z = bkISO(b,'out');
      lines = (s && a && z && z>a) ? priceQuote(s, a, z, b.pets||1, !!b.protect).lines : [{ label:'Stay', amount:b.total || 0 }]; }
  }
  const { stay, protect, promo } = stayParts(lines);
  const commission = Math.round(stay*COMMISSION);
  return { lines, stay, protect, promo, total:stay+protect-promo, commission, net:stay-commission };
}
function hostMoney(gross){ const c = Math.round(gross*COMMISSION); return { gross, commission:c, earn:gross-c, payment:{ method:'card', status:'held' } }; }
function paymentOf(b){ return b.payment || { method:'card', status: b.status==='completed' ? 'released' : b.status==='cancelled' ? 'refunded' : b.status==='pending' ? 'authorized' : 'held' }; }
function releaseISO(b){ const z = bkISO(b,'out'); return z ? addDaysISO(z, RELEASE_DELAY_DAYS) : null; }
function releaseEscrow(b){ const p = paymentOf(b); if(p.status==='held' || p.status==='authorized') b.payment = { ...p, status:'released', releasedAt:'Just now' }; }
function cancelQuote0(b, who){
  const f = finOf(b), pay = paymentOf(b), inISO = bkISO(b,'in');
  const days = inISO ? daysBetweenISO(DEMO_TODAY, inISO) : 99, policy = b.policy || 'moderate';
  const pct = who==='sitter' ? 100 : b.status==='pending' ? 100 : refundPct(policy, days);
  const refundStay = Math.round((f.stay - f.promo) * pct/100), refundProtect = days>=0 ? f.protect : 0;
  const ownerRefund = refundStay + refundProtect, keptStay = f.stay - Math.round(f.stay*pct/100);
  const commissionKept = Math.round(keptStay*COMMISSION);
  return { pct, days, policy, f, who, ownerRefund, ownerPays:f.total-ownerRefund, sitterNet:keptStay-commissionKept, commissionKept, started:days<0, hold:pay.status==='authorized' || pay.status==='awaiting' };
}

function stepHTML(label, done, cur){ return `<div class="pstep ${done?'done':''} ${cur?'cur':''}"><i></i><span>${label}</span></div>`; }
function paymentCardHTML(b, isHost){
  const pay = paymentOf(b), st = PAY_STATUS[pay.status] || PAY_STATUS.held, f = finOf(b), rel = releaseISO(b);

function doCancel(id){
  const b = state.bookings.find(x=>x.id===id); if(!b) return;
  const who = b.hostName==='You' ? 'sitter' : 'owner', q = cancelQuote(b, who), pay = paymentOf(b);
  const reason = (document.getElementById('cancel-reason')||{}).value || '';
  b.status = 'cancelled'; b.cancelReason = reason;
  b.cancel = { by:who, pct:q.pct, refund:q.ownerRefund, ownerPays:q.ownerPays, sitterNet:q.sitterNet, at:'Just now' };
  b.payment = { ...pay, status: q.ownerRefund>=q.f.total ? 'refunded' : q.ownerRefund>0 ? 'partial' : 'kept', refund:q.ownerRefund };
  toast(who==='sitter' ? 'Cancelled — the owner is refunded in full' : q.ownerRefund ? `Cancelled · ${fmtLine(q.ownerRefund)} refunded` : 'Cancelled · no refund under this policy');
}

function handleMoneyClick(action){
  if(action.startsWith('pay-method-')){ state.form.payMethod = action.replace('pay-method-',''); render(); return true; }
  if(action.startsWith('set-policy-')){ state.myPolicy = action.replace('set-policy-',''); toast('Policy: '+CANCEL_POLICIES[state.myPolicy].label); saveGrowthState(); render(); return true; }
  if(action==='copy-iban'){ copyText(DEMO_IBAN.replace(/\s/g,'')); return true; }
  if(action.startsWith('pay-sim-')){
    const [, , kind, ...rest] = action.split('-'), id = rest.join('-'), b = state.bookings.find(x=>x.id===id); if(!b) return true;
    if(kind==='transfer'){ b.payment = { ...paymentOf(b), status:'held' }; toast('Transfer received — payment held'); }
    else if(kind==='accept'){ b.status = 'confirmed'; b.payment = { ...paymentOf(b), status:'held' }; toast('Sitter accepted — card charged'); }
    else if(kind==='end'){ b.status = 'completed'; releaseEscrow(b); toast('Stay finished — payment released to the sitter'); }
    render(); return true;
  }
  if(action.startsWith('open-receipt-')){ state.receiptReturn = state.screen; go('receipt', { selectedId:action.replace('open-receipt-','') }); return true; }
  if(action==='receipt-print'){ window.print(); return true; }
  if(action.startsWith('receipt-download-')){ const b = state.bookings.find(x=>x.id===action.replace('receipt-download-','')); if(b) downloadFile(`${receiptNo(b)}.html`, 'text/html', standaloneDoc(receiptNo(b), receiptInnerHTML(b))); toast('Receipt downloaded'); return true; }
  if(action==='nav2-receipts'){ go('receipts'); return true; }
  if(action==='nav2-statement'){ go('statement'); return true; }
  if(action.startsWith('stmt-month-')){ state.stmtMonth = action.replace('stmt-month-',''); render(); return true; }
  if(action==='stmt-csv'){ const m = state.stmtMonth || 'Jul'; downloadFile(`pawcation-statement-${m}-2026.csv`, 'text/csv;charset=utf-8', statementCSV(m)); toast('Statement downloaded'); return true; }
  return false;
}

const DOW12 = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const DOW_ORDER = [1,2,3,4,5,6,0];
const DOWN = { tr:['Paz','Pzt','Sal','Çar','Per','Cum','Cmt'], de:['So','Mo','Di','Mi','Do','Fr','Sa'], ru:['Вс','Пн','Вт','Ср','Чт','Пт','Сб'] };
const dowName = d => (DOWN[state.lang] || DOW12)[d];                       // Monday-first display

const BOOSTS = { d3:{ days:3, price:49 }, d7:{ days:7, price:99 }, d30:{ days:30, price:299 } };

/* ---------- services a sitter offers ---------- */
function mySvc(){ return { walk: state.myServices.walk ? [pr12('walk30'), pr12('walk60')] : null, visit: state.myServices.visit ? pr12('visit') : null }; }
function svcOf(s){ const v = s.services || {}; return { walk:v.walk || null, visit:v.visit || null }; }
function hasDaySvc(s){ const v = svcOf(s); return !!(v.walk || v.visit); }

/* ---------- availability rules ---------- */
function holidayBlocked(s, iso){ return (s.holidays||[]).some(h => iso>=h.from && iso<=h.to); }
function dayBlocked(s, iso){
  if((s.blockedDates||[]).includes(iso) || holidayBlocked(s, iso)) return true;
  return !!(s.weekly && s.weekly[dowOf(iso)]===false);
}
function holidayDates(list){
  const out = [];
  (list||[]).forEach(h => { let d = new Date(h.from+'T00:00:00'); const e = new Date(h.to+'T00:00:00'); let n = 0;
    while(d<=e && n++<400){ out.push(isoLocal(d)); d.setDate(d.getDate()+1); } });
  return out;
}
function hoursLabel(h){ h = h || { from:8, to:20 }; return String(h.from).padStart(2,'0')+':00–'+String(h.to).padStart(2,'0')+':00'; }

/* ---------- Plus + boost ---------- */
function plusActive(){ const p = state.plus; return !!(p && (!p.cancelled || p.renewISO >= DEMO_TODAY)); }
function boostActive(){ const b = state.boost; return !!(b && b.untilISO >= DEMO_TODAY); }
function featuredOf(s){ return s.isMe ? boostActive() : !!s.featured; }
function applyPlus(q, protect){
  if(!plusActive()) return;
  const sub = promoSubtotal(q), d = Math.min(PLUS.cap, Math.round(sub*PLUS.pct/100));
  if(d>0){ q.lines.push({ label:'Pawcation Plus · '+PLUS.pct+'% off', amount:-d, promo:true, plus:true }); q.total -= d; }
  if(protect){ q.lines.push({ label:'Plus · Protect included', amount:-99, promo:true, plus:true }); q.total -= 99; }
}
function addBilling(desc, amount){ state.billing.push({ id:'bl'+Date.now(), date:DEMO_TODAY, desc, amount }); }

/* ---------- day-service helpers ---------- */
function firstFree(s){ for(let i=3;i<45;i++){ const iso = addDaysISO(DEMO_TODAY,i); if(!s || !dayBlocked(s, iso)) return iso; } return addDaysISO(DEMO_TODAY,5); }
function dayDefaults(s){ return { date:firstFree(s), slot:'morning', mins:30, visits:1, repeat:'none', days:null, weeks:4 }; }
function dayState(){ const F = state.form; if(!F.day) F.day = dayDefaults(sitterById(state.selectedId)); if(!F.day.days) F.day.days = [dowOf(F.day.date)]; return F.day; }
function dayDates(s, D){
  const dates = [], skipped = [];
  const push = iso => { if(iso < DEMO_TODAY || dayBlocked(s, iso)) skipped.push(iso); else dates.push(iso); };
  if(D.repeat==='none'){ push(D.date); return { dates, skipped }; }
  const d = new Date(D.date+'T00:00:00'), end = new Date(D.date+'T00:00:00'); end.setDate(end.getDate()+D.weeks*7);
  for(; d<end; d.setDate(d.getDate()+1)) if(D.days.includes(d.getDay())) push(isoLocal(d));
  return { dates, skipped };
}
function serviceName(kind, D){ return kind==='walk' ? D.mins+'-min walk' : (D.visits>1 ? 'Home visit ×'+D.visits+' per day' : 'Home visit'); }
function dayQuote(s, F){
  const D = dayState(), sv = svcOf(s), kind = F.service, pets = F.pets||1;
  const { dates, skipped } = dayDates(s, D);
  const unit = kind==='walk' ? (D.mins===60 ? sv.walk[1] : sv.walk[0]) : sv.visit;
  const qty = dates.length * (kind==='visit' ? D.visits : 1);
  const lines = [];
  if(qty) lines.push({ label: kind==='walk' ? `${qty} walk${qty>1?'s':''} × ₺${unit}` : `${qty} home visit${qty>1?'s':''} × ₺${unit}`, amount:qty*unit });
  const stay = lines.reduce((a,l)=>a+l.amount,0), extra = Math.max(0, pets-1);
  if(extra && stay) lines.push({ label:`Additional pets × ${extra} (50%)`, amount:Math.round(stay*0.5)*extra });
  const q = { lines, total:lines.reduce((a,l)=>a+l.amount,0), dates, skipped, unit, qty };
  applyPlus(q, false);
  const r = resolvePromo(q, false);
  if(r.best){ q.lines.push({ label:(r.best.kind==='reward' ? '' : 'Promo · ')+r.best.label, amount:-r.best.discount, promo:true }); q.total -= r.best.discount; q.promo = r.best; }
  q.promoInfo = r; return q;
}
function repeatSummary(D){
  if(D.repeat==='none') return '';
  return 'Weekly · '+DOW_ORDER.filter(d=>D.days.includes(d)).map(d=>dowName(d)).join(', ')+' · '+D.weeks+' weeks';
}

/* ---------- booking: ticket grid, sessions, series cancel ---------- */
function dayGridHTML(b){
  const live = b.day.dates.filter(d=>!d.skipped), done = live.filter(d=>d.done).length;
  return `<div><span>Service</span><b>${serviceName(b.day.kind, b.day)}</b></div><div><span>Sessions</span><b>${done} / ${live.length} done</b></div><div><span>Location</span><b>${b.loc}</b></div>`;
}
function dayBadgeHTML(b){ return b.day && b.day.repeat==='weekly' ? `<div class="protect-badge" style="color:var(--ink-soft);">${ICON.clock}${repeatSummary(b.day)}</div>` : ''; }
function finOf(b){ const f = finOf0(b); if(!b.day || !(b.day.skips||[]).length) return f; const a = daySkipAdj(b), stay = f.stay - a.drop, commission = Math.round(stay*COMMISSION); return { ...f, stay, total:f.total - a.refund, commission, net:stay-commission }; }
function cancelQuote(b, who){ return b.day ? dayCancelQuote(b, who) : cancelQuote0(b, who); }
function daySkipAdj(b){ let drop = 0, refund = 0; ((b.day && b.day.skips)||[]).forEach(k => { drop += k.stayDrop; refund += k.refund; }); return { drop, refund }; }
function dayPer(b){
  const f = finOf(b), live = b.day.dates.filter(d=>!d.skipped);
  return { f, live, per: live.length ? f.stay/live.length : 0, perPromo: live.length ? f.promo/live.length : 0 };
}
function dayCancelQuote(b, who){
  const { f, live, per, perPromo } = dayPer(b), pay = paymentOf(b), policy = b.policy || 'moderate';
  const rem = live.filter(d => !d.done && d.iso >= DEMO_TODAY);
  let refundStay = 0, kept = (live.length - rem.length) * per;
  rem.forEach(d => { const days = daysBetweenISO(DEMO_TODAY, d.iso), pct = (who==='sitter' || b.status==='pending') ? 100 : refundPct(policy, days);
    refundStay += Math.round((per-perPromo)*pct/100); kept += per - Math.round(per*pct/100); });
  const keptStay = Math.round(kept), commissionKept = Math.round(keptStay*COMMISSION);
  const pct = rem.length ? Math.round(100*refundStay/Math.max(1, rem.length*(per-perPromo))) : 0;
  return { pct, days: rem.length ? daysBetweenISO(DEMO_TODAY, rem[0].iso) : 0, policy, f, who, ownerRefund:refundStay, ownerPays:f.total-refundStay,
    sitterNet:keptStay-commissionKept, commissionKept, started:rem.length===0, hold:pay.status==='authorized' || pay.status==='awaiting' };
}
function daySessionsHTML(b){
  if(!b.day) return '';
  const isHost = b.hostName==='You' || state.mode!=='owner', D = b.day, open = b.status==='confirmed';
  const { per, perPromo } = dayPer(b), policy = b.policy || 'moderate';
  const rows = D.dates.map((d,i) => {
    const past = d.iso < DEMO_TODAY, days = daysBetweenISO(DEMO_TODAY, d.iso), pct = refundPct(policy, days);
    const state_ = d.skipped ? '<span class="paychip done">Skipped</span>' : d.done ? '<span class="paychip ok">Done</span>' : '<span class="paychip wait">Upcoming</span>';
    let act = '';
    if(open && !d.skipped && !d.done){
      act = isHost ? `<button class="btn btn-ghost btn-sm" data-action="day-done-${b.id}-${i}">Mark done</button>`
        : (!past ? `<button class="btn btn-ghost btn-sm" data-action="day-skip-${b.id}-${i}" aria-label="Skip ${fmtShort(d.iso)}">Skip · ${pct ? '₺'+Math.round((per-perPromo)*pct/100).toLocaleString('tr-TR')+' back' : 'no refund'}</button>` : '');
    }
    return `<div class="session-row ${d.done?'done':''}"><div class="session-num">${i+1}</div><div class="session-body"><b>${fmtShort(d.iso)} · ${dowName(dowOf(d.iso))}</b><span>${(SLOTS12.find(x=>x.k===D.slot)||SLOTS12[0]).h}</span></div><div class="svc-act">${state_}${act}</div></div>`;
  }).join('');
  const sk = daySkipAdj(b);
  return `<div class="section-label">Sessions · ${serviceName(D.kind, D)}</div>${rows}${sk.refund ? `<p class="svc-hint">Refunded for skipped sessions: ${fmtLine(sk.refund)}</p>` : ''}`;
}
function dayMaybeComplete(b){
  const live = b.day.dates.filter(d=>!d.skipped);
  if(live.length && live.every(d=>d.done) && b.status==='confirmed'){ b.status = 'completed'; releaseEscrow(b); toast('All sessions done — payment released'); }
}

function applyR12(d){
  if(!d) return;
  if(d.myServices) state.myServices = { walk:!!d.myServices.walk, visit:!!d.myServices.visit };
  if(Array.isArray(d.myWeekly) && d.myWeekly.length===7) state.myWeekly = d.myWeekly.map(Boolean);
  if(d.myHours) state.myHours = { from:+d.myHours.from||8, to:+d.myHours.to||20 };
  if(Array.isArray(d.myHolidays)) state.myHolidays = d.myHolidays;
  if(d.plus!==undefined) state.plus = d.plus;
  if(d.boost!==undefined) state.boost = d.boost;
  if(Array.isArray(d.billing)) state.billing = d.billing;
  if(d.chatPrefs) state.chatPrefs = { ...state.chatPrefs, ...d.chatPrefs };
  if(d.myPricing12) Object.assign(state.myPricing, d.myPricing12);
}

/* ---------- click + input handlers ---------- */
function handleR12Click(action, el){
  if(action==='nav2-services'){ go('services'); return true; }
  if(action==='nav2-plus'){ go('plus'); return true; }
  if(action==='nav2-boost'){ go('boost'); return true; }
  if(action==='set-lang-de'){ setLang('de'); return true; }
  if(action==='set-lang-ru'){ setLang('ru'); return true; }
  /* service picking on the request form */
  if(action.startsWith('svc-pick-')){ const k = action.replace('svc-pick-',''); state.form.service = k==='boarding' ? null : k; if(k!=='boarding') dayState(); render(); return true; }
  if(action.startsWith('book-day-')){
    const m = /^book-day-(.+)-(walk|visit)$/.exec(action); if(!m) return true;
    state.consent.petHealth = false; state.consent.vetConsent = false;
    state.form = { protect:false, pets:1, petIdx:null, shareHealth:true, dates:null, prefill:null, rebook:false, service:m[2], day:dayDefaults(sitterById(m[1])) };
    state.form.day.days = [dowOf(state.form.day.date)];
    go('request', { selectedId:m[1] }); return true;
  }
  if(action.startsWith('d-mins-')){ dayState().mins = parseInt(action.replace('d-mins-',''),10); render(); return true; }
  if(action.startsWith('d-visits-')){ dayState().visits = parseInt(action.replace('d-visits-',''),10); render(); return true; }
  if(action.startsWith('d-slot-')){ dayState().slot = action.replace('d-slot-',''); render(); return true; }
  if(action.startsWith('d-repeat-')){ const D = dayState(); D.repeat = action.replace('d-repeat-',''); if(D.repeat==='weekly' && (!D.days || !D.days.length)) D.days = [dowOf(D.date)]; render(); return true; }
  if(action.startsWith('d-dow-')){ const D = dayState(), d = parseInt(action.replace('d-dow-',''),10); D.days = D.days.includes(d) ? (D.days.length>1 ? D.days.filter(x=>x!==d) : D.days) : D.days.concat(d); render(); return true; }
  if(action==='d-weeks-inc'){ const D = dayState(); D.weeks = Math.min(12, D.weeks+1); render(); return true; }
  if(action==='d-weeks-dec'){ const D = dayState(); D.weeks = Math.max(2, D.weeks-1); render(); return true; }
  if(action.startsWith('confirm-day-')){
    const s = sitterById(action.replace('confirm-day-','')), F = state.form, D = dayState();
    const q = dayQuote(s, F); if(!q.dates.length){ toast('No sessions fit '+s.name.split(' ')[0]+'’s schedule'); return true; }
    const petName = (document.getElementById('f-petname')||{}).value || 'Your pet';
    const selPet = F.petIdx!=null ? state.myPets[F.petIdx] : null, first = q.dates[0], last = q.dates[q.dates.length-1];
    const b = {
      id:'b'+Date.now(), status: s.instantBook ? 'confirmed' : 'pending', petName, hostName:s.name, loc:s.loc.split(',')[0],
      checkIn:fmtDate(first), checkOut:fmtDate(last), checkInISO:first, checkOutISO:last, code:randCode(), sitterId:s.id, updates:[], review:null, reports:[], chatKey:'owner-'+s.id,
      protect:false, protectFee:0, total:q.total, pets:F.pets||1,
      promo: q.promo ? { code:q.promo.code, kind:q.promo.kind, label:q.promo.label, amount:q.promo.discount } : null,
      lines:q.lines.map(l=>({ label:l.label, amount:l.amount, promo:!!l.promo })), policy:s.policy||'moderate', paidISO:DEMO_TODAY,
      payment:{ method:F.payMethod||'card', status: F.payMethod==='havale' ? 'awaiting' : s.instantBook ? 'held' : 'authorized' },
      petCard:(selPet && F.shareHealth!==false) ? { name:selPet.name, type:selPet.type, breed:selPet.breed, age:selPet.age, photo:selPet.photo, health:{ ...selPet.health } } : null,
      day:{ kind:F.service, mins:D.mins, visits:D.visits, slot:D.slot, repeat:D.repeat, days:D.days.slice(), weeks:D.weeks, dates:q.dates.map(iso=>({ iso, done:false, skipped:false })), skips:[] }
    };
    state.bookings.push(b); state.loyaltyPoints += plusActive() ? 100 : 50;
    if(b.promo){
      if(b.promo.kind==='first') state.promo.firstUsed = true;
      else if(b.promo.kind==='code') state.promo.used.push(b.promo.code);
      else if(b.promo.kind==='reward'){ const rw = state.redeemedRewards.find(x=>String(x.code).toUpperCase()===b.promo.code); if(rw) rw.used = true; }
      saveGrowthState();
    }
    state.consentGiven = true; state.form = { protect:false, pets:1, petIdx:null, shareHealth:true, dates:null, prefill:null, rebook:false };
    toast((s.instantBook ? 'Confirmed with ' : 'Request sent to ')+s.name.split(' ')[0]+' · +'+(plusActive()?100:50)+' points');
    go('ticket', { selectedId:b.id }); return true;
  }

let REC = null;
const fmtDur = s => Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');
async function voiceStart(){
  if(REC) return;
  if(!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder)){ toast('Voice messages aren’t supported on this device'); return; }
  try{
    const stream = await navigator.mediaDevices.getUserMedia({ audio:true });
    const mime = ['audio/webm;codecs=opus','audio/webm','audio/mp4'].find(m => MediaRecorder.isTypeSupported(m)) || '';
    const mr = new MediaRecorder(stream, mime ? { mimeType:mime } : undefined), chunks = [];
    REC = { mr, stream, chunks, t0:Date.now(), cancel:false, chat:state.selectedId };
    mr.ondataavailable = e => { if(e.data && e.data.size) chunks.push(e.data); };
    mr.onstop = () => {
      const r = REC; REC = null; clearInterval(r.timer); r.stream.getTracks().forEach(t=>t.stop());
      const dur = Math.max(1, Math.round((Date.now()-r.t0)/1000));
      if(r.cancel || !chunks.length){ if(state.screen==='chatThread') render(); return; }
      const blob = new Blob(chunks, { type:mr.mimeType || 'audio/webm' }), fr = new FileReader();
      fr.onload = () => { sendVoice(r.chat, fr.result, dur); };
      fr.readAsDataURL(blob);
    };
    mr.start();
    REC.timer = setInterval(() => { const el = document.getElementById('rec-time'); const s = (Date.now()-REC.t0)/1000; if(el) el.textContent = fmtDur(s); if(s>=120) voiceStop(false); }, 250);
    render();
  }catch(e){ REC = null; toast('Microphone access was blocked'); }
}

function xApply(node){
  if(node.nodeType===3){
    const par = node.parentNode, p = par && par.nodeName;
    if(p==='SCRIPT' || p==='STYLE' || p==='TEXTAREA') return;
    if(par && par.closest && par.closest('.chat-bubble, #chat-input')) return;   // never rewrite chat content
    const o = xText(node.nodeValue); if(o!==node.nodeValue) node.nodeValue = o; return;
  }
  if(node.nodeType!==1) return;
  node.querySelectorAll('option').forEach(o => { if(!o.hasAttribute('value')) o.setAttribute('value', o.textContent); });
  if(node.nodeName==='OPTION' && !node.hasAttribute('value')) node.setAttribute('value', node.textContent);
  const w = document.createTreeWalker(node, NodeFilter.SHOW_TEXT), list = []; while(w.nextNode()) list.push(w.currentNode);
  list.forEach(xApply);
  const ph = el => { ['placeholder','aria-label'].forEach(a => { const v = el.getAttribute(a); if(v){ const o = xText(v); if(o!==v) el.setAttribute(a, o); } }); };
  if(node.hasAttribute) ph(node);
  node.querySelectorAll('[placeholder],[aria-label]').forEach(ph);
}

/* ============ SEARCH, FILTER & MAP ============ */
const PET_WORDS_TR = { 'Dogs':'köpek köpekler', 'Cats':'kedi kediler', 'Small pets':'küçük hayvan tavşan hamster', 'Birds':'kuş kuşlar papağan' };
function norm(str){
  return String(str||'').toLocaleLowerCase('tr').replace(/ı/g,'i').normalize('NFD').replace(/[̀-ͯ]/g,'');
}
function escAttr(str){
  return String(str||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function distKm(lat1,lng1,lat2,lng2){
  const R=6371, r=Math.PI/180;
  const dLat=(lat2-lat1)*r, dLng=(lng2-lng1)*r;
  const x=Math.sin(dLat/2)**2 + Math.cos(lat1*r)*Math.cos(lat2*r)*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.sqrt(x));
}
function fmtKm(km){
  const s = km.toFixed(1);
  return (state.lang==='tr' ? s.replace('.',',') : s) + ' km';
}
function countLabel(n, kind){
  if(state.lang==='tr') return kind==='sitter' ? `${n} bakıcı` : `${n} ilan`;
  return kind==='sitter' ? `${n} sitter${n===1?'':'s'}` : `${n} request${n===1?'':'s'}`;
}

function sitterHaystack(s){
  return norm([s.name, s.loc, s.area, s.tagline, s.bio, s.pets.join(' '), s.pets.map(p=>PET_WORDS_TR[p]||'').join(' ')].join(' '));
}
function filteredSitters(){
  const f = state.search, u = state.userLoc;
  const words = norm(f.q).trim().split(/\s+/).filter(Boolean);
  let list = SITTERS.map(s => ({ s, dist: u ? distKm(u.lat,u.lng,s.lat,s.lng) : null }));
  list = list.filter(({s,dist}) => {
    if(state.filter!=='All' && !s.pets.includes(state.filter)) return false;
    if(words.length){ const h = sitterHaystack(s); if(!words.every(w=>h.includes(w))) return false; }
    if(f.area!=='All' && s.area!==f.area) return false;
    if(f.maxPrice<700 && parsePrice(s.price)>f.maxPrice) return false;
    if(f.instant && !s.instantBook) return false;
    if(f.fast && s.responseMinutes>60) return false;
    if(f.superOnly && !isSuper(s)) return false;
    if(f.checkIn && f.checkOut && f.checkOut>f.checkIn && isRangeBlocked(s,f.checkIn,f.checkOut)) return false;
    if(f.maxDist && dist!=null && dist>f.maxDist) return false;
    return true;
  });
  const sorters = {
    rating:     (a,b)=> b.s.rating-a.s.rating || b.s.reviews-a.s.reviews,
    price_asc:  (a,b)=> parsePrice(a.s.price)-parsePrice(b.s.price),
    price_desc: (a,b)=> parsePrice(b.s.price)-parsePrice(a.s.price),
    response:   (a,b)=> a.s.responseMinutes-b.s.responseMinutes,
    distance:   (a,b)=> (a.dist==null?1e9:a.dist)-(b.dist==null?1e9:b.dist),
  };
  const sf = sorters[f.sort] || sorters.rating;
  list.sort((a,b)=> (f.sort==='rating' ? (featuredOf(b.s) - featuredOf(a.s)) : 0) || sf(a,b));
  return list;
}
function requestHaystack(r){
  return norm([r.pet, r.type, r.owner, r.loc, r.dates, r.notes, r.goal||'', (/Dog/.test(r.type)?'köpek':''), (/Cat/.test(r.type)?'kedi':'')].join(' '));
}
function filteredRequests(list){
  const words = norm(state.search.q).trim().split(/\s+/).filter(Boolean);
  return list.filter(r => {
    if(state.filter!=='All' && !r.type.includes(state.filter)) return false;
    if(words.length){ const h = requestHaystack(r); if(!words.every(w=>h.includes(w))) return false; }
    return true;
  });
}
function activeFilterCount(){
  const f = state.search;
  return (f.area!=='All'?1:0) + (f.maxPrice<700?1:0) + (f.instant?1:0) + (f.fast?1:0) + (f.superOnly?1:0) + ((f.checkIn&&f.checkOut)?1:0) + (f.maxDist?1:0);
}

function mapXY(lat,lng){ return { x:(lng-MAP.lonMin)*MAP.kx, y:(MAP.latMax-lat)*MAP.ky }; }
function mapPath(points, close){
  return points.map((p,i)=>{ const q=mapXY(p[0],p[1]); return (i?'L':'M')+q.x.toFixed(1)+' '+q.y.toFixed(1); }).join(' ') + (close?' Z':'');
}

const MAP_MARMARA  = [[40.985,28.70],[40.98,28.78],[40.96,28.82],[40.975,28.87],[40.995,28.93],[41.005,28.97],[41.012,28.985],[41.0,29.015],[40.985,29.025],[40.965,29.04],[40.95,29.09],[40.925,29.13],[40.90,29.19],[40.875,29.23],[40.82,29.30],[40.80,29.34],[40.80,28.70]];
const MAP_BOSPHORUS = [[41.235,29.10],[41.19,29.085],[41.16,29.06],[41.13,29.055],[41.10,29.05],[41.08,29.045],[41.05,29.03],[41.03,29.01],[41.015,28.995],[41.003,28.99]];
const MAP_GOLDENHORN = [[41.015,28.975],[41.027,28.965],[41.04,28.95],[41.048,28.94],[41.057,28.93]];

function mapViewBox(){
  const mv = state.search.mv;
  const w = MAP.W/mv.s, h = MAP.H/mv.s;
  const x = Math.max(0, Math.min(MAP.W-w, mv.x)), y = Math.max(0, Math.min(MAP.H-h, mv.y));
  mv.x = x; mv.y = y;
  return { x, y, w, h };
}
function leafletOK(){ return typeof window.L!=='undefined' && !state.search.mapFallback && navigator.onLine!==false; }

/* ---- real map: Leaflet + OpenStreetMap tiles; falls back to the stylised SVG map if tiles/library are unavailable ---- */
let leafMap = null;
function destroyLeaf(){ if(leafMap){ try{ leafMap.remove(); }catch(e){} leafMap = null; } }
function initLeafMap(){
  const el = document.getElementById('leafmap');
  if(!el){ destroyLeaf(); return; }
  if(typeof window.L==='undefined') return;
  destroyLeaf();
  const list = filteredSitters();
  const sv = state.search.lv || { lat:41.03, lng:29.02, z:11 };
  const map = L.map(el, { zoomControl:false, attributionControl:true, center:[sv.lat,sv.lng], zoom:sv.z, minZoom:9, maxZoom:17 });
  leafMap = map;
  let errs = 0, loads = 0;
  const tl = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom:19, attribution:'© <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>' }).addTo(map);
  tl.on('tileload', ()=>{ loads++; });
  tl.on('tileerror', ()=>{ errs++; if(errs>=6 && loads===0){ state.search.mapFallback = true; toast(t('map_fallback')); refreshResults(); } });
  map.on('moveend', ()=>{ const c = map.getCenter(); state.search.lv = { lat:c.lat, lng:c.lng, z:map.getZoom() }; });
  const group = [];
  list.forEach(({s}) => {
    const sel = state.search.pin===s.id;
    const icon = L.divIcon({ className:'lpin-wrap', html:`<div class="lpin ${sel?'sel':''}" role="button" aria-label="${escAttr(s.name+', '+s.price)}"><span>${s.price}</span></div>`, iconSize:[56,28], iconAnchor:[28,28] });
    const m = L.marker([s.lat,s.lng], { icon, keyboard:true, title:s.name, riseOnHover:true, zIndexOffset: sel?1000:0 }).addTo(map);
    m.on('click', ()=>{ state.search.pin = (state.search.pin===s.id) ? null : s.id; refreshResults(); });
    group.push([s.lat,s.lng]);
  });
  if(state.userLoc){
    L.circleMarker([state.userLoc.lat,state.userLoc.lng], { radius:8, color:'#fff', weight:3, fillColor:'#2C5CE0', fillOpacity:1 }).addTo(map);
    group.push([state.userLoc.lat,state.userLoc.lng]);
  }
  if(!state.search.lv && group.length>1) map.fitBounds(group, { padding:[34,34], maxZoom:13 });
  const zc = L.control({ position:'topright' });
  zc.onAdd = () => { const d = L.DomUtil.create('div','mapctl leafctl'); d.innerHTML = `<button data-leaf="in" aria-label="${escAttr(t('map_zoom_in'))}">+</button><button data-leaf="out" aria-label="${escAttr(t('map_zoom_out'))}">−</button>`; L.DomEvent.disableClickPropagation(d); d.addEventListener('click', e=>{ const b=e.target.closest('button'); if(!b) return; e.stopPropagation(); b.dataset.leaf==='in' ? map.zoomIn() : map.zoomOut(); }); return d; };
  zc.addTo(map);
  setTimeout(()=>map.invalidateSize(), 60);
}

/* drag-to-pan for the SVG map (pointer events; viewBox is updated directly, no re-render) */
let mapDragEnd = 0, mapDragMoved = false;
function bindMapDrag(){
  const svg = document.getElementById('mapsvg');
  if(!svg || svg.dataset.bound) return;
  svg.dataset.bound = '1';
  let start = null;
  svg.addEventListener('pointerdown', e => {
    const mv = state.search.mv;
    start = { px:e.clientX, py:e.clientY, x:mv.x, y:mv.y };
    mapDragMoved = false;
  });
  svg.addEventListener('pointermove', e => {
    if(!start) return;
    const dx = e.clientX-start.px, dy = e.clientY-start.py;
    if(!mapDragMoved && Math.hypot(dx,dy) < 5) return;
    mapDragMoved = true;
    const rect = svg.getBoundingClientRect(), mv = state.search.mv;
    const unit = Math.max(MAP.W/mv.s/rect.width, MAP.H/mv.s/rect.height);   // svg units per css px ("slice" fit)
    mv.x = start.x - dx*unit; mv.y = start.y - dy*unit;
    const vb = mapViewBox();
    svg.setAttribute('viewBox', `${vb.x.toFixed(1)} ${vb.y.toFixed(1)} ${vb.w.toFixed(1)} ${vb.h.toFixed(1)}`);
  });
  const end = () => { if(start && mapDragMoved) mapDragEnd = Date.now(); start = null; };
  svg.addEventListener('pointerup', end);
  svg.addEventListener('pointerleave', end);
  svg.addEventListener('pointercancel', end);
}
