function screenRequestForm(){
  const s = sitterById(state.selectedId);
  const F = state.form, pre = F.prefill || {};
  if(F.service && svcOf(s)[F.service]) return screenDayForm(s);
  const keep = (id, dflt) => { const el = document.getElementById(id); return el ? el.value : dflt; };
  const fIn = keep('f-in', (F.dates && F.dates.in) || state.search.checkIn || '2026-07-10');
  const fOut = keep('f-out', (F.dates && F.dates.out) || state.search.checkOut || '2026-07-14');
  const fPet = keep('f-petname', pre.petName || 'Luna');
  const fType = keep('f-pettype', pre.petType || 'Dog');
  const fNotes = keep('f-notes', pre.notes || 'Very friendly, needs a short walk morning and evening.');
  const first = s.name.split(' ')[0];
  const q = quoteWithPromo(s, fIn||'2026-07-10', fOut||'2026-07-14', F.pets||1, F.protect);
  const selPet = F.petIdx!=null ? state.myPets[F.petIdx] : null;
  const tick = ICON.check.replace('26','14').replace('26','14');
  return `
  <div class="fade-in narrow">
    <h2 class="title">Tell ${first} about your pet</h2>
    <p class="subtitle">${s.instantBook ? `${first} accepts Instant Book — your pawcation is confirmed right away, no waiting for approval.` : `This goes straight to ${first} as a booking request — nothing is confirmed until they accept.`}</p>
    ${serviceChipsHTML(s)}
    ${F.rebook ? `<div class="trustnote" style="margin-bottom:14px;">${ICON.check}<span>Rebooking ${first} — we filled in your last stay's details and the declarations you already agreed to. Check the dates and send.</span></div>` : ''}
    ${state.myPets.length ? `
    <div class="section-label" style="margin-top:0;">Choose a saved pet</div>
    <div class="chiprow wrap" style="margin-bottom:14px;">
      ${state.myPets.map((p,i)=>`<div class="chip ${F.petIdx===i?'active':''}" data-action="select-pet-${i}">${p.name}</div>`).join('')}
      <div class="chip ${F.petIdx==null?'active':''}" data-action="select-pet-new">+ New pet</div>
    </div>` : ''}
    <div class="field-row">
      <div class="field"><label>Pet's name</label><input id="f-petname" placeholder="e.g. Luna" value="${escAttr(fPet)}"/></div>
      <div class="field"><label>Pet type</label><select id="f-pettype">${['Dog','Cat','Small pet','Bird'].map(o=>`<option value="${o}" ${fType===o?'selected':''}>${o}</option>`).join('')}</select></div>
    </div>
    <div class="field"><label>Number of pets</label>
      <div class="stepper"><button data-action="pets-dec">−</button><b>${F.pets||1}</b><button data-action="pets-inc">+</button></div>
    </div>
    <div class="field-row">
      <div class="field"><label>Check-in</label><input id="f-in" type="date" value="${fIn||'2026-07-10'}"/></div>
      <div class="field"><label>Check-out</label><input id="f-out" type="date" value="${fOut||'2026-07-14'}"/></div>
    </div>
    ${isRangeBlocked(s, fIn||'2026-07-10', fOut||'2026-07-14') ? `<p style="color:var(--stamp);font-size:calc(12px*var(--fs));margin:-8px 0 14px;">${first} isn't available for some of these dates — check the calendar on their profile.</p>` : ''}
    <div class="field"><label>Anything ${first} should know</label><textarea id="f-notes" placeholder="Feeding schedule, medication, temperament…">${fNotes.replace(/&/g,'&amp;').replace(/</g,'&lt;')}</textarea></div>
    <div class="section-label">Add-ons</div>
    ${selPet ? `
    <div class="consent-row addon-row ${F.shareHealth!==false ? 'checked' : ''}" data-action="toggle-share-health">
      <div class="consent-box">${F.shareHealth!==false ? tick : ''}</div>
      <p><b>Share health card</b> — ${selPet.name}'s vaccines, allergies, medications, vet and feeding routine will be sent to ${first} automatically.</p>
    </div>` : ''}
    <div class="consent-row addon-row ${F.protect ? 'checked' : ''}" data-action="toggle-protect">
      <div class="consent-box">${F.protect ? tick : ''}</div>
      <p><b>Pawcation Protect</b> — ₺99 flat. Covers accidental damage at the sitter's home and adds 24/7 priority support for this stay.</p>
    </div>
    ${promoBlockHTML(q, keep('f-promo',''))}
    <div class="pricebox-summary">
      ${q.lines.map(l=>`<div class="pb-row"><span>${l.label}</span><b>${fmtLine(l.amount)}</b></div>`).join('')}
      <div class="pb-row total"><span>Total</span><b>₺${q.total.toLocaleString('tr-TR')}</b></div>
    </div>
    ${paymentBlockHTML(s, q)}
    <div class="section-label">Before you send</div>
    <div class="consent-row ${state.consent.petHealth ? 'checked' : ''}" data-action="toggle-consent-petHealth">
      <div class="consent-box">${state.consent.petHealth ? tick : ''}</div>
      <p>I confirm my pet has no history of aggression toward people or other animals, and is current on core vaccinations. <a data-action="open-policy-health-request">Read full declaration</a></p>
    </div>
    <div class="consent-row ${state.consent.vetConsent ? 'checked' : ''}" data-action="toggle-consent-vetConsent">
      <div class="consent-box">${state.consent.vetConsent ? tick : ''}</div>
      <p>If I'm unreachable in an emergency, I authorize the sitter to seek veterinary care on my behalf, up to ₺2,000 — to be reimbursed by me afterward. <a data-action="open-policy-vetconsent-request">Read full consent</a></p>
    </div>
    <button class="btn btn-primary" data-action="confirm-request-${s.id}" ${(!state.consent.petHealth||!state.consent.vetConsent) ? 'disabled' : ''}>${s.instantBook ? 'Book instantly' : 'Send request'}</button>
  </div>`;
}

function screenTicket(){
  const b = state.bookings.find(x=>x.id===state.selectedId) || state.bookings[state.bookings.length-1];
  if(!b) return screenEmptyBookings();
  return `
  <div class="fade-in narrow">
    <div style="text-align:center;margin:6px 0 18px;">
      <div style="width:52px;height:52px;border-radius:50%;background:var(--moss);color:#fff;display:flex;align-items:center;justify-content:center;margin:0 auto 10px;">${ICON.check}</div>

  </div>`;
}

  return `
    <div class="ticket" style="${dim}${clickable!==false ? 'cursor:pointer;' : ''}" ${clickable!==false ? `data-action="open-booking-${b.id}"` : ''}>
      <div class="ticket-top">
        <div class="ticket-brand">
          <div class="tb-name">${ICON.paw} Pawcation Pass</div>
          <div class="stampbadge">${b.status==='pending' ? 'PENDING' : b.status==='completed' ? 'COMPLETED' : b.status==='cancelled' ? 'CANCELLED' : 'CONFIRMED'}</div>
        </div>
        <div class="ticket-route">
          <div class="pt"><b>${b.petName}</b><span>Pet</span></div>
          <div class="dots"></div>
          <div class="pt" style="text-align:right"><b>${b.hostName}</b><span>Host</span></div>
        </div>
        <div class="ticket-grid">
          ${b.day ? dayGridHTML(b) : `<div><span>Check-in</span><b>${b.checkIn}</b></div>
          <div><span>Check-out</span><b>${b.checkOut}</b></div>
          <div><span>Location</span><b>${b.loc}</b></div>`}
        </div>
        ${dayBadgeHTML(b)}
        ${b.protect ? `<div class="protect-badge">${ICON.shield}Pawcation Protect included</div>` : ''}
        ${b.petCard ? `<div class="protect-badge">${ICON.cert}Health card shared</div>` : ''}
        ${b.pets>1 ? `<div class="protect-badge" style="color:var(--ink-soft);">${b.pets} pets</div>` : ''}
        ${b.total ? `<div class="protect-badge" style="color:var(--ink-soft);">Total paid: ₺${b.total.toLocaleString('tr-TR')}</div>` : ''}
        ${b.promo ? `<div class="protect-badge" style="color:var(--moss-deep);">${ICON.gift}Promo applied: ${b.promo.label} · −₺${b.promo.amount.toLocaleString('tr-TR')}</div>` : ''}
        ${b.hostName!=='You' && b.total ? `<div class="protect-badge" style="color:var(--ink-soft);">${ICON.shield}${(PAY_STATUS[paymentOf(b).status]||{}).label}</div>` : ''}
      </div>
      <div class="tear"></div>
      <div class="ticket-bottom">
        <div class="ticket-code">PASS · ${b.code}</div>
        <div class="pawstamp">${ICON.paw}</div>

  `;
}

function screenEmptyBookings(){
  return `
    <div class="emptystate">
      <div class="ico">${ICON.ticket}</div>
      <h3>No pawcations yet</h3>
      <p>${state.mode==='owner' ? 'Request a stay with a sitter and it will show up here.' : state.mode==='sitter' ? 'Offer to host a pet and it will show up here.' : 'Offer to train a pet and it will show up here.'}</p>
    </div>`;
}

function screenBookings(){
  return `
  <div class="fade-in narrow">
    <h2 class="title">Your pawcations</h2>
    <p class="subtitle">Every request, past and upcoming, kept as a pass. Tap one for stay updates and details.</p>
    ${meetsSectionHTML()}
    ${state.bookings.length===0 ? screenEmptyBookings() : state.bookings.slice().reverse().map(b=>renderTicketCard(b)).join('')}
  </div>`;
}

function renderStarLine(n){
  return `<span style="color:var(--gold);letter-spacing:1px;">${'★'.repeat(n)}${'☆'.repeat(5-n)}</span>`;
}

function renderReviewCard(r, b){
  const host = b && (state.mode!=='owner' ? 'You' : (b.hostName||'').split(' ')[0]);
  return `
  <div class="reviewcard">
    <div class="rh">${renderStarLine(r.overall)}<span style="color:var(--ink-soft);font-weight:400">Just now</span></div>
    <p>${escAttr(r.text) || 'No written comment.'}</p>
    ${reviewExtrasHTML(r)}
    ${replyHTML(r, host)}
  </div>`;
}

function renderReviewSection(b){
  const isHostView = state.mode!=='owner';
  if(isHostView){
    if(b.review){
      return `
      <div class="section-label">Owner's review</div>
      ${renderReviewCard(b.review, b)}
      ${b.review.reply ? '' : `
        <div class="field" style="margin-top:6px;"><label>Reply publicly</label><textarea id="reply-text" placeholder="Thank them, or add your side of the story…"></textarea></div>
        <button class="btn btn-primary" data-action="reply-review-${b.id}">Post reply</button>`}
      `;
    }
    if(b.trainerBooking){
      return `
      <div class="section-label">Review</div>
      <p class="subtitle" style="margin-top:-6px;">No review yet — this is a mock, so you can simulate the owner leaving one.</p>
      <button class="btn btn-ghost" data-action="simulate-trainer-review-${b.id}">Simulate: ask ${(b.ownerName||'owner').split(' ')[0]} to review</button>
      `;
    }
    return `
      <div class="section-label">Review</div>
      <p class="subtitle" style="margin-top:-6px;">The owner hasn't left a review yet.</p>
      <button class="btn btn-ghost" data-action="simulate-host-review-${b.id}">Simulate: ${(b.ownerName||'the owner').split(' ')[0]} leaves a review</button>
    `;
  }
  if(b.review){
    return `<div class="section-label">Your review</div>${renderReviewCard(b.review, b)}${b.review.reply ? '' : `<button class="btn btn-ghost" style="margin-top:4px;" data-action="sim-reply-${b.id}">Simulate: ${(b.hostName||'sitter').split(' ')[0]} replies</button>`}`;
  }
  if(!b.sitterId) return '';
  return `
    <div class="section-label">How did it go?</div>
    <button class="btn btn-primary" data-action="nav2-review-${b.id}">Leave a review</button>
  `;
}

    ${(b.status==='pending' || b.status==='confirmed') ? `

      </div>
    ` : ''}
    ${(!isHost && b.sitterId && b.status==='completed' && !b.day) ? `<button class="btn btn-primary" style="margin-bottom:16px;" data-action="rebook-${b.sitterId}">Book again</button>` : ''}
    ${paymentCardHTML(b, b.hostName==='You')}
    ${b.petCard ? `<div class="section-label">Pet health card</div>${renderHealthRows(b.petCard.health)}` : ''}
    ${b.sessions ? `

          <div class="session-body"><b>${s.date}</b><span>${s.time}</span></div>
          <div class="session-check">${s.done ? ICON.check.replace('26','13').replace('26','13') : ''}</div>
        </div>
      `).join('')}
    ` : ''}
    ${daySessionsHTML(b)}
    ${reportsSectionHTML(b)}
    <div class="section-label">Stay updates</div>
    ${b.updates.length===0 ? `<p class="subtitle" style="margin-top:-6px;">${isHost ? "Post a photo so the owner can see how things are going." : "No updates yet — your sitter or trainer will post photos here during the stay."}</p>` : ''}
    ${b.updates.slice().reverse().map(u=>`
      <div class="stayupdate">

      </div>
    `).join('')}
    ${isHost && b.status==='confirmed' ? `
      <div class="section-label">Post an update</div>
      <div class="upload-tile" style="margin-bottom:10px;" data-upload="stayUpdatePhoto">

        <input type="file" accept="image/*" data-upload-input="stayUpdatePhoto"/>
      </div>
      <div class="field"><textarea id="su-note" placeholder="What's happening right now?"></textarea></div>
      <button class="btn btn-ghost" data-action="post-update-${b.id}">Post update</button>
    ` : ''}
    ${b.status==='completed' ? renderReviewSection(b) : ''}

      <div class="section-label">Problems</div>
      ${state.incidents.filter(i=>i.bookingId===b.id).map(incidentCardHTML).join('')}

function screenLeaveReview(){
  const b = state.bookings.find(x=>x.id===state.selectedId);
  if(!b) return screenBookings();
  if(!state.reviewDraft) state.reviewDraft = { overall:5, cleanliness:5, communication:5, reliability:5, tags:[], text:'' };
  const draft = state.reviewDraft;
  const starRow = (key,label) => `
    <div class="field">
      <label>${label}</label>
      <div class="starpicker">
        ${[1,2,3,4,5].map(n=>`<span class="${draft[key]>=n?'filled':''}" data-action="set-review-${key}-${n}">${ICON.star}</span>`).join('')}
      </div>
    </div>`;
  return `
  <div class="fade-in narrow">
    <h2 class="title">Rate ${b.hostName}</h2>
    <p class="subtitle">Your feedback helps other owners choose a trustworthy sitter.</p>
    ${starRow('overall','Overall')}
    ${starRow('cleanliness','Cleanliness')}
    ${starRow('communication','Communication')}
    ${starRow('reliability','Reliability')}

function renderPolicyBlock(block){
  if(block.h) return `<h3>${block.h}</h3>`;
  if(block.p) return `<p>${block.p}</p>`;
  if(block.li) return `<ul>${block.li.map(i=>`<li>${i}</li>`).join('')}</ul>`;
  if(block.table) return `<table class="policy-table"><tr><th>Durum</th><th>Sonuç</th></tr>${block.table.map(row=>`<tr><td>${row[0]}</td><td>${row[1]}</td></tr>`).join('')}</table>`;
  return '';
}

/* ============ PRICING RULES (weekend / holiday / multi-pet / cleaning) ============ */
// public holidays + bayrams (2026) — a night that starts on one of these dates gets the holiday rate
const HOLIDAYS = ['2026-01-01','2026-03-20','2026-03-21','2026-03-22','2026-04-23','2026-05-01','2026-05-19','2026-05-27','2026-05-28','2026-05-29','2026-05-30','2026-07-15','2026-08-30','2026-10-29'];
function isoLocal(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function priceQuote(s, inISO, outISO, pets, protect){
  const pr = s.pricing || { weekend:0, holiday:0, multiPet:0, cleaning:0 };
  const base = parsePrice(s.price);
  const nights = computeNights(inISO, outISO);
  let wk = 0, hol = 0;
  const d = new Date(inISO+'T00:00:00');
  for(let i=0;i<nights;i++){
    if(HOLIDAYS.includes(isoLocal(d))) hol++;
    else if(d.getDay()===5 || d.getDay()===6) wk++;      // Friday & Saturday nights
    d.setDate(d.getDate()+1);
  }
  const lines = [{ label:`${nights} night${nights>1?'s':''} × ${s.price}`, amount:nights*base }];
  if(wk && pr.weekend) lines.push({ label:`Weekend surcharge · ${wk} night${wk>1?'s':''}`, amount:wk*pr.weekend });
  if(hol && pr.holiday) lines.push({ label:`Holiday surcharge · ${hol} night${hol>1?'s':''}`, amount:hol*pr.holiday });
  const stay = lines.reduce((a,l)=>a+l.amount,0);
  const extra = Math.max(0, (pets||1)-1);
  if(extra){
    lines.push({ label:`Additional pets × ${extra}`, amount:extra*stay });
    if(pr.multiPet) lines.push({ label:`Multi-pet discount · ${pr.multiPet}%`, amount:-Math.round(extra*stay*pr.multiPet/100) });
  }
  if(pr.cleaning) lines.push({ label:'Cleaning fee', amount:pr.cleaning });
  if(protect) lines.push({ label:'Pawcation Protect', amount:99 });
  return { nights, lines, total:lines.reduce((a,l)=>a+l.amount,0), weekendNights:wk, holidayNights:hol };
}
function fmtLine(n){ return (n<0?'−':'')+'₺'+Math.abs(n).toLocaleString('tr-TR'); }
function pricingRowsHTML(base, pr){
  const row = (l,v) => `<div class="pr-row"><span>${l}</span><b>${v}</b></div>`;
  return `<div class="pricing-rows">
    ${row('Base rate','₺'+base+' / night')}
    ${row('Weekend nights (Fri–Sat)', pr.weekend ? '+₺'+pr.weekend+' / night' : 'No surcharge')}
    ${row('Holiday nights (bayram & public holidays)', pr.holiday ? '+₺'+pr.holiday+' / night' : 'No surcharge')}
    ${row('Each additional pet', pr.multiPet ? '−'+pr.multiPet+'%' : 'Full price')}
    ${row('Cleaning fee', pr.cleaning ? '₺'+pr.cleaning+' once' : 'Included')}
  </div>`;
}

  { tags:['Weekday','3 nights','1 pet'], in:'2026-07-06', out:'2026-07-09', pets:1 },
  { tags:['Weekend','2 nights','1 pet'], in:'2026-07-10', out:'2026-07-12', pets:1 },

/* ============ HOST EARNINGS ============ */
const EARN_HISTORY = [
  { m:'Feb', amount:1150, occ:32 }, { m:'Mar', amount:1700, occ:44 }, { m:'Apr', amount:2100, occ:52 },
  { m:'May', amount:2400, occ:61 }, { m:'Jun', amount:2100, occ:55 },
];
const BASE_JULY_BOOKED = [3,4,5,18,19,24,25,26];
const BASE_PENDING = [
  { who:'Zeynep Arslan', what:"Buddy's stay", amount:1800, when:'Jul 16' },
  { who:'Elif Sarı', what:"Rocky's stay", amount:900, when:'Jul 9' },
];
function mdParts(str){
  const m = String(str).match(/^([A-Z][a-z]{2}) (\d{1,2})$/);
  if(!m) return null;
  const mi = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'].indexOf(m[1]);
  return mi<0 ? null : { month:mi, day:parseInt(m[2],10) };
}
function shiftMD(str, n){
  const p = mdParts(str); if(!p) return str;
  return new Date(2026, p.month, p.day+n).toLocaleDateString('en-US', { month:'short', day:'numeric' });
}
function hostedBookings(){ return state.bookings.filter(b => b.hostName==='You' && b.status!=='cancelled'); }
function julyDaysOf(b){
  const out = [];
  if(b.sessions){ b.sessions.forEach(s => { const p = mdParts(s.date); if(p && p.month===6) out.push(p.day); }); return out; }
  const a = mdParts(b.checkIn), z = mdParts(b.checkOut);
  if(a && z && a.month===6){ for(let d=a.day; d<(z.month===6 ? z.day : 32); d++) out.push(d); }
  return out;
}
function earningsSummary(){
  const hosted = hostedBookings().filter(b => b.earn);
  const done = hosted.filter(b => b.status==='completed').reduce((a,b)=>a+b.earn,0);
  const open = hosted.filter(b => b.status!=='completed');
  const booked = new Set(BASE_JULY_BOOKED);
  hostedBookings().forEach(b => julyDaysOf(b).forEach(d => booked.add(d)));
  const month = 2450 + done;
  const pendingList = BASE_PENDING.map(x=>({ ...x })).concat(open.map(b => ({
    who: b.ownerName || 'Owner', what: `${b.petName}'s ${b.trainerBooking ? 'training' : 'stay'}`, amount: b.earn,
    when: shiftMD(b.sessions ? b.sessions[b.sessions.length-1].date : b.checkOut, 2)
  })));
  return {
    month, allTime: 11900 + done, pendingList,
    pending: pendingList.reduce((a,x)=>a+x.amount,0),
    booked, occupancy: Math.min(100, Math.round(booked.size/31*100)),
    last: EARN_HISTORY[EARN_HISTORY.length-1].amount,
  };
}
function renderBookedCalendar(booked, blocked){
  const year = CAL_MONTH.year, month = CAL_MONTH.month;
  const dim = new Date(year, month+1, 0).getDate(), first = new Date(year, month, 1).getDay();
  const cells = [];
  for(let i=0;i<first;i++) cells.push('<div class="cal-cell empty"></div>');
  for(let d=1; d<=dim; d++){
    const iso = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const cls = booked.has(d) ? 'booked' : blocked.includes(iso) ? 'blocked' : 'open';
    cells.push(`<div class="cal-cell ${cls}">${d}</div>`);
  }
  return `
    <div class="cal-grid-head">${['S','M','T','W','T','F','S'].map(d=>`<div>${d}</div>`).join('')}</div>
    <div class="cal-grid">${cells.join('')}</div>
    <div class="cal-legend"><span><i class="caldot booked"></i>Booked</span><span><i class="caldot blocked"></i>Blocked</span><span><i class="caldot open"></i>Free</span></div>`;
}
function barChartHTML(series, key, fmt, highlightLast){
  const max = Math.max(...series.map(x=>x[key]), 1);
  return `<div class="barchart">${series.map((x,i)=>`
    <div class="barcol">
      <span class="barval">${fmt(x[key])}</span>
      <div class="bar ${highlightLast && i===series.length-1 ? 'cur' : ''}" style="height:${Math.max(4, Math.round(x[key]/max*100))}%"></div>
      <span class="barlbl">${x.m}</span>
    </div>`).join('')}</div>`;
}
function screenEarnings(){
  const es = earningsSummary();
  const series = EARN_HISTORY.concat([{ m:'Jul', amount:es.month, occ:es.occupancy }]);
  const delta = es.last ? Math.round((es.month-es.last)/es.last*100) : 0;
  return `
  <div class="fade-in narrow">
    <h2 class="title">Earnings</h2>
    <p class="subtitle">What you have earned hosting through Pawcation, what is on its way, and how full your calendar is.</p>
    <div class="earnhero">
      <span>This month</span>
      <b>₺${es.month.toLocaleString('tr-TR')}</b>
      <em class="${delta>=0?'up':'down'}">${delta>=0?'+':'−'}${Math.abs(delta)}% vs last month</em>
    </div>
    <div class="statrow">
      <div class="stat"><b>₺${es.pending.toLocaleString('tr-TR')}</b><span>Pending payouts</span></div>
      <div class="stat"><b>₺${es.allTime.toLocaleString('tr-TR')}</b><span>All time</span></div>
      <div class="stat"><b>${es.occupancy}%</b><span>Occupancy</span></div>
    </div>
    <div class="trustnote">${ICON.shield}<span>Amounts are after Pawcation’s ${Math.round(COMMISSION*100)}% commission. Payments are held in escrow and released ${RELEASE_DELAY_DAYS} day after check-out.</span></div>
    <button class="btn btn-ghost" style="margin-bottom:6px" data-action="nav2-statement">Monthly statement</button>
    <div class="section-label">Earnings · last 6 months</div>
    ${barChartHTML(series,'amount',v=>'₺'+v.toLocaleString('tr-TR'),true)}
    <div class="section-label">Occupancy · last 6 months</div>
    ${barChartHTML(series,'occ',v=>v+'%',true)}

function nextFreeRange(s, nights, fromISO){
  const d = new Date(fromISO+'T00:00:00');
  for(let tries=0; tries<60; tries++){
    const out = new Date(d); out.setDate(out.getDate()+nights);
    if(!isRangeBlocked(s, isoLocal(d), isoLocal(out))) return { in:isoLocal(d), out:isoLocal(out) };
    d.setDate(d.getDate()+1);
  }
  return { in:fromISO, out:fromISO };
}
function rebookRailHTML(){
  if(state.mode!=='owner' || state.search.view==='map' || state.search.q) return '';

function bePhotoToBlob(dataUrl){
  const m = /^data:(.+?);base64,(.*)$/.exec(dataUrl); if(!m) return null;
  const bin = atob(m[2]), arr = new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
  return { blob:new Blob([arr],{type:m[1]}), type:m[1] };
}
async function backendSync(){
  if(!BE.ready || !BE.user) return;
  if(BE.busy){ BE.again = true; return; }
  if(navigator.onLine===false){ BE.status='offline'; beStatusUI(); return; }
  BE.busy = true;
  try{
    const sb = BE.sb, uid = BE.user.id;
    state.myPets.forEach(p=>{ if(!p.id) p.id = beUUID(); });
    for(const p of state.myPets){
      if(typeof p.photo==='string' && p.photo.startsWith('data:')){
        const f = bePhotoToBlob(p.photo); if(!f) continue;
        BE.status='saving'; beStatusUI();
        const path = `${uid}/${p.id}.${(f.type.split('/')[1]||'jpg').replace('jpeg','jpg')}`;
        const up = await sb.storage.from('pet-photos').upload(path, f.blob, { contentType:f.type, upsert:true });
        if(up.error) throw up.error;
        p.photo = sb.storage.from('pet-photos').getPublicUrl(path).data.publicUrl + '?v=' + Date.now();
      }
    }
    const cur = beSlices();
    if(cur.profile===BE.snap.profile && cur.pets===BE.snap.pets && cur.bookings===BE.snap.bookings && cur.favorites===BE.snap.favorites){ BE.status='saved'; beStatusUI(); return; }
    BE.status='saving'; beStatusUI();
    const done = {};
    if(cur.profile!==BE.snap.profile){ const r = await sb.from('profiles').update(JSON.parse(cur.profile)).eq('id',uid); if(r.error) throw r.error; done.profile=cur.profile; }
    if(cur.pets!==BE.snap.pets){
      const rows = JSON.parse(cur.pets).map(r=>({ ...r, owner_id:uid }));
      const ex = await sb.from('pets').select('id').eq('owner_id',uid); if(ex.error) throw ex.error;
      const keep = new Set(rows.map(r=>r.id)), del = (ex.data||[]).map(r=>r.id).filter(id=>!keep.has(id));
      if(del.length){ const r = await sb.from('pets').delete().eq('owner_id',uid).in('id',del); if(r.error) throw r.error; }
      if(rows.length){ const r = await sb.from('pets').upsert(rows,{ onConflict:'id' }); if(r.error) throw r.error; }
      done.pets=cur.pets;
    }
    if(cur.bookings!==BE.snap.bookings){
      const rows = JSON.parse(cur.bookings).map(r=>({ ...r, user_id:uid }));
      const ex = await sb.from('bookings').select('id').eq('user_id',uid); if(ex.error) throw ex.error;
      const keep = new Set(rows.map(r=>r.id)), del = (ex.data||[]).map(r=>r.id).filter(id=>!keep.has(id));
      if(del.length){ const r = await sb.from('bookings').delete().eq('user_id',uid).in('id',del); if(r.error) throw r.error; }
      if(rows.length){ const r = await sb.from('bookings').upsert(rows,{ onConflict:'user_id,id' }); if(r.error) throw r.error; }
      done.bookings=cur.bookings;
    }
    if(cur.favorites!==BE.snap.favorites){
      const ids = JSON.parse(cur.favorites);
      const ex = await sb.from('favorites').select('sitter_id').eq('user_id',uid); if(ex.error) throw ex.error;
      const del = (ex.data||[]).map(r=>r.sitter_id).filter(id=>!ids.includes(id));
      if(del.length){ const r = await sb.from('favorites').delete().eq('user_id',uid).in('sitter_id',del); if(r.error) throw r.error; }
      if(ids.length){ const r = await sb.from('favorites').upsert(ids.map(sid=>({ user_id:uid, sitter_id:sid })),{ onConflict:'user_id,sitter_id' }); if(r.error) throw r.error; }
      done.favorites=cur.favorites;
    }
    Object.assign(BE.snap, done); BE.status='saved'; BE.error='';
  }catch(e){ BE.status='error'; BE.error = (e && e.message) || String(e); console.warn('Pawcation sync failed:', e); }
  finally{ BE.busy=false; beStatusUI(); if(BE.again){ BE.again=false; backendSyncSoon(); } }
}

  state.myPets = (pets.data||[]).map(r=>({ ...r.data, id:r.id, name:r.name }));

/* a11y pass: roles, labels, keyboard — runs after every render (and from the DOM observer) */
const ARIA_BY_ACTION = [
  [/^back$/,'Back'],[/^tap-bell$/,'Notifications'],[/^flt-toggle$/,'Filters'],[/^map-zoom-in$/,'Zoom in'],[/^map-zoom-out$/,'Zoom out'],
  [/^toggle-fav-/,'Favourite'],[/^send-chat-/,'Send message'],[/^clear-search$/,'Clear search'],[/^pets-dec$/,'Fewer pets'],[/^pets-inc$/,'More pets'],
  [/^copy-ref$/,'Copy code'],[/^share-ref$/,'Share code']
];
function a11yApply(root){
  root = root || document;
  root.querySelectorAll('[data-action]').forEach(el=>{
    const tag = el.tagName;
    if(tag!=='BUTTON' && tag!=='A' && tag!=='INPUT' && tag!=='SELECT' && !el.closest('svg') && !el.hasAttribute('role')){
      if(!el.hasAttribute('tabindex')) el.setAttribute('tabindex','0');
      if(!el.querySelector('[data-action],button,a,input,select,textarea')) el.setAttribute('role','button');
    }
    if(!el.hasAttribute('aria-label') && !(el.textContent||'').trim()){
      const a = el.getAttribute('data-action')||''; const hit = ARIA_BY_ACTION.find(([re])=>re.test(a));
      el.setAttribute('aria-label', hit ? (state.lang==='tr' ? (TR_EXACT[hit[1]]||hit[1]) : hit[1]) : a.replace(/-/g,' '));
    }
    if(el.classList.contains('chip') || el.closest('.viewtoggle') || el.classList.contains('langpill')){
      el.setAttribute('aria-pressed', el.classList.contains('active') ? 'true':'false');
    }
  });
  root.querySelectorAll('.field').forEach(f=>{
    const lab = f.querySelector('label'), inp = f.querySelector('input,select,textarea');
    if(lab && inp && !lab.htmlFor){
      if(!inp.id) inp.id = 'fld-'+Math.random().toString(36).slice(2,8);
      lab.htmlFor = inp.id;
    }
  });
  root.querySelectorAll('input[type=file]:not([aria-label])').forEach(i=>{ const t = i.closest('.upload-tile'); const lab = t && t.querySelector('.uplabel-empty,.uplabel'); i.setAttribute('aria-label', (lab && lab.textContent.trim()) || 'Choose a file'); });
  root.querySelectorAll('input:not([aria-label])').forEach(i=>{ if(!i.labels || !i.labels.length){ const ph=i.getAttribute('placeholder'); if(ph) i.setAttribute('aria-label', ph); } });
  const bn = document.getElementById('bottomnav'); if(bn){ bn.setAttribute('role','navigation'); bn.setAttribute('aria-label','Main'); }
  const ct = document.getElementById('content'); if(ct){ ct.setAttribute('role','main'); }
  const ti = document.getElementById('toast'); if(ti){ ti.setAttribute('role','status'); ti.setAttribute('aria-live','polite'); }
  document.querySelectorAll('.navitem').forEach(n=>{ n.setAttribute('aria-current', n.classList.contains('active') ? 'page' : 'false'); });
  document.querySelectorAll('img:not([alt])').forEach(i=>i.setAttribute('alt',''));
}

});

function sitterBreakdown(s){
  if(!s.sub) return null;
  const extra = REVIEWS.filter(r=>r.sitterId===s.id && r.communication), w = s.reviews || 20;
  const avg = k => (s.sub[k]*w + extra.reduce((a,r)=>a+(r[k]||0),0)) / (w+extra.length);
  return { communication:avg('communication'), cleanliness:avg('cleanliness'), reliability:avg('reliability'), n:w+extra.length };
}
function breakdownHTML(s){
  const b = sitterBreakdown(s); if(!b) return '';
  const row = (l,v)=>`<div class="subbar"><span>${l}</span><div class="bar-track"><div style="width:${(v/5*100).toFixed(0)}%"></div></div><b>${v.toFixed(1)}</b></div>`;
  return `<div class="section-label">Rating breakdown</div><div class="breakdown">${row('Communication',b.communication)}${row('Cleanliness',b.cleanliness)}${row('Reliability',b.reliability)}</div>`;
}

}

document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-action]');
  if(!el) return;
  const action = el.dataset.action;
  // a drag on the map must not count as a tap on a pin
  if(mapDragMoved && Date.now()-mapDragEnd < 300 && action.startsWith('map-')){ return; }
  if(handleGrowthClick(action, el)) return;
  if(handleMoneyClick(action)) return;
  if(handleR12Click(action, el)) return;
  if(handleChatClick(action)) return;

  /* ---- search / filter / map ---- */
  if(action==='search-clear'){ state.search.q=''; render(); return; }
  if(action==='flt-toggle'){ state.search.panel = !state.search.panel; render(); return; }
  if(action==='view-list'){ state.search.view='list'; render(); return; }
  if(action==='view-map'){ state.search.view='map'; render(); return; }
  if(action.startsWith('flt-area-')){ state.search.area = action.replace('flt-area-',''); render(); return; }
  if(action==='flt-instant'){ state.search.instant = !state.search.instant; render(); return; }
  if(action==='flt-fast'){ state.search.fast = !state.search.fast; render(); return; }
  if(action==='flt-super'){ state.search.superOnly = !state.search.superOnly; render(); return; }
  if(action.startsWith('flt-dist-')){ state.search.maxDist = parseInt(action.replace('flt-dist-',''),10)||0; render(); return; }
  if(action==='flt-clear'){
    Object.assign(state.search, { q:'', area:'All', maxPrice:700, instant:false, fast:false, superOnly:false, checkIn:'', checkOut:'', maxDist:0, pin:null });
    state.filter = 'All';
    if(state.search.sort==='distance' && !state.userLoc) state.search.sort='rating';
    render(); return;
  }
  if(action==='flt-near'){
    if(state.userLoc){
      state.userLoc = null; state.search.maxDist = 0;
      if(state.search.sort==='distance') state.search.sort = 'rating';
      render(); return;
    }
    const setLoc = (lat,lng,mock) => {
      state.userLoc = { lat, lng, mock };
      state.search.sort = 'distance';
      render();
      toast(t(mock ? 'toast_loc_mock' : 'toast_loc_ok'));
    };
    const fallback = () => setLoc(40.987, 29.026, true);
    if(navigator.geolocation){
      navigator.geolocation.getCurrentPosition(
        pos => { const la=pos.coords.latitude, lo=pos.coords.longitude; (la>40.80 && la<41.35 && lo>28.60 && lo<29.50) ? setLoc(la,lo,false) : fallback(); },
        fallback, { timeout:3500, maximumAge:600000 });
    } else fallback();
    return;
  }
  if(action.startsWith('map-pin-')){
    const id = action.replace('map-pin-','');
    state.search.pin = (state.search.pin===id) ? null : id;
    refreshResults();
    return;
  }
  if(action==='map-zoom-in' || action==='map-zoom-out'){
    const mv = state.search.mv;
    const cx = mv.x + MAP.W/mv.s/2, cy = mv.y + MAP.H/mv.s/2;
    mv.s = Math.max(1, Math.min(4, mv.s * (action==='map-zoom-in' ? 1.6 : 1/1.6)));
    if(mv.s < 1.05) mv.s = 1;
    mv.x = cx - MAP.W/mv.s/2; mv.y = cy - MAP.H/mv.s/2;
    refreshResults();
    return;
  }

  if(action==='pick-owner'){ state.onboarded=true; state.mode='owner'; go('browse'); return; }
  if(action==='pick-sitter'){ state.onboarded=true; state.mode='sitter'; go('browse'); return; }
  if(action==='pick-trainer'){ state.onboarded=true; state.mode='trainer'; go('browse'); return; }
  if(action==='set-lang-en'){ setLang('en'); return; }
  if(action==='set-lang-tr'){ setLang('tr'); return; }
  if(action==='tour-skip'){ go('onboard'); return; }
  if(action==='tour-next'){
    if((state.tourStep||0) >= 3){ go('onboard'); }
    else { state.tourStep = (state.tourStep||0) + 1; render(); }
    return;
  }
  if(action && action.startsWith('tour-dot-')){ state.tourStep = parseInt(action.replace('tour-dot-','')); render(); return; }
  if(action==='nav2-tour'){ state.tourStep = 0; go('tour'); return; }
  if(action==='mode-owner'){ setMode('owner'); return; }
  if(action==='mode-sitter'){ setMode('sitter'); return; }
  if(action==='mode-trainer'){ setMode('trainer'); return; }
  if(action==='tap-bell'){ state.notifications.forEach(n=> n.read=true); computeReminders().forEach(r=>{ if(!state.seenReminders.includes(r.id)) state.seenReminders.push(r.id); }); saveGrowthState(); go('notifications'); return; }
  if(action==='back'){
    if(state.screen==='detail' && state.selectedId==='me') go('hostprofile');
    else if(state.screen==='detail' || state.screen==='requestDetail' || state.screen==='trainingDetail') go('browse');
    else if(state.screen==='request') go('detail', {selectedId:state.selectedId});
    else if(state.screen==='ticket') go('bookings');
    else if(state.screen==='addpet') go(state.editPetIdx!=null ? 'petdetail' : 'mypets');
    else if(state.screen==='petdetail') go('mypets');
    else if(state.screen==='policy') go(state.policyReturnTo || 'policyhub');
    else if(state.screen==='policyhub') go('profile');
    else if(state.screen==='documents') go('profile');
    else if(state.screen==='bookingDetail') go('bookings');
    else if(state.screen==='sos') go('bookingDetail', {selectedId:state.selectedId});
    else if(state.screen==='leaveReview'){ state.reviewDraft=null; go('bookingDetail', {selectedId:state.selectedId}); }
    else if(state.screen==='cancelBooking' || state.screen==='reschedule') go('bookingDetail', {selectedId:state.selectedId});
    else if(state.screen==='reportForm' || state.screen==='incidentForm') go('bookingDetail', {selectedId:state.selectedId});
    else if(state.screen==='meetForm') go('detail', {selectedId:state.selectedId});
    else if(state.screen==='incidentDetail') go(state.incidentReturn==='bookingDetail' ? 'bookingDetail' : 'incidents');
    else if(state.screen==='incidents') go('profile');
    else if(state.screen==='receipt') go(state.receiptReturn==='receipts' ? 'receipts' : 'bookingDetail');
    else if(state.screen==='receipts' || state.screen==='plus' || state.screen==='boost' || state.screen==='services') go('profile');
    else if(state.screen==='statement') go('earnings');
    else if(state.screen==='notifsettings') go('notifications');
    else if(state.screen==='hostprofile' || state.screen==='offers') go('profile');
    else if(state.screen==='shareProfile') go(state.shareReturn && state.shareReturn!=='shareProfile' ? state.shareReturn : 'browse');
    else if(state.screen==='chatThread') go('messages');
    else if(['verify','payment','mypets','trainercv','notifications','rewards','availability','favorites','tour','earnings','pricing','invite','settings'].includes(state.screen)) go('profile');
    else go('browse');
    return;
  }
  if(action.startsWith('open-policy-')){
    const rest = action.replace('open-policy-','').split('-');
    const returnTo = rest.pop();
    const key = rest.join('-');
    state.activePolicy = key;
    state.policyReturnTo = returnTo;
    go('policy');
    return;
  }
  if(action==='nav2-policyhub'){ go('policyhub'); return; }
  if(action==='nav2-documents'){ go('documents'); return; }
  if(action==='nav2-rewards'){ go('rewards'); return; }
  if(action.startsWith('redeem-reward-')){
    const id = action.replace('redeem-reward-','');
    const r = REWARDS.find(x=>x.id===id);
    if(!r || state.loyaltyPoints < r.cost){ toast('Not enough points yet'); return; }
    state.loyaltyPoints -= r.cost;
    state.redeemedRewards.push({ rewardId:r.id, used:false, title:r.title, when:'Just now', code:'PWC-'+Math.random().toString(36).slice(2,7).toUpperCase() });
    toast(r.title+' redeemed!');
    render();
    return;
  }
  if(action==='nav2-availability'){ go('availability'); return; }
  if(action.startsWith('toggle-avail-')){
    const iso = action.replace('toggle-avail-','');
    const idx = state.myBlockedDates.indexOf(iso);
    if(idx>-1) state.myBlockedDates.splice(idx,1); else state.myBlockedDates.push(iso);
    render();
    return;
  }
  if(action==='nav2-favorites'){ go('favorites'); return; }
  if(action.startsWith('toggle-fav-')){
    const id = action.replace('toggle-fav-','');
    const idx = state.favorites.indexOf(id);
    if(idx>-1){ state.favorites.splice(idx,1); toast('Removed from favorites'); }
    else { state.favorites.push(id); toast('Added to favorites'); }
    render();
    return;
  }
  if(action.startsWith('open-chat-')){
    const id = action.replace('open-chat-','');
    if(state.chats[id]) state.chats[id].unread = false;
    go('chatThread', {selectedId:id});
    app.content.scrollTop = app.content.scrollHeight;
    return;
  }
  if(action.startsWith('send-chat-')){
    const id = action.replace('send-chat-','');
    const input = document.getElementById('chat-input');
    const text = input.value.trim();
    const media = pendingUploads.chatMedia || null;
    if(!text && !media) return;
    const t = state.chats[id];
    t.messages.push({from:'me', text, media, when:'Just now'});
    delete pendingUploads.chatMedia;
    go('chatThread', {selectedId:id});
    app.content.scrollTop = app.content.scrollHeight;
    setTimeout(()=>{
      if(state.screen==='chatThread' && state.selectedId===id){
        const replies = media && !text ? ["Love it, thanks for sharing! 🐾", "Aww, thank you!"] : ["Got it, thank you!", "Sounds good 👍", "Will do — I'll keep you posted.", "Perfect, see you then!"];
        t.messages.push({from:'them', text: replies[Math.floor(Math.random()*replies.length)], when:'Just now'});
        render();
        app.content.scrollTop = app.content.scrollHeight;
      }
    }, 1300);
    return;
  }
  if(action.startsWith('open-cancel-')){ go('cancelBooking', {selectedId: action.replace('open-cancel-','')}); return; }
  if(action.startsWith('confirm-cancel-')){
    const id = action.replace('confirm-cancel-','');
    const b = state.bookings.find(x=>x.id===id);
    doCancel(id);
    go('bookingDetail', {selectedId:id});
    return;
  }
  if(action.startsWith('open-reschedule-')){ go('reschedule', {selectedId: action.replace('open-reschedule-','')}); return; }
  if(action.startsWith('confirm-reschedule-')){
    const id = action.replace('confirm-reschedule-','');
    const b = state.bookings.find(x=>x.id===id);
    const newIn = document.getElementById('resch-in').value;
    const newOut = document.getElementById('resch-out').value;
    if(b){ b.checkIn = newIn; b.checkOut = newOut; b.status = 'pending'; }
    toast('New dates sent — waiting for confirmation');
    go('bookingDetail', {selectedId:id});
    return;
  }
  if(action.startsWith('nav-')){ go(action.replace('nav-','')); return; }
  if(action.startsWith('filter-')){ state.filter = action.replace('filter-',''); render(); return; }
  if(action.startsWith('open-sitter-')){ go('detail', {selectedId: action.replace('open-sitter-','')}); return; }

/* ---- live credit card preview: network detection (local) + bank detection (live BIN lookup) ---- */
let currentCardDetect = { scheme: null, bankName: null };
let binLookupTimer = null;
let binLookupToken = 0;

const SCHEME_PATTERNS = [
  { name: 'Troy',        test: n => /^9792/.test(n) },
  { name: 'Amex',        test: n => /^3[47]/.test(n) },
  { name: 'Diners Club', test: n => /^3(?:0[0-5]|[68])/.test(n) },
  { name: 'JCB',         test: n => /^35(?:2[89]|[3-8]\d)/.test(n) },
  { name: 'Discover',    test: n => /^(?:6011|65|64[4-9])/.test(n) },
  { name: 'Mastercard',  test: n => /^(?:5[1-5]|22[2-9]|2[3-6]\d|27[01]\d|2720)/.test(n) },
  { name: 'Visa',        test: n => /^4/.test(n) },
];
/* Brand badge styling — original color/abbreviation pairing, not a reproduction of any brand's official logo artwork */
const SCHEME_META = {
  'Visa':         { bg:'#2C5CE0', abbr:'VISA' },
  'Mastercard':   { bg:'#D9542F', abbr:'MC'   },
  'Amex':         { bg:'#2E7D74', abbr:'AMEX' },
  'Troy':         { bg:'#B8433A', abbr:'TROY' },
  'Discover':     { bg:'#CB7B1E', abbr:'DISC' },
  'Diners Club':  { bg:'#5B6B7A', abbr:'DIN'  },
  'JCB':          { bg:'#3D6B8C', abbr:'JCB'  },
};
function detectScheme(number){
  const hit = SCHEME_PATTERNS.find(p => p.test(number));
  return hit ? hit.name : null;
}

function setBankLine(html){
  const el = document.getElementById('cc-prev-bank');
  if(el) el.innerHTML = html;
}

function lookupBank(bin){
  const myToken = ++binLookupToken;
  setBankLine(`<span class="spinner"></span> Looking up issuing bank…`);
  fetch(`https://lookup.binlist.net/${bin}`, { headers: { 'Accept-Version': '3' } })
    .then(res => { if(!res.ok) throw new Error('not found'); return res.json(); })
    .then(data => {
      if(myToken !== binLookupToken) return; // a newer keystroke superseded this lookup
      const bankName = data.bank && data.bank.name ? data.bank.name : null;
      const country = data.country && data.country.emoji ? ' ' + data.country.emoji : '';
      currentCardDetect.bankName = bankName;
      setBankLine(bankName ? `${bankName}${country}` : 'Bank not identified');
    })
    .catch(() => {
      if(myToken !== binLookupToken) return;
      currentCardDetect.bankName = null;
      setBankLine('Bank not identified');
    });
}

/* ============ TURKISH TRANSLATION LAYER ============
   Screens are still written in English; when state.lang === 'tr' every rendered text node,
   placeholder and toast is translated after it hits the DOM (exact phrases first, then patterns).
   Logic never reads the translated text — data-action / option values stay untouched. */

const TR_MONTHS_LONG = {January:'Ocak',February:'Şubat',March:'Mart',April:'Nisan',May:'Mayıs',June:'Haziran',July:'Temmuz',August:'Ağustos',September:'Eylül',October:'Ekim',November:'Kasım',December:'Aralık'};

/* Turkish case suffixes for names (dative / accusative / genitive / ablative) */
function trSuffix(name, kind){
  const w = String(name).trim();
  let back = false, round = false;
  for(let i=w.length-1;i>=0;i--){
    const c = w[i];
    if('aıouAIOUâ'.includes(c)){ back = true; round = 'ouOU'.includes(c); break; }
    if('eiöüEİÖÜ'.includes(c)){ back = false; round = 'öüÖÜ'.includes(c); break; }
  }
  const endsVowel = /[aeıioöuüAEIİOÖUÜ]$/.test(w);
  const two = back ? 'a' : 'e';
  const four = back ? (round ? 'u' : 'ı') : (round ? 'ü' : 'i');
  if(kind==='dat') return w+"'"+(endsVowel?'y':'')+two;
  if(kind==='acc') return w+"'"+(endsVowel?'y':'')+four;
  if(kind==='gen') return w+"'"+(endsVowel?'n':'')+four+'n';
  if(kind==='abl') return w+"'"+(/[çfhkpsşt]$/i.test(w)?'t':'d')+two+'n';
  return w;
}

function trCore(c){
  if(Object.prototype.hasOwnProperty.call(TR_EXACT, c)) return TR_EXACT[c];
  for(const [re,fn] of TR_PATTERNS){ const m = c.match(re); if(m) return fn(...m); }
  for(const sep of [' · ',' – ']){
    if(c.includes(sep)){
      const parts = c.split(sep), out = parts.map(trCore);
      if(out.some((o,i)=>o!==parts[i])) return out.join(sep);
    }
  }
  return trMoney(c.replace(/\bIstanbul\b/g,'İstanbul').replace(/\bTurkey\b/g,'Türkiye'));
}
function trText(raw){
  const core = raw.trim();
  if(!core) return raw;
  const out = trCore(core);
  if(out===core) return raw;
  return raw.slice(0, raw.indexOf(core)) + out + raw.slice(raw.indexOf(core)+core.length);
}
function trApply(node){
  if(!node) return;
  if(state.lang!=='tr'){ if(X_LANGS.includes(state.lang)) xApply(node); return; }
  if(node.nodeType===3){
    const par = node.parentNode, p = par && par.nodeName;
    if(p==='SCRIPT' || p==='STYLE') return;
    if(p==='P' && par.closest && par.closest('.chat-bubble.me')) return;   // never rewrite what the user typed
    const o = trText(node.nodeValue); if(o!==node.nodeValue) node.nodeValue = o;
    return;
  }
  if(node.nodeType!==1) return;
  // <option> text doubles as its value — pin the English value first so form logic is unaffected
  node.querySelectorAll('option').forEach(o => { if(!o.hasAttribute('value')) o.setAttribute('value', o.textContent); });
  if(node.nodeName==='OPTION' && !node.hasAttribute('value')) node.setAttribute('value', node.textContent);
  const w = document.createTreeWalker(node, NodeFilter.SHOW_TEXT);
  const list = []; while(w.nextNode()) list.push(w.currentNode);
  list.forEach(trApply);
  const ph = el => { const v = el.getAttribute('placeholder'), o = trText(v); if(o!==v) el.setAttribute('placeholder', o); };
  if(node.hasAttribute && node.hasAttribute('placeholder')) ph(node);
  node.querySelectorAll('[placeholder]').forEach(ph);
  // pre-filled date inputs on the reschedule screen carry English month names
  node.querySelectorAll('#resch-in, #resch-out').forEach(i => { const o = trText(i.value); if(o!==i.value) i.value = o; });
  // calendar weekday header (Sunday-first): S M T W T F S -> P P S Ç P C C
  node.querySelectorAll('.cal-grid-head').forEach(h => {
    if(h.dataset.tr) return; h.dataset.tr = '1';
    ['P','P','S','Ç','P','C','C'].forEach((l,i)=>{ if(h.children[i]) h.children[i].textContent = l; });
  });
}
const trObserver = new MutationObserver(muts => {
  if(state.lang!=='tr' && !X_LANGS.includes(state.lang)) return;
  trObserver.disconnect();                       // our own edits must not re-trigger us
  muts.forEach(m => {
    if(m.type==='childList') m.addedNodes.forEach(trApply);
    else if(m.type==='characterData') trApply(m.target);
  });
  trObserver.observe(document.body, { childList:true, subtree:true, characterData:true });
});
trObserver.observe(document.body, { childList:true, subtree:true, characterData:true });
document.documentElement.lang = state.lang;
trApply(document.body);

let barkPlayed = false;
function playBark(){
  try{
    const Ctx = window.AudioContext || window.webkitAudioContext;
    const ctx = new Ctx();
    const now = ctx.currentTime;
    function woof(startOffset, duration){
      const bufferSize = Math.floor(ctx.sampleRate * duration);
      const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
      const data = buffer.getChannelData(0);
      for(let i=0;i<bufferSize;i++){ data[i] = (Math.random()*2-1) * Math.pow(1 - i/bufferSize, 1.6); }
      const noise = ctx.createBufferSource();
      noise.buffer = buffer;
      const filter = ctx.createBiquadFilter();
      filter.type = 'bandpass';
      filter.Q.value = 0.8;
      filter.frequency.setValueAtTime(1000, now+startOffset);
      filter.frequency.exponentialRampToValueAtTime(200, now+startOffset+duration);
      const gain = ctx.createGain();
      gain.gain.setValueAtTime(0.0001, now+startOffset);
      gain.gain.exponentialRampToValueAtTime(0.85, now+startOffset+0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, now+startOffset+duration);
      noise.connect(filter); filter.connect(gain); gain.connect(ctx.destination);
      noise.start(now+startOffset);
      noise.stop(now+startOffset+duration+0.02);
    }
    woof(0, 0.16);
    woof(0.20, 0.13);
    barkPlayed = true;
  }catch(e){ /* Web Audio unavailable — fail silently */ }
}

/* ============ LOADING SCREEN ============ */
const loaderEl = document.getElementById('loader');
function hideLoader(){
  if(!loaderEl) return;
  loaderEl.classList.add('hide');
  setTimeout(() => loaderEl.remove(), 550);
}
// Don't wait on window 'load' (fonts/images) — on a slow connection that event can be
// delayed a long time or never fire cleanly, which would leave the loader stuck.
// The app itself doesn't depend on those resources, so we just run on a plain timer.
playBark(); // will silently fail if the browser blocks autoplay audio before any user gesture
setTimeout(hideLoader, 1900);
// Absolute safety net: no matter what happens above, never let the loader stay up more than 5s
setTimeout(hideLoader, 5000);
// Fallback: if autoplay was blocked, play the bark on the visitor's first tap/click anywhere
document.addEventListener('click', function firstGestureBark(){
  if(!barkPlayed) playBark();
}, { once:true });
</script>
