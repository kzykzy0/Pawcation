<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1E3A2B">
<title>Pawcation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1E3A2B;
    --ink-soft:#4A5F4F;
    --canvas:#F1EFE2;
    --paper:#FFFFFF;
    --line:#DAD5BF;
    --gold:#E3A23B;
    --gold-deep:#C67F1E;
    --moss:#6E8F72;
    --moss-deep:#4F7256;
    --stamp:#C1442E;
    --shadow: 0 18px 40px -18px rgba(30,58,43,0.35);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0; height:100%;}
  body{
    background:var(--canvas);
    font-family:'Inter',sans-serif;
    color:var(--ink);
    overflow:hidden;
  }

  /* ---------- app shell (fills the real page width) ---------- */
  .screen-wrap{
    width:100%;
    height:100dvh;
    background:var(--canvas);
    position:relative;
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }

  /* content that should stay a comfortable reading/form width even on a wide browser */
  .narrow{ max-width:640px; margin:0 auto; width:100%; }

  /* card lists: single column on phones, multi-column grid once there's room */
  .card-grid{ display:block; }
  @media (min-width:760px){
    .card-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(300px,1fr)); gap:16px; align-items:start; }
    .card-grid .card{ margin-bottom:0; }
  }

  /* ---------- top bar / mode switch ---------- */
  .topbar{
    padding:calc(env(safe-area-inset-top, 0px) + 16px) 20px 14px;
    flex-shrink:0;
  }
  .topbar-row{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    margin-bottom:12px;
  }
  .brand{
    display:flex; align-items:center; gap:8px;
    font-family:'Fraunces',serif; font-weight:700; font-size:19px;
  }
  .brand .mark{
    width:30px;height:30px;border-radius:9px;
    background:var(--ink);
    display:flex;align-items:center;justify-content:center;
    color:var(--gold);
  }
  .backbtn{
    width:34px;height:34px;border-radius:50%;
    background:var(--paper);
    display:flex;align-items:center;justify-content:center;
    border:1px solid var(--line);
    cursor:pointer;
    flex-shrink:0;
  }
  .modeswitch{
    display:flex;
    background:rgba(30,58,43,0.08);
    border-radius:999px;
    padding:3px;
    gap:2px;
  }
  .modeswitch button{
    border:none; background:transparent;
    font-family:'Inter',sans-serif; font-size:12px; font-weight:600;
    padding:8px 8px; border-radius:999px;
    color:var(--ink-soft);
    cursor:pointer;
    transition:.2s;
    flex:1;
    text-align:center;
    white-space:nowrap;
  }
  .modeswitch button.active{
    background:var(--ink); color:var(--canvas);
  }

  /* ---------- content area ---------- */
  .content{
    flex:1;
    overflow-y:auto;
    padding:0 20px 100px;
  }
  @media (min-width:900px){
    .content{ padding:0 40px 100px; }
    .topbar{ padding-left:40px; padding-right:40px; }
  }
  .content::-webkit-scrollbar{display:none;}
  h2.title{
    font-family:'Fraunces',serif; font-weight:600; font-size:24px;
    margin:2px 0 4px;
  }
  .subtitle{
    font-size:13.5px; color:var(--ink-soft); margin:0 0 18px; line-height:1.5;
  }

  /* ---------- search ---------- */
  .searchbar{
    display:flex; align-items:center; gap:10px;
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:16px;
    padding:12px 14px;
    margin-bottom:16px;
  }
  .searchbar input{
    border:none; outline:none; background:transparent;
    font-family:'Inter',sans-serif; font-size:14px; color:var(--ink);
    width:100%;
  }
  .searchbar input::placeholder{color:#9CA694;}

  .chiprow{display:flex; gap:8px; overflow-x:auto; margin-bottom:18px; padding-bottom:2px;}
  .chiprow::-webkit-scrollbar{display:none;}
  .chip{
    flex-shrink:0;
    font-size:12.5px; font-weight:600;
    padding:8px 14px; border-radius:999px;
    background:var(--paper); border:1px solid var(--line);
    color:var(--ink-soft);
    cursor:pointer;
    white-space:nowrap;
  }
  .chip.active{ background:var(--moss); border-color:var(--moss); color:#fff; }

  /* ---------- sitter / pet cards ---------- */
  .card{
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:20px;
    padding:14px;
    margin-bottom:14px;
    display:flex; gap:12px;
    cursor:pointer;
    transition:transform .15s ease;
  }
  .card:active{ transform:scale(0.98); }
  .thumb{
    width:78px;height:78px;border-radius:14px;flex-shrink:0;
    background-size:cover; background-position:center;
    display:flex; align-items:flex-end; justify-content:flex-end;
    position:relative;
  }
  .heart-btn{
    position:absolute; top:5px; right:5px; width:24px; height:24px; border-radius:50%;
    background:rgba(255,255,255,0.9); display:flex; align-items:center; justify-content:center;
    color:var(--stamp); cursor:pointer; z-index:2;
  }
  .heart-btn svg{ width:13px; height:13px; }
  .heart-btn.active svg{ fill:var(--stamp); }
  .hero-img .heart-btn{ top:16px; right:16px; width:38px; height:38px; }
  .hero-img .heart-btn svg{ width:18px; height:18px; }
  .card-body{flex:1; min-width:0;}
  .card-toprow{display:flex; justify-content:space-between; align-items:flex-start; gap:6px;}
  .card-name{font-family:'Fraunces',serif; font-weight:600; font-size:16px;}
  .rating{
    display:flex; align-items:center; gap:3px;
    font-family:'IBM Plex Mono',monospace; font-size:12px; font-weight:600;
    color:var(--gold-deep); flex-shrink:0;
  }
  .card-loc{font-size:12.5px; color:var(--ink-soft); margin:2px 0 6px; display:flex; align-items:center; gap:4px;}
  .tagrow{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:6px;}
  .tag{
    font-size:11px; font-weight:600; color:var(--moss-deep);
    background:rgba(110,143,114,0.14);
    padding:3px 8px; border-radius:8px;
  }
  .price{font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:13.5px;}
  .price span{color:var(--ink-soft); font-weight:400; font-size:11.5px;}

  /* ---------- section label ---------- */
  .section-label{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px; font-weight:600; letter-spacing:.1em; text-transform:uppercase;
    color:var(--ink-soft); margin:22px 0 10px;
  }

  /* ---------- onboarding ---------- */
  .onboard{
    height:100%; max-width:460px; margin:0 auto; display:flex; flex-direction:column; justify-content:center;
    padding:0 22px 60px; text-align:center; position:relative;
  }
  .onboard .mark-lg{
    width:64px;height:64px;border-radius:20px; background:var(--ink); color:var(--gold);
    display:flex;align-items:center;justify-content:center; margin:0 auto 18px;
  }
  .onboard h1{
    font-family:'Fraunces',serif; font-size:30px; font-weight:600; margin:0 0 8px; line-height:1.15;
  }
  .onboard p.tag{
    font-size:14px; color:var(--ink-soft); line-height:1.5; margin:0 0 34px;
    background:transparent; padding:0;
  }
  .roleoption{
    display:flex; align-items:center; gap:14px; text-align:left;
    background:var(--paper); border:1.5px solid var(--line); border-radius:20px;
    padding:16px; margin-bottom:14px; cursor:pointer;
  }
  .roleoption .ricon{
    width:48px;height:48px;border-radius:14px; flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
  }
  .roleoption.owner .ricon{ background:rgba(227,162,59,0.18); color:var(--gold-deep); }
  .roleoption.sitter .ricon{ background:rgba(110,143,114,0.18); color:var(--moss-deep); }
  .roleoption.trainer .ricon{ background:rgba(193,68,46,0.15); color:var(--stamp); }
  .roleoption strong{font-family:'Fraunces',serif; font-size:15.5px; font-weight:600; display:block;}
  .roleoption span{font-size:12.5px; color:var(--ink-soft);}

  /* ---------- language switch ---------- */
  .langswitch{
    position:absolute; top:18px; right:18px; display:flex; gap:2px;
    background:var(--paper); border:1.5px solid var(--line); border-radius:12px; padding:3px;
  }
  .onboard .langswitch{ position:absolute; }
  .langpill{
    font-family:'IBM Plex Mono',monospace; font-size:11px; font-weight:600;
    padding:5px 10px; border-radius:9px; cursor:pointer; color:var(--ink-soft);
  }
  .langpill.active{ background:var(--ink); color:var(--canvas); }

  /* ---------- onboarding tour ---------- */
  .tourscreen{ position:relative; }
  .tourskip{
    position:absolute; top:20px; left:0; right:0; text-align:center;
    font-size:12.5px; font-weight:600; color:var(--ink-soft); cursor:pointer;
  }
  .tourdots{ display:flex; gap:7px; justify-content:center; margin-bottom:26px; }
  .tourdot{ width:7px; height:7px; border-radius:50%; background:var(--line); }
  .tourdot.active{ background:var(--ink); width:20px; border-radius:5px; transition:all .2s; }
  .tourbtn{ margin-top:4px; }

  /* ---------- buttons ---------- */
  .btn{
    display:flex; align-items:center; justify-content:center; gap:8px;
    font-family:'Inter',sans-serif; font-weight:600; font-size:14.5px;
    padding:15px; border-radius:16px; border:none; cursor:pointer; width:100%;
  }
  .btn-primary{ background:var(--ink); color:var(--canvas); }
  .btn-primary:active{ background:#132a1d; }
  .btn-ghost{ background:transparent; color:var(--ink); border:1.5px solid var(--line); }
  .btn:disabled{ opacity:.45; cursor:not-allowed; }

  /* ---------- consent checkboxes ---------- */
  .consent-row{
    display:flex; align-items:flex-start; gap:10px;
    background:var(--paper); border:1px solid var(--line); border-radius:14px;
    padding:13px 14px; margin-bottom:10px; cursor:pointer;
  }
  .consent-box{
    width:20px; height:20px; border-radius:6px; flex-shrink:0; margin-top:1px;
    border:1.5px solid var(--line); background:var(--paper);
    display:flex; align-items:center; justify-content:center; color:#fff;
    transition:.15s;
  }
  .consent-row.checked .consent-box{ background:var(--moss); border-color:var(--moss); }
  .consent-row p{ font-size:12px; line-height:1.5; color:var(--ink-soft); margin:0; }
  .consent-row a{ color:var(--ink); text-decoration:underline; font-weight:600; cursor:pointer; }
  .consent-row.addon-row.checked .consent-box{ background:var(--gold-deep); border-color:var(--gold-deep); }
  .consent-row p b{ color:var(--ink); }

  /* ---------- price summary ---------- */
  .pricebox-summary{
    background:var(--paper); border:1px solid var(--line); border-radius:16px;
    padding:14px 16px; margin:4px 0 18px;
  }
  .pb-row{ display:flex; justify-content:space-between; font-size:13px; padding:5px 0; color:var(--ink-soft); }
  .pb-row b{ color:var(--ink); font-family:'IBM Plex Mono',monospace; font-weight:600; }
  .pb-row.total{ border-top:1px dashed var(--line); margin-top:4px; padding-top:10px; font-weight:600; color:var(--ink); }
  .pb-row.total b{ font-size:15.5px; }

  /* ---------- instant book / protect badge ---------- */
  .protect-badge{ display:flex; align-items:center; gap:5px; font-size:10.5px; font-weight:700; color:var(--moss-deep); margin-top:8px; }
  .protect-badge svg{ width:12px; height:12px; }

  /* ---------- loyalty / rewards ---------- */
  .pointsbanner{
    display:flex; align-items:center; justify-content:space-between;
    background:var(--ink); color:var(--canvas); border-radius:18px; padding:18px 20px; margin-bottom:18px;
  }
  .pointsbanner b{ font-family:'Fraunces',serif; font-size:26px; display:block; }
  .pointsbanner span{ font-size:11.5px; color:var(--canvas); opacity:.75; text-transform:uppercase; letter-spacing:.06em; }
  .pointsbanner svg{ width:30px; height:30px; color:var(--gold); }
  .reward-row{
    display:flex; align-items:center; gap:12px; background:var(--paper); border:1px solid var(--line);
    border-radius:16px; padding:12px 14px; margin-bottom:10px;
  }
  .reward-row.locked{ opacity:.55; }
  .rw-icon{ width:38px; height:38px; border-radius:11px; background:rgba(227,162,59,0.16); color:var(--gold-deep); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .rw-body{ flex:1; min-width:0; }
  .rw-body b{ display:block; font-size:13px; }
  .rw-body span{ font-size:11px; color:var(--ink-soft); }

  /* ---------- session schedule ---------- */
  .session-row{
    display:flex; align-items:center; gap:12px; background:var(--paper); border:1px solid var(--line);
    border-radius:14px; padding:10px 14px; margin-bottom:8px; cursor:pointer;
  }
  .session-row.done{ opacity:.6; }
  .session-num{
    width:26px; height:26px; border-radius:50%; background:rgba(110,143,114,0.15); color:var(--moss-deep);
    display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700; flex-shrink:0;
  }
  .session-body{ flex:1; min-width:0; }
  .session-body b{ display:block; font-size:13px; }
  .session-body span{ font-size:11px; color:var(--ink-soft); }
  .session-check{
    width:20px; height:20px; border-radius:50%; border:1.5px solid var(--line); flex-shrink:0;
    display:flex; align-items:center; justify-content:center; color:#fff;
  }
  .session-row.done .session-check{ background:var(--moss); border-color:var(--moss); }

  /* ---------- policy document viewer ---------- */
  .policy-updated{ font-size:11px; color:var(--ink-soft); margin:-8px 0 18px; font-style:italic; }
  .policy-block h3{ font-family:'Fraunces',serif; font-size:15px; font-weight:600; color:var(--ink); margin:20px 0 8px; }
  .policy-block p{ font-size:13px; line-height:1.65; color:#333; margin:0 0 12px; }
  .policy-block ul{ margin:0 0 14px; padding-left:20px; }
  .policy-block li{ font-size:13px; line-height:1.6; color:#333; margin-bottom:8px; }
  .policy-table{ width:100%; border-collapse:collapse; margin:6px 0 16px; font-size:12px; }
  .policy-table th{ background:var(--ink); color:#fff; text-align:left; padding:8px 10px; font-size:11px; }
  .policy-table td{ padding:8px 10px; border-bottom:1px solid var(--line); color:#333; }
  .policyhub-row{
    display:flex; align-items:center; justify-content:space-between;
    background:var(--paper); border:1px solid var(--line); border-radius:14px;
    padding:14px 16px; margin-bottom:10px; cursor:pointer; font-size:13.5px; font-weight:500;
  }
  .doc-row{
    display:flex; align-items:center; gap:14px;
    background:var(--paper); border:1px solid var(--line); border-radius:16px;
    padding:14px 16px; margin-bottom:10px; text-decoration:none;
  }
  .doc-icon{
    width:42px; height:42px; border-radius:11px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center; color:#fff;
  }
  .doc-info{ flex:1; min-width:0; }
  .doc-info b{ display:block; font-size:13.5px; color:var(--ink); font-family:'Fraunces',serif; font-weight:600; }
  .doc-info span{ font-size:11.5px; color:var(--ink-soft); }
  .doc-download{ color:var(--ink-soft); flex-shrink:0; }

  /* ---------- detail screen ---------- */
  .hero-img{
    height:230px; width:100%; background-size:cover; background-position:center;
    border-radius:0 0 28px 28px; position:relative; flex-shrink:0;
  }
  .hero-fade{position:absolute; inset:0; background:linear-gradient(180deg, rgba(0,0,0,0) 40%, rgba(14,26,18,0.55) 100%); border-radius:0 0 28px 28px;}
  .hero-topbtn{
    position:absolute; top:16px; width:34px;height:34px;border-radius:50%;
    background:rgba(255,255,255,0.85); backdrop-filter:blur(4px);
    display:flex;align-items:center;justify-content:center;
  }
  .hero-caption{
    position:absolute; bottom:14px; left:20px; right:20px; color:#fff;
  }
  .hero-caption h2{font-family:'Fraunces',serif; font-size:22px; font-weight:600; margin:0 0 2px;}
  .hero-caption .loc{font-size:12.5px; opacity:.9; display:flex; gap:4px; align-items:center;}

  .statrow{ display:flex; gap:10px; margin:16px 0 6px; }
  .stat{
    flex:1; background:var(--paper); border:1px solid var(--line); border-radius:14px;
    padding:10px; text-align:center;
  }
  .stat b{display:block; font-family:'Fraunces',serif; font-size:16px;}
  .stat span{font-size:10.5px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.06em;}

  .bio{ font-size:13.5px; line-height:1.6; color:var(--ink-soft); margin:14px 0; }

  .reviewcard{
    background:var(--paper); border:1px solid var(--line); border-radius:16px; padding:12px 14px; margin-bottom:10px;
  }
  .reviewcard .rh{display:flex; justify-content:space-between; font-size:12.5px; font-weight:600; margin-bottom:4px;}
  .reviewcard p{font-size:12.5px; color:var(--ink-soft); margin:0; line-height:1.5;}

  /* ---------- trust badges ---------- */
  .trustbadges{display:flex; flex-wrap:wrap; gap:6px; margin:8px 0 4px;}
  .trustbadge{
    display:flex; align-items:center; gap:5px;
    font-size:11px; font-weight:600; color:var(--moss-deep);
    background:rgba(110,143,114,0.14);
    padding:5px 10px 5px 8px; border-radius:999px;
  }
  .trustbadge svg{width:12px;height:12px;flex-shrink:0;}
  .trustbadge.instant{ color:var(--gold-deep); background:rgba(227,162,59,0.18); }
  .responsetime{
    display:flex; align-items:center; gap:6px; font-size:12px; color:var(--ink-soft);
    margin:8px 0 2px;
  }
  .responsetime svg{width:13px;height:13px;flex-shrink:0;color:var(--moss-deep);}

  /* ---------- stay updates ---------- */
  .stayupdate{
    display:flex; gap:12px; background:var(--paper); border:1px solid var(--line);
    border-radius:16px; padding:10px; margin-bottom:10px;
  }
  .su-img{width:64px;height:64px;border-radius:12px;flex-shrink:0; background-size:cover; background-position:center;}
  .su-body{flex:1; min-width:0;}
  .su-body p{font-size:13px; margin:0 0 4px; line-height:1.4;}
  .su-body span{font-size:11px; color:var(--ink-soft);}

  /* ---------- star picker (reviews) ---------- */
  .starpicker{display:flex; gap:6px;}
  .starpicker span{width:26px;height:26px; display:flex; align-items:center; justify-content:center; color:var(--line); cursor:pointer;}
  .starpicker span svg{width:22px;height:22px;}
  .starpicker span.filled{color:var(--gold);}

  /* ---------- SOS ---------- */
  .sos-btn{ border-color:var(--stamp) !important; color:var(--stamp) !important; display:flex; align-items:center; gap:8px; justify-content:center; }
  .sos-btn svg{width:16px;height:16px;}
  .sos-banner{
    background:rgba(193,68,46,0.1); border:1.5px solid rgba(193,68,46,0.3); border-radius:16px;
    padding:14px; display:flex; gap:10px; align-items:flex-start; margin-bottom:18px; color:var(--stamp);
  }
  .sos-banner svg{width:20px;height:20px;flex-shrink:0;margin-top:1px;}
  .sos-banner p{margin:0; font-size:12.5px; line-height:1.5; color:var(--ink);}
  .sos-option{
    display:flex; align-items:center; gap:12px; background:var(--paper); border:1px solid var(--line);
    border-radius:16px; padding:14px; margin-bottom:10px; cursor:pointer;
  }
  .sos-option .soicon{width:38px;height:38px;border-radius:11px; background:rgba(193,68,46,0.12); color:var(--stamp); display:flex; align-items:center; justify-content:center; flex-shrink:0;}
  .sos-option b{display:block; font-size:13.5px;}
  .sos-option span{font-size:11.5px; color:var(--ink-soft);}

  .stickybar{
    position:sticky; bottom:0; background:linear-gradient(0deg, var(--canvas) 60%, rgba(241,239,226,0));
    padding:18px 0 6px; display:flex; align-items:center; gap:12px;
  }
  .stickybar .pricebox{flex-shrink:0;}
  .stickybar .pricebox b{font-family:'IBM Plex Mono',monospace; font-size:17px;}
  .stickybar .pricebox span{display:block; font-size:11px; color:var(--ink-soft);}

  /* ---------- form ---------- */
  .field{ margin-bottom:14px; }
  .field label{ font-size:12px; font-weight:600; color:var(--ink-soft); display:block; margin-bottom:6px; text-transform:uppercase; letter-spacing:.05em;}
  .field input, .field select, .field textarea{
    width:100%; border:1.5px solid var(--line); border-radius:12px; padding:12px 13px;
    font-family:'Inter',sans-serif; font-size:14px; color:var(--ink); background:var(--paper);
    outline:none;
  }
  .field textarea{resize:vertical; min-height:70px;}
  .field-row{display:flex; gap:10px;}
  .field-row .field{flex:1;}

  /* ---------- ticket / pawcation pass ---------- */
  .ticket{
    background:var(--paper);
    border-radius:22px;
    position:relative;

  /* ---------- credit card visual: true 3D flip ---------- */
  .cc-perspective{ position:relative; margin-bottom:20px; perspective:1400px; }
  .cc-flipper{
    position:relative; width:100%; aspect-ratio:1.586/1;
    transform-style:preserve-3d; -webkit-transform-style:preserve-3d;
    transform:rotateY(0deg);
    transition:transform .8s cubic-bezier(.45,.05,.15,1);
    border-radius:20px;
  }
  .cc-flipper.flipped{ transform:rotateY(180deg); }

  .cc-face{
    position:absolute; inset:0; border-radius:20px;
    backface-visibility:hidden; -webkit-backface-visibility:hidden;
    overflow:hidden; color:#F1EFE2;
    box-shadow:0 10px 20px -10px rgba(20,32,24,0.28);
    /* extra safety net: force the hidden face fully transparent exactly at the edge-on
       midpoint, so no browser can let the "wrong" face ghost/bleed through */
    transition:opacity 0s linear .4s;
  }
  .cc-flipper:not(.flipped) .cc-back{ opacity:0; }
  .cc-flipper.flipped .cc-front{ opacity:0; }
  .cc-front{
    background: linear-gradient(135deg, #1E3A2B 0%, #2C4A36 55%, #3E5C45 100%);
    padding:20px 22px; display:flex; flex-direction:column; justify-content:space-between;
  }
  .cc-front::after{
    content:''; position:absolute; width:200px; height:200px; border-radius:50%;
    background:radial-gradient(circle, rgba(227,162,59,0.25), transparent 70%);
    top:-80px; right:-60px;
  }
  .cc-back{
    background: linear-gradient(135deg, #2C4A36 0%, #1E3A2B 100%);
    transform:rotateY(180deg);
    display:flex; flex-direction:column;
  }
  /* a genuine, physically-positioned right-hand edge — hinges with the card in real 3D
     space, so it naturally comes into view exactly when the card is edge-on, giving it
     real thickness instead of vanishing to a flat line. Solid (no transparency) so
     nothing behind it can show through, and inset slightly with a small radius of its
     own so it doesn't create a seam against the face's much larger corner radius. */
  .cc-edge{
    position:absolute; top:3px; right:0; width:8px; height:calc(100% - 6px);
    background:linear-gradient(90deg, #0C130E 0%, #4C6A53 45%, #0C130E 100%);
    transform-origin:right center;
    transform:rotateY(90deg);
    border-radius:3px;
    backface-visibility:hidden; -webkit-backface-visibility:hidden;
  }
  .cc-stripe{ width:100%; height:38px; background:#14201A; margin-top:20px; }
  .cc-sigrow{ display:flex; align-items:center; gap:10px; margin:18px 20px 0; }
  .cc-sigline{
    flex:1; height:34px; border-radius:4px;
    background:repeating-linear-gradient(45deg, #E9E5D6, #E9E5D6 3px, #DDD8C4 3px, #DDD8C4 6px);
  }
  .cc-cvvbox{
    background:#F1EFE2; color:#1E3A2B; border-radius:4px;
    padding:8px 12px; font-family:'IBM Plex Mono',monospace; font-style:italic; font-weight:600; font-size:13px;
    min-width:44px; text-align:center;
  }
  .cc-backbottom{
    display:flex; align-items:center; gap:8px; margin:14px 20px 0;
    font-size:9.5px; text-transform:uppercase; letter-spacing:.06em; opacity:.8;
  }
  .cc-backbottom b{ font-family:'IBM Plex Mono',monospace; font-size:13px; text-transform:none; letter-spacing:.03em; opacity:1;}

  .cc-top{ display:flex; justify-content:space-between; align-items:flex-start; z-index:1; }
  .cc-chip{ width:38px; height:28px; border-radius:6px; background:linear-gradient(135deg,#E3A23B,#C67F1E); }
  .cc-scheme{
    font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:11.5px;
    letter-spacing:.06em; text-transform:uppercase;
    border-radius:6px; padding:4px 9px;

  }

  }
  .cc-bankline .spinner{

    border-top-color:#F1EFE2; animation:spin .7s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .cc-number{
    font-family:'IBM Plex Mono',monospace; font-size:19px; font-weight:600; letter-spacing:.12em; z-index:1;
    text-shadow: 0 1px 1px rgba(0,0,0,0.5), 0 -1px 0 rgba(255,255,255,0.15);
  }
  .cc-bottom{ display:flex; justify-content:space-between; align-items:flex-end; z-index:1; }
  .cc-bottom div span{ display:block; font-size:8.5px; opacity:.7; text-transform:uppercase; letter-spacing:.08em; margin-bottom:2px;}
  .cc-bottom div b{ font-family:'IBM Plex Mono',monospace; font-size:12.5px; font-weight:500; }


  .savedcard{

    padding:14px; margin-bottom:10px;

    display:flex; align-items:center; justify-content:center; color:var(--gold);

  /* ---------- pet grid ---------- */
  .petgrid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:14px; }
  @media (min-width:760px){
    .petgrid{ grid-template-columns:repeat(auto-fill, minmax(180px,1fr)); }

    background:var(--paper); border:1px solid var(--line); border-radius:18px; overflow:hidden; cursor:pointer;
  }

  /* ---------- loading screen ---------- */
  .loader{
    position:fixed; inset:0; z-index:1000;
    background: linear-gradient(180deg,#1E3A2B, #16291D);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:26px;
    transition: opacity .5s ease, visibility .5s ease;
  }
  .loader.hide{ opacity:0; visibility:hidden; pointer-events:none; }
  .loader-brand{
    display:flex; align-items:center; gap:10px;
    font-family:'Fraunces',serif; font-weight:700; font-size:22px; color:var(--canvas);
  }
  .loader-brand .mk{
    width:38px; height:38px; border-radius:11px; background:var(--gold);
    display:flex; align-items:center; justify-content:center; color:var(--ink);
  }
  .pawtrack{
    position:relative;
    width:210px; height:64px;
  }
  .pawstep{
    position:absolute; top:50%; left:0;
    width:26px; height:26px;
    color:var(--gold);
    opacity:0;
    transform: translate(0,-50%) scale(.4);
    animation: pawpop 1.8s ease-in-out infinite;
  }
  .pawstep svg{ width:100%; height:100%; display:block; }
  .pawstep:nth-child(odd){ top:38%; }
  .pawstep:nth-child(even){ top:62%; }
  .pawstep:nth-child(1){ left:0%;  animation-delay:0.00s; }
  .pawstep:nth-child(2){ left:16%; animation-delay:0.18s; }
  .pawstep:nth-child(3){ left:32%; animation-delay:0.36s; }
  .pawstep:nth-child(4){ left:48%; animation-delay:0.54s; }
  .pawstep:nth-child(5){ left:64%; animation-delay:0.72s; }
  .pawstep:nth-child(6){ left:80%; animation-delay:0.90s; }
  @keyframes pawpop{
    0%{   opacity:0;   transform:translate(0,-50%) scale(.4) rotate(-8deg); }
    18%{  opacity:1;   transform:translate(0,-50%) scale(1)  rotate(0deg); }
    55%{  opacity:1;   transform:translate(0,-50%) scale(1)  rotate(0deg); }
    80%{  opacity:0;   transform:translate(0,-50%) scale(.85) rotate(4deg); }
    100%{ opacity:0; }
  }
  .loader-tag{
    font-family:'Inter',sans-serif; font-size:12.5px; color:rgba(241,239,226,0.65);
    letter-spacing:.02em;
  }


  /* ---------- motion & micro-interactions (visual design above is unchanged) ---------- */
  :root{
    --dur-fast:150ms;
    --dur:200ms;
    --dur-slow:300ms;
    --ease-out:cubic-bezier(.2,.8,.2,1);
    --ease-soft:cubic-bezier(.34,1.56,.64,1);
    --shadow-press:0 4px 10px -8px rgba(30,58,43,0.35);
  }

  .card, .roleoption, .policyhub-row, .profile-row, .doc-row, .sos-option, .session-row, .petcard, .ticket, .backbtn, .sendbtn{
    transition:transform var(--dur) var(--ease-out), box-shadow var(--dur) var(--ease-out), border-color var(--dur) var(--ease-out), background-color var(--dur) var(--ease-out);
  }

  .btn, .btn-primary, .btn-ghost{
    transition:background-color var(--dur) var(--ease-out), border-color var(--dur) var(--ease-out), box-shadow var(--dur) var(--ease-out), transform var(--dur-fast) var(--ease-out), opacity var(--dur) var(--ease-out);
  }
  .btn:not(:disabled):active, .tourbtn:active{ transform:translateY(1px); }
  .btn:disabled{ transform:none; }

  .modeswitch button{
    transition:background-color var(--dur) var(--ease-out), color var(--dur) var(--ease-out), box-shadow var(--dur) var(--ease-out);
  }
  .chip, .langpill{
    transition:background-color var(--dur) var(--ease-out), border-color var(--dur) var(--ease-out), color var(--dur) var(--ease-out);
  }
  .tourdot{ cursor:pointer; transition:transform var(--dur) var(--ease-soft), background-color var(--dur) var(--ease-out); }
  .navitem{ transition:color var(--dur) var(--ease-out); }

  .searchbar{ transition:border-color var(--dur) var(--ease-out), box-shadow var(--dur) var(--ease-out); }
  .searchbar:focus-within{ border-color:var(--moss); box-shadow:0 0 0 4px rgba(110,143,114,0.16); }
  .field input, .field select, .field textarea, .chat-inputbar input{
    transition:border-color var(--dur) var(--ease-out), box-shadow var(--dur) var(--ease-out);
  }
  .field input:focus, .field select:focus, .field textarea:focus, .chat-inputbar input:focus{
    border-color:var(--moss); box-shadow:0 0 0 4px rgba(110,143,114,0.16);
  }

  .consent-row{ transition:border-color var(--dur) var(--ease-out), background-color var(--dur) var(--ease-out); }
  .consent-box{ transition:background-color var(--dur-fast) var(--ease-out), border-color var(--dur-fast) var(--ease-out), transform var(--dur) var(--ease-soft); }

  .upload-tile, .addpet-tile{ transition:border-color var(--dur) var(--ease-out), background-color var(--dur) var(--ease-out); }

  .heart-btn, .starpicker span, .cal-cell.editable{
    transition:transform var(--dur) var(--ease-soft), color var(--dur) var(--ease-out), background-color var(--dur) var(--ease-out);
  }
  .msgrow[data-action]{ transition:transform var(--dur) var(--ease-out); }

  .toast{ transition:opacity var(--dur-slow) var(--ease-out), transform var(--dur-slow) var(--ease-soft); }

  .fade-in{ animation:fadein var(--dur-slow) var(--ease-out); }

/* ============ AVAILABILITY CALENDAR (fixed demo month: July 2026) ============ */
const CAL_MONTH = { year:2026, month:6, label:'July 2026' };
function renderMiniCalendar(blockedDates, editable){
  const year = CAL_MONTH.year, month = CAL_MONTH.month;
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const firstDow = new Date(year, month, 1).getDay();
  const cells = [];
  for(let i=0;i<firstDow;i++) cells.push('<div class="cal-cell empty"></div>');
  for(let d=1; d<=daysInMonth; d++){
    const iso = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const blocked = blockedDates.includes(iso);
    cells.push(`<div class="cal-cell ${blocked?'blocked':'open'} ${editable?'editable':''}" ${editable?`data-action="toggle-avail-${iso}"`:''}>${d}</div>`);
  }
  return `
    <div class="cal-grid-head">${['S','M','T','W','T','F','S'].map(d=>`<div>${d}</div>`).join('')}</div>
    <div class="cal-grid">${cells.join('')}</div>
    <div class="cal-legend"><span><i class="caldot open"></i>Available</span><span><i class="caldot blocked"></i>Not available</span></div>
  `;
}
function isRangeBlocked(s, checkIn, checkOut){
  if(!s.blockedDates || !s.blockedDates.length) return false;
  let d = new Date(checkIn+'T00:00:00');
  const end = new Date(checkOut+'T00:00:00');
  while(d < end){
    const iso = d.toISOString().slice(0,10);
    if(s.blockedDates.includes(iso)) return true;
    d.setDate(d.getDate()+1);
  }
  return false;
}

function formatResponseTime(minutes){
  const tr = state.lang==='tr';
  if(minutes < 60) return tr ? `${minutes} dakika` : `${minutes} minutes`;
  const hours = Math.round(minutes/60);
  if(hours < 24) return tr ? `${hours} saat` : (hours===1 ? '1 hour' : `${hours} hours`);
  return tr ? '1 gün' : '1 day';
}

  const showBack = ['detail','request','requestDetail','trainingDetail','ticket','verify','payment','mypets','addpet','policy','policyhub','documents','trainercv','notifications','rewards','bookingDetail','sos','leaveReview','chatThread','availability','favorites','cancelBooking','reschedule','tour'].includes(state.screen);

function renderTrustBadges(s, compact){
  const badges = [];
  if(s.instantBook) badges.push({icon:ICON.bolt, label:'Instant Book', cls:'instant'});
  if(s.verified) badges.push({icon:ICON.shield, label:'ID verified'});
  badges.push({icon:ICON.check.replace('26','12').replace('26','12'), label:`${s.reviews}+ stays`});
  if(s.backgroundCheck) badges.push({icon:ICON.idcard, label:'Background checked'});
  const shown = compact ? badges.slice(0,1) : badges;
  return `<div class="trustbadges">${shown.map(b=>`<span class="trustbadge ${b.cls||''}">${b.icon}${b.label}</span>`).join('')}</div>`;
}

function screenRequestForm(){
  const s = SITTERS.find(x=>x.id===state.selectedId);
  const fIn = document.getElementById('f-in') ? document.getElementById('f-in').value : '2026-07-10';
  const fOut = document.getElementById('f-out') ? document.getElementById('f-out').value : '2026-07-14';
  const nights = computeNights(fIn||'2026-07-10', fOut||'2026-07-14');
  const perNight = parsePrice(s.price);
  const protectFee = 99;
  const subtotal = nights*perNight;
  const total = subtotal + (state.form.protect ? protectFee : 0);
  return `
  <div class="fade-in narrow">
    <h2 class="title">Tell ${s.name.split(' ')[0]} about your pet</h2>
    <p class="subtitle">${s.instantBook ? `${s.name.split(' ')[0]} accepts Instant Book — your pawcation is confirmed right away, no waiting for approval.` : `This goes straight to ${s.name.split(' ')[0]} as a booking request — nothing is confirmed until they accept.`}</p>
    <div class="field-row">
      <div class="field"><label>Pet's name</label><input id="f-petname" placeholder="e.g. Luna" value="Luna"/></div>
      <div class="field"><label>Pet type</label><select id="f-pettype"><option>Dog</option><option>Cat</option><option>Small pet</option><option>Bird</option></select></div>
    </div>
    <div class="field-row">
      <div class="field"><label>Check-in</label><input id="f-in" type="date" value="2026-07-10"/></div>
      <div class="field"><label>Check-out</label><input id="f-out" type="date" value="2026-07-14"/></div>
    </div>
    ${isRangeBlocked(s, fIn||'2026-07-10', fOut||'2026-07-14') ? `<p style="color:var(--stamp);font-size:12px;margin:-8px 0 14px;">${s.name.split(' ')[0]} isn't available for some of these dates — check the calendar on their profile.</p>` : ''}
    <div class="field"><label>Anything ${s.name.split(' ')[0]} should know</label><textarea id="f-notes" placeholder="Feeding schedule, medication, temperament…">Very friendly, needs a short walk morning and evening.</textarea></div>
    <div class="section-label">Add-ons</div>
    <div class="consent-row addon-row ${state.form.protect ? 'checked' : ''}" data-action="toggle-protect">
      <div class="consent-box">${state.form.protect ? ICON.check.replace('26','14').replace('26','14') : ''}</div>
      <p><b>Pawcation Protect</b> — ₺${protectFee} flat. Covers accidental damage at the sitter's home and adds 24/7 priority support for this stay.</p>
    </div>
    <div class="pricebox-summary">
      <div class="pb-row"><span>${nights} night${nights>1?'s':''} × ${s.price}</span><b>₺${subtotal.toLocaleString('tr-TR')}</b></div>
      ${state.form.protect ? `<div class="pb-row"><span>Pawcation Protect</span><b>₺${protectFee}</b></div>` : ''}
      <div class="pb-row total"><span>Total</span><b>₺${total.toLocaleString('tr-TR')}</b></div>
    </div>
    <div class="section-label">Before you send</div>
    <div class="consent-row ${state.consent.petHealth ? 'checked' : ''}" data-action="toggle-consent-petHealth">
      <div class="consent-box">${state.consent.petHealth ? ICON.check.replace('26','14').replace('26','14') : ''}</div>
      <p>I confirm my pet has no history of aggression toward people or other animals, and is current on core vaccinations. <a data-action="open-policy-health-request">Read full declaration</a></p>
    </div>
    <div class="consent-row ${state.consent.vetConsent ? 'checked' : ''}" data-action="toggle-consent-vetConsent">
      <div class="consent-box">${state.consent.vetConsent ? ICON.check.replace('26','14').replace('26','14') : ''}</div>
      <p>If I'm unreachable in an emergency, I authorize the sitter to seek veterinary care on my behalf, up to ₺2,000 — to be reimbursed by me afterward. <a data-action="open-policy-vetconsent-request">Read full consent</a></p>
    </div>
    <button class="btn btn-primary" data-action="confirm-request-${s.id}" ${(!state.consent.petHealth||!state.consent.vetConsent) ? 'disabled' : ''}>${s.instantBook ? 'Book instantly' : 'Send request'}</button>
  </div>`;
}

    ${state.bookings.length===0 ? screenEmptyBookings() : state.bookings.slice().reverse().map(b=>renderTicketCard(b)).join('')}
  </div>`;
}

function renderStarLine(n){
  return `<span style="color:var(--gold);letter-spacing:1px;">${'★'.repeat(n)}${'☆'.repeat(5-n)}</span>`;
}

function renderReviewCard(r){
  return `
  <div class="reviewcard">
    <div class="rh">${renderStarLine(r.overall)}<span style="color:var(--ink-soft);font-weight:400">Just now</span></div>
    <p>${r.text || 'No written comment.'}</p>
    <div class="tagrow" style="margin-top:8px;">
      <span class="tag">Cleanliness ${r.cleanliness}★</span>
      <span class="tag">Communication ${r.communication}★</span>
      <span class="tag">Punctuality ${r.punctuality}★</span>
    </div>
  </div>`;
}

function renderReviewSection(b){
  const isHostView = state.mode!=='owner';
  if(isHostView){
    if(b.review){
      return `
      <div class="section-label">Owner's review</div>
      ${renderReviewCard(b.review)}
      `;
    }
    if(b.trainerBooking){
      return `
      <div class="section-label">Review</div>
      <p class="subtitle" style="margin-top:-6px;">No review yet — this is a mock, so you can simulate the owner leaving one.</p>
      <button class="btn btn-ghost" data-action="simulate-trainer-review-${b.id}">Simulate: ask ${(b.ownerName||'owner').split(' ')[0]} to review</button>
      `;
    }
    return `
      <div class="section-label">Review</div>
      <p class="subtitle" style="margin-top:-6px;">The owner hasn't left a review yet.</p>
    `;
  }
  if(b.review){
    return `<div class="section-label">Your review</div>${renderReviewCard(b.review)}`;
  }
  if(!b.sitterId) return '';
  return `
    <div class="section-label">How did it go?</div>
    <button class="btn btn-primary" data-action="nav2-review-${b.id}">Leave a review</button>
  `;
}

function screenBookingDetail(){
  const b = state.bookings.find(x=>x.id===state.selectedId);
  if(!b) return screenBookings();
  const isHost = state.mode==='sitter' || state.mode==='trainer';
  return `
  <div class="fade-in narrow">
    ${renderTicketCard(b, false)}
    ${b.status==='cancelled' ? `
      <div class="sos-banner" style="margin-top:16px;">${ICON.alert}<p>This pawcation was cancelled${b.cancelReason ? ': '+b.cancelReason : '.'}</p></div>
    ` : ''}
    <div style="display:flex;gap:10px;margin:16px 0 6px;">
      ${b.status==='confirmed' ? `<button class="btn btn-ghost sos-btn" data-action="open-sos-${b.id}">${ICON.alert}SOS</button>` : ''}
      ${b.status==='confirmed' && isHost ? `<button class="btn btn-primary" data-action="complete-booking-${b.id}" style="flex:1;">Mark stay as completed</button>` : ''}
    </div>
    ${(b.status==='pending' || b.status==='confirmed') ? `
      <div style="display:flex;gap:10px;margin-bottom:16px;">
        <button class="btn btn-ghost" style="flex:1;color:var(--stamp);border-color:var(--stamp);" data-action="open-cancel-${b.id}">Cancel pawcation</button>
        ${b.status==='confirmed' ? `<button class="btn btn-ghost" style="flex:1;" data-action="open-reschedule-${b.id}">Reschedule</button>` : ''}
      </div>
    ` : ''}
    ${b.sessions ? `
      <div class="section-label">Session schedule${b.goal ? ' — '+b.goal : ''}</div>
      ${b.sessions.map((s,i)=>`
        <div class="session-row ${s.done?'done':''}" ${b.status!=='cancelled' ? `data-action="toggle-session-${b.id}-${i}"` : ''}>
          <div class="session-num">${i+1}</div>
          <div class="session-body"><b>${s.date}</b><span>${s.time}</span></div>
          <div class="session-check">${s.done ? ICON.check.replace('26','13').replace('26','13') : ''}</div>
        </div>
      `).join('')}
    ` : ''}
    <div class="section-label">Stay updates</div>
    ${b.updates.length===0 ? `<p class="subtitle" style="margin-top:-6px;">${isHost ? "Post a photo so the owner can see how things are going." : "No updates yet — your sitter or trainer will post photos here during the stay."}</p>` : ''}
    ${b.updates.slice().reverse().map(u=>`
      <div class="stayupdate">
        <div class="su-img" style="background-image:url('${u.photo}')"></div>
        <div class="su-body"><p>${u.note}</p><span>${u.when}</span></div>
      </div>
    `).join('')}
    ${isHost && b.status==='confirmed' ? `
      <div class="section-label">Post an update</div>
      <div class="upload-tile" style="margin-bottom:10px;" data-upload="stayUpdatePhoto">
        <div style="color:var(--ink-soft)">${ICON.camera}</div><div class="uplabel-empty">Add a photo</div>
        <input type="file" accept="image/*" data-upload-input="stayUpdatePhoto"/>
      </div>
      <div class="field"><textarea id="su-note" placeholder="What's happening right now?"></textarea></div>
      <button class="btn btn-ghost" data-action="post-update-${b.id}">Post update</button>
    ` : ''}
    ${b.status==='completed' ? renderReviewSection(b) : ''}
  </div>`;
}

function screenSOS(){
  const b = state.bookings.find(x=>x.id===state.selectedId);
  return `
  <div class="fade-in narrow">
    <h2 class="title">Emergency</h2>
    <div class="sos-banner">${ICON.alert}<p>This is a mock emergency panel. In a live version these would reach the other side and Pawcation support in real time.</p></div>
    <div class="sos-option" data-action="sos-call">
      <div class="soicon">${ICON.phone}</div>

    </div>
    <div class="sos-option" data-action="sos-support">
      <div class="soicon">${ICON.shield}</div>
      <div><b>Alert Pawcation support</b><span>A team member is notified immediately</span></div>
    </div>
    <div class="sos-option" data-action="sos-vet">
      <div class="soicon">${ICON.cert}</div>
      <div><b>Find nearest emergency vet</b><span>Uses the vet-care authorization from your booking</span></div>
    </div>

}

function screenCancelBooking(){

  return `

    <h2 class="title">Cancel this pawcation?</h2>

function screenReschedule(){

  return `
  <div class="fade-in narrow">
    <h2 class="title">Reschedule</h2>

    ${renderTicketCard(b, false)}

    </div>

  </div>`;

function screenLeaveReview(){
  const b = state.bookings.find(x=>x.id===state.selectedId);
  if(!b) return screenBookings();
  if(!state.reviewDraft) state.reviewDraft = { overall:5, cleanliness:5, communication:5, punctuality:5, text:'' };
  const draft = state.reviewDraft;
  const starRow = (key,label) => `
    <div class="field">
      <label>${label}</label>
      <div class="starpicker">
        ${[1,2,3,4,5].map(n=>`<span class="${draft[key]>=n?'filled':''}" data-action="set-review-${key}-${n}">${ICON.star}</span>`).join('')}
      </div>
    </div>`;
  return `
  <div class="fade-in narrow">
    <h2 class="title">Rate ${b.hostName}</h2>
    <p class="subtitle">Your feedback helps other owners choose a trustworthy sitter.</p>
    ${starRow('overall','Overall')}
    ${starRow('cleanliness','Cleanliness')}
    ${starRow('communication','Communication')}
    ${starRow('punctuality','Punctuality')}
    <div class="field"><label>Anything you'd like to add</label><textarea id="review-text" placeholder="How was the stay?">${draft.text}</textarea></div>
    <button class="btn btn-primary" data-action="submit-review-${b.id}">Submit review</button>
  </div>`;
}

function screenMessages(){
  const prefix = state.mode==='owner' ? 'owner-' : state.mode==='sitter' ? 'sitter-' : 'trainer-';
  const ids = Object.keys(state.chats).filter(id=>id.startsWith(prefix));
  return `
  <div class="fade-in narrow">
    <h2 class="title">${t('title_messages')}</h2>
    <p class="subtitle">Conversations tied to your requests and bookings.</p>
    ${ids.length===0 ? `
      <div class="emptystate">
        <div class="ico">${ICON.chat}</div>
        <h3>No conversations yet</h3>
        <p>Messages tied to your requests will show up here.</p>
      </div>` : ids.map(id=>{
        const t = state.chats[id];
        const last = t.messages[t.messages.length-1];
        return `
      <div class="msgrow" data-action="open-chat-${id}">
        <div class="avatar" style="background-image:url('${t.img}')"></div>
        <div class="mbody">
          <div class="mtop"><b>${t.name}</b><span>${last.when}</span></div>
          <p>${last.from==='me' ? 'You: ' : ''}${last.text}</p>
        </div>
        ${t.unread ? '<div class="unreaddot"></div>' : ''}
      </div>
    `;}).join('')}
  </div>`;
}

function screenChatThread(){
  const id = state.selectedId;
  const t = state.chats[id];
  if(!t) return screenMessages();
  return `
  <div class="fade-in narrow" style="display:flex;flex-direction:column;min-height:calc(100% - 20px);">
    <div class="chat-header">
      <div class="avatar" style="background-image:url('${t.img}')"></div>
      <b>${t.name}</b>
    </div>
    <div class="chat-messages" id="chat-scroll">
      ${t.messages.map(m=>`<div class="chat-bubble ${m.from}"><p>${m.text}</p><span>${m.when}</span></div>`).join('')}
    </div>
    <div class="chat-inputbar">
      <input id="chat-input" placeholder="Type a message…"/>
      <button class="sendbtn" data-action="send-chat-${id}">${ICON.send}</button>
    </div>
  </div>`;
}

function screenProfile(){
  const isOwner = state.mode==='owner';

  const otherModes = ['owner','sitter','trainer'].filter(m=>m!==state.mode);
  const modeMeta = {
    owner:{icon:ICON.paw, label:t('mode_switch_owner')},

  <div class="fade-in narrow">

      <div class="avatar" style="background:var(--gold);display:flex;align-items:center;justify-content:center;color:#fff;font-family:'Fraunces',serif;font-weight:600;font-size:26px;">Y</div>
      <h2 style="display:flex;align-items:center;gap:6px;justify-content:center;">${t('profile_you')} ${state.verification.status==='verified' ? `<span class="trustbadge">${ICON.shield}Verified</span>` : ''}</h2>
      <p>${roleLabel} · Istanbul, Turkey</p>
    </div>
    <div class="profile-row" data-action="nav2-verify"><div class="left">${ICON.shield}<span>${t('profile_verification')}</span></div>
      <span style="display:flex;align-items:center;gap:8px;">
        <span class="statuspill ${state.verification.status}" style="margin:0;padding:3px 9px;font-size:10px;"><span class="dot"></span>${state.verification.status==='unverified' ? 'Not started' : state.verification.status==='pending' ? 'In review' : 'Verified'}</span>
        ${ICON.chevron}
      </span>
    </div>
    ${isTrainer
      ? `<div class="profile-row" data-action="nav2-trainercv"><div class="left">${ICON.cert}<span>${t('profile_trainercv')}</span></div>${state.trainerCV ? `<span style="color:var(--ink-soft);font-size:12px;">Complete</span>` : `<span style="color:var(--ink-soft);font-size:12px;">Not started</span>`}${ICON.chevron}</div>`
      : `<div class="profile-row" data-action="${isOwner ? 'nav2-mypets' : 'nav2-availability'}"><div class="left">${isOwner ? ICON.paw : ICON.calendar}<span>${isOwner ? t('profile_mypets') : t('profile_availability')}</span></div>${isOwner ? `<span style="color:var(--ink-soft);font-size:12px;">${state.myPets.length} added</span>` : `<span style="color:var(--ink-soft);font-size:12px;">${state.myBlockedDates.length} blocked</span>`}${ICON.chevron}</div>`}
    ${isOwner ? `<div class="profile-row" data-action="nav2-favorites"><div class="left">${ICON.heart}<span>${t('profile_favorites')}</span></div><span style="color:var(--ink-soft);font-size:12px;">${state.favorites.length} saved</span>${ICON.chevron}</div>` : ''}
    <div class="profile-row" data-action="nav2-payment"><div class="left">${ICON.cardicon}<span>${isOwner ? t('profile_payment') : t('profile_payout')}</span></div>${ICON.chevron}</div>
    <div class="profile-row" data-action="tap-bell"><div class="left">${ICON.bell}<span>${t('profile_notifications')}</span></div>${ICON.chevron}</div>
    <div class="profile-row" data-action="nav2-policyhub"><div class="left">${ICON.idcard}<span>${t('profile_legal')}</span></div>${ICON.chevron}</div>
    <div class="profile-row" data-action="nav2-documents"><div class="left">${ICON.filesheet}<span>${t('profile_documents')}</span></div>${ICON.chevron}</div>
    <div class="profile-row" data-action="nav2-rewards"><div class="left">${ICON.gift}<span>${t('profile_points')}</span></div><span style="color:var(--ink-soft);font-size:12px;">${state.loyaltyPoints} pts</span>${ICON.chevron}</div>
    <div class="profile-row" data-action="nav2-tour"><div class="left">${ICON.clock}<span>${t('profile_how_it_works')}</span></div>${ICON.chevron}</div>
    <div class="section-label">${t('profile_language')}</div>
    <div class="profile-row" style="cursor:default;">
      <div class="left"><span>🌐</span><span>${state.lang==='tr' ? 'Türkçe' : 'English'}</span></div>
      <span class="langswitch" style="margin:0;">
        <span class="langpill ${state.lang==='en'?'active':''}" data-action="set-lang-en">EN</span>
        <span class="langpill ${state.lang==='tr'?'active':''}" data-action="set-lang-tr">TR</span>
      </span>

    <div class="section-label">${t('profile_switch_role')}</div>
    ${otherModes.map(m=>`<div class="profile-row" data-action="mode-${m}"><div class="left">${modeMeta[m].icon}<span>${modeMeta[m].label}</span></div>${ICON.chevron}</div>`).join('')}
    <div class="profile-row" style="color:var(--stamp);"><div class="left" style="color:var(--stamp);">${ICON.logout}<span>${t('profile_logout')}</span></div></div>
  </div>`;

function renderPolicyBlock(block){
  if(block.h) return `<h3>${block.h}</h3>`;
  if(block.p) return `<p>${block.p}</p>`;
  if(block.li) return `<ul>${block.li.map(i=>`<li>${i}</li>`).join('')}</ul>`;
  if(block.table) return `<table class="policy-table"><tr><th>Durum</th><th>Sonuç</th></tr>${block.table.map(row=>`<tr><td>${row[0]}</td><td>${row[1]}</td></tr>`).join('')}</table>`;
  return '';
}

function screenPolicy(){
  const policy = POLICIES[state.activePolicy];
  if(!policy) return screenPolicyHub();
  return `
  <div class="fade-in narrow">
    <h2 class="title">${policy.title}</h2>
    ${policy.updated ? `<div class="policy-updated">${policy.updated}</div>` : '<div style="height:10px"></div>'}

    <button class="btn btn-ghost" data-action="back">Close</button>

function screenAvailability(){

    <div class="section-label">Take a selfie</div>
    <div class="upload-grid"><div class="full">${tile('selfie','Clear selfie')}</div></div>
    <div class="section-label">Government ID</div>
    <div class="upload-grid">
      ${tile('idFront','Front side')}
      ${tile('idBack','Back side')}
    </div>

  renderTopbar();
  renderBottomNav();
  let html = '';
  switch(state.screen){
    case 'tour': html = screenTour(); break;
    case 'onboard': html = screenOnboard(); break;
    case 'browse': html = state.mode==='owner' ? screenBrowseOwner() : state.mode==='sitter' ? screenBrowseSitter() : screenBrowseTrainer(); break;
    case 'detail': html = screenSitterDetail(); break;
    case 'request': html = screenRequestForm(); break;
    case 'requestDetail': html = screenRequestDetail(); break;
    case 'trainingDetail': html = screenTrainingDetail(); break;
    case 'ticket': html = screenTicket(); break;
    case 'bookings': html = screenBookings(); break;
    case 'messages': html = screenMessages(); break;
    case 'profile': html = screenProfile(); break;
    case 'verify': html = screenVerify(); break;
    case 'payment': html = screenPayment(); break;
    case 'mypets': html = screenMyPets(); break;
    case 'addpet': html = screenAddPet(); break;
    case 'policy': html = screenPolicy(); break;
    case 'policyhub': html = screenPolicyHub(); break;
    case 'documents': html = screenDocuments(); break;
    case 'trainercv': html = screenTrainerCV(); break;
    case 'notifications': html = screenNotifications(); break;
    case 'rewards': html = screenRewards(); break;
    case 'bookingDetail': html = screenBookingDetail(); break;
    case 'sos': html = screenSOS(); break;
    case 'leaveReview': html = screenLeaveReview(); break;
    case 'chatThread': html = screenChatThread(); break;
    case 'availability': html = screenAvailability(); break;
    case 'favorites': html = screenFavorites(); break;
    case 'cancelBooking': html = screenCancelBooking(); break;
    case 'reschedule': html = screenReschedule(); break;
    default: html = screenOnboard();
  }
  app.content.innerHTML = html;
}

/* ============ EVENTS ============ */
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-action]');
  if(!el) return;
  const action = el.dataset.action;

  if(action==='pick-owner'){ state.onboarded=true; state.mode='owner'; go('browse'); return; }
  if(action==='pick-sitter'){ state.onboarded=true; state.mode='sitter'; go('browse'); return; }
  if(action==='pick-trainer'){ state.onboarded=true; state.mode='trainer'; go('browse'); return; }
  if(action==='set-lang-en'){ setLang('en'); return; }
  if(action==='set-lang-tr'){ setLang('tr'); return; }
  if(action==='tour-skip'){ go('onboard'); return; }
  if(action==='tour-next'){
    if((state.tourStep||0) >= 3){ go('onboard'); }
    else { state.tourStep = (state.tourStep||0) + 1; render(); }
    return;
  }
  if(action && action.startsWith('tour-dot-')){ state.tourStep = parseInt(action.replace('tour-dot-','')); render(); return; }
  if(action==='nav2-tour'){ state.tourStep = 0; go('tour'); return; }
  if(action==='mode-owner'){ setMode('owner'); return; }
  if(action==='mode-sitter'){ setMode('sitter'); return; }
  if(action==='mode-trainer'){ setMode('trainer'); return; }
  if(action==='tap-bell'){ state.notifications.forEach(n=> n.read=true); go('notifications'); return; }
  if(action==='back'){
    if(state.screen==='detail' || state.screen==='requestDetail' || state.screen==='trainingDetail') go('browse');
    else if(state.screen==='request') go('detail', {selectedId:state.selectedId});
    else if(state.screen==='ticket') go('bookings');
    else if(state.screen==='addpet') go('mypets');
    else if(state.screen==='policy') go(state.policyReturnTo || 'policyhub');
    else if(state.screen==='policyhub') go('profile');
    else if(state.screen==='documents') go('profile');
    else if(state.screen==='bookingDetail') go('bookings');
    else if(state.screen==='sos') go('bookingDetail', {selectedId:state.selectedId});
    else if(state.screen==='leaveReview'){ state.reviewDraft=null; go('bookingDetail', {selectedId:state.selectedId}); }
    else if(state.screen==='cancelBooking' || state.screen==='reschedule') go('bookingDetail', {selectedId:state.selectedId});
    else if(state.screen==='chatThread') go('messages');
    else if(['verify','payment','mypets','trainercv','notifications','rewards','availability','favorites','tour'].includes(state.screen)) go('profile');
    else go('browse');
    return;
  }
  if(action.startsWith('open-policy-')){
    const rest = action.replace('open-policy-','').split('-');
    const returnTo = rest.pop();
    const key = rest.join('-');
    state.activePolicy = key;
    state.policyReturnTo = returnTo;
    go('policy');
    return;
  }
  if(action==='nav2-policyhub'){ go('policyhub'); return; }
  if(action==='nav2-documents'){ go('documents'); return; }
  if(action==='nav2-rewards'){ go('rewards'); return; }
  if(action.startsWith('redeem-reward-')){
    const id = action.replace('redeem-reward-','');
    const r = REWARDS.find(x=>x.id===id);
    if(!r || state.loyaltyPoints < r.cost){ toast('Not enough points yet'); return; }
    state.loyaltyPoints -= r.cost;
    state.redeemedRewards.push({ title:r.title, when:'Just now', code:'PWC-'+Math.random().toString(36).slice(2,7).toUpperCase() });
    toast(r.title+' redeemed!');
    render();
    return;
  }
  if(action==='nav2-availability'){ go('availability'); return; }
  if(action.startsWith('toggle-avail-')){
    const iso = action.replace('toggle-avail-','');
    const idx = state.myBlockedDates.indexOf(iso);
    if(idx>-1) state.myBlockedDates.splice(idx,1); else state.myBlockedDates.push(iso);
    render();
    return;
  }
  if(action==='nav2-favorites'){ go('favorites'); return; }
  if(action.startsWith('toggle-fav-')){
    const id = action.replace('toggle-fav-','');
    const idx = state.favorites.indexOf(id);
    if(idx>-1){ state.favorites.splice(idx,1); toast('Removed from favorites'); }
    else { state.favorites.push(id); toast('Added to favorites'); }
    render();
    return;
  }
  if(action.startsWith('open-chat-')){
    const id = action.replace('open-chat-','');
    if(state.chats[id]) state.chats[id].unread = false;
    go('chatThread', {selectedId:id});
    app.content.scrollTop = app.content.scrollHeight;
    return;
  }
  if(action.startsWith('send-chat-')){
    const id = action.replace('send-chat-','');
    const input = document.getElementById('chat-input');
    const text = input.value.trim();
    if(!text) return;
    const t = state.chats[id];
    t.messages.push({from:'me', text, when:'Just now'});
    go('chatThread', {selectedId:id});
    app.content.scrollTop = app.content.scrollHeight;
    setTimeout(()=>{
      if(state.screen==='chatThread' && state.selectedId===id){
        const replies = ["Got it, thank you!", "Sounds good 👍", "Will do — I'll keep you posted.", "Perfect, see you then!"];
        t.messages.push({from:'them', text: replies[Math.floor(Math.random()*replies.length)], when:'Just now'});
        render();
        app.content.scrollTop = app.content.scrollHeight;
      }
    }, 1300);
    return;
  }
  if(action.startsWith('open-cancel-')){ go('cancelBooking', {selectedId: action.replace('open-cancel-','')}); return; }
  if(action.startsWith('confirm-cancel-')){
    const id = action.replace('confirm-cancel-','');
    const b = state.bookings.find(x=>x.id===id);
    const reason = document.getElementById('cancel-reason').value;
    if(b){ b.status='cancelled'; b.cancelReason = reason; }
    toast('Pawcation cancelled');
    go('bookingDetail', {selectedId:id});
    return;
  }
  if(action.startsWith('open-reschedule-')){ go('reschedule', {selectedId: action.replace('open-reschedule-','')}); return; }
  if(action.startsWith('confirm-reschedule-')){
    const id = action.replace('confirm-reschedule-','');
    const b = state.bookings.find(x=>x.id===id);
    const newIn = document.getElementById('resch-in').value;
    const newOut = document.getElementById('resch-out').value;
    if(b){ b.checkIn = newIn; b.checkOut = newOut; b.status = 'pending'; }
    toast('New dates sent — waiting for confirmation');
    go('bookingDetail', {selectedId:id});
    return;
  }
  if(action.startsWith('nav-')){ go(action.replace('nav-','')); return; }
  if(action.startsWith('filter-')){ state.filter = action.replace('filter-',''); render(); return; }
  if(action.startsWith('open-sitter-')){ go('detail', {selectedId: action.replace('open-sitter-','')}); return; }
  if(action.startsWith('open-request-')){ go('requestDetail', {selectedId: action.replace('open-request-','')}); return; }
  if(action.startsWith('open-training-')){ go('trainingDetail', {selectedId: action.replace('open-training-','')}); return; }
  if(action.startsWith('request-stay-')){
    state.consent.petHealth = false;
    state.consent.vetConsent = false;
    state.form.protect = false;
    go('request', {selectedId: action.replace('request-stay-','')});
    return;
  }
  if(action==='toggle-protect'){ state.form.protect = !state.form.protect; render(); return; }

  if(action.startsWith('confirm-request-')){
    const id = action.replace('confirm-request-','');
    const s = SITTERS.find(x=>x.id===id);
    const petName = document.getElementById('f-petname').value || 'Your pet';
    const checkIn = document.getElementById('f-in').value || '2026-07-10';
    const checkOut = document.getElementById('f-out').value || '2026-07-14';
    if(isRangeBlocked(s, checkIn, checkOut)){
      toast(s.name.split(' ')[0]+" isn't available for some of those dates");
      return;
    }
    const nights = computeNights(checkIn, checkOut);
    const protect = state.form.protect;
    const protectFee = 99;
    const total = nights*parsePrice(s.price) + (protect ? protectFee : 0);
    const booking = {
      id: 'b'+Date.now(), status: s.instantBook ? 'confirmed' : 'pending',
      petName, hostName: s.name, loc: s.loc.split(',')[0],
      checkIn: fmtDate(checkIn), checkOut: fmtDate(checkOut),
      code: randCode(), sitterId: s.id, updates: [], review: null,
      protect, protectFee: protect ? protectFee : 0, total
    };
    state.bookings.push(booking);
    state.loyaltyPoints += 50;
    state.form.protect = false;
    toast((s.instantBook ? 'Confirmed with ' : 'Request sent to ')+s.name.split(' ')[0]+' · +50 points');
    go('ticket', {selectedId: booking.id});
    return;
  }

  if(action.startsWith('offer-sit-')){
    const id = action.replace('offer-sit-','');
    const r = REQUESTS.find(x=>x.id===id);
    const [checkIn, checkOut] = r.dates.split(' – ');
    const booking = {
      id: 'b'+Date.now(), status:'confirmed',
      petName: r.pet, hostName: 'You', loc: r.loc.split(',')[0],
      checkIn, checkOut, code: randCode(), updates: [], review: null
    };
    state.bookings.push(booking);
    toast('Offer sent to '+r.owner.split(' ')[0]);
    go('ticket', {selectedId: booking.id});
    return;
  }

  if(action.startsWith('offer-train-')){
    const id = action.replace('offer-train-','');
    const r = TRAINING_REQUESTS.find(x=>x.id===id);
    const sessionMatch = r.dates.match(/(\d+)\s*session/i);
    const sessionCount = sessionMatch ? parseInt(sessionMatch[1],10) : 4;
    const sessions = generateSessions(sessionCount, '2026-07-06');
    const booking = {
      id: 'b'+Date.now(), status:'confirmed',
      petName: r.pet, hostName: 'You', loc: r.loc.split(',')[0],
      checkIn: sessions[0].date, checkOut: sessions[sessions.length-1].date,
      code: randCode(), updates: [], review: null,
      trainerBooking: true, ownerName: r.owner, goal: r.goal, sessions
    };
    state.bookings.push(booking);
    toast('Offer sent to '+r.owner.split(' ')[0]);
    go('ticket', {selectedId: booking.id});
    return;
  }

  if(action.startsWith('open-booking-')){ go('bookingDetail', {selectedId: action.replace('open-booking-','')}); return; }
  if(action.startsWith('open-sos-')){ go('sos', {selectedId: action.replace('open-sos-','')}); return; }
  if(action==='sos-call'){ toast('Calling now… (mock)'); return; }
  if(action==='sos-support'){ toast('Pawcation support has been notified'); return; }
  if(action==='sos-vet'){ toast('Nearest emergency vets shown (mock)'); return; }

  if(action.startsWith('complete-booking-')){
    const id = action.replace('complete-booking-','');
    const b = state.bookings.find(x=>x.id===id);
    if(b){ b.status='completed'; toast('Marked as completed'); }
    go('bookingDetail', {selectedId:id});
    return;
  }

  if(action.startsWith('post-update-')){
    const id = action.replace('post-update-','');
    const b = state.bookings.find(x=>x.id===id);
    const note = document.getElementById('su-note').value;
    if(!pendingUploads.stayUpdatePhoto || !note){ toast('Add a photo and a short note'); return; }
    b.updates.push({ photo: pendingUploads.stayUpdatePhoto, note, when:'Just now' });
    delete pendingUploads.stayUpdatePhoto;
    toast('Update posted');
    go('bookingDetail', {selectedId:id});
    return;
  }

  if(action.startsWith('toggle-session-')){
    const rest = action.replace('toggle-session-','');
    const idx = parseInt(rest.slice(rest.lastIndexOf('-')+1),10);
    const bid = rest.slice(0, rest.lastIndexOf('-'));
    const b = state.bookings.find(x=>x.id===bid);
    if(b && b.sessions && b.sessions[idx]){ b.sessions[idx].done = !b.sessions[idx].done; render(); }
    return;
  }

  if(action.startsWith('simulate-trainer-review-')){
    const id = action.replace('simulate-trainer-review-','');
    const b = state.bookings.find(x=>x.id===id);
    if(!b) return;
    const pool = [
      { stars:5, text:"Incredible progress in just a few sessions — patient, clear, and really knows how to read the dog." },
      { stars:4, text:"Solid trainer, very consistent. Would've liked a bit more written follow-up between sessions." },
      { stars:5, text:"My dog's a different animal now. Highly recommend, worth every lira." },
    ];
    const pick = pool[Math.floor(Math.random()*pool.length)];
    const review = { overall:pick.stars, cleanliness:pick.stars, communication:pick.stars, punctuality:pick.stars, text:pick.text };
    b.review = review;
    TRAINER_REVIEWS.unshift({ name: b.ownerName || 'Owner', when:'Just now', text: pick.text, stars: pick.stars });
    toast((b.ownerName||'Owner').split(' ')[0]+' left a review!');
    go('bookingDetail', {selectedId:id});
    return;
  }

  if(action.startsWith('nav2-review-')){
    state.reviewDraft = { overall:5, cleanliness:5, communication:5, punctuality:5, text:'' };
    go('leaveReview', {selectedId: action.replace('nav2-review-','')});
    return;
  }
  if(action.startsWith('set-review-')){
    const rest = action.replace('set-review-','');
    const n = parseInt(rest.slice(rest.lastIndexOf('-')+1), 10);
    const key = rest.slice(0, rest.lastIndexOf('-'));
    if(!state.reviewDraft) state.reviewDraft = { overall:5, cleanliness:5, communication:5, punctuality:5, text:'' };
    state.reviewDraft[key] = n;
    render();
    return;
  }
  if(action.startsWith('submit-review-')){
    const id = action.replace('submit-review-','');
    const b = state.bookings.find(x=>x.id===id);
    const text = document.getElementById('review-text').value;
    const draft = state.reviewDraft || { overall:5, cleanliness:5, communication:5, punctuality:5, text:'' };
    const review = { ...draft, text };
    b.review = review;
    if(b.sitterId){ REVIEWS.unshift({ name:'You', when:'Just now', text: text || 'No written comment.', stars: review.overall, sitterId: b.sitterId }); }
    state.reviewDraft = null;
    toast('Review submitted — thank you!');
    go('bookingDetail', {selectedId:id});
    return;
  }

  if(action==='nav2-verify'){ go('verify'); return; }
  if(action==='nav2-trainercv'){
    if(!state.trainerCV) state.trainerCV_draft = { bio:'', animals:[] };
    go('trainercv');
    return;
  }
  if(action==='nav2-trainercv-edit'){
    state.trainerCV_draft = { ...state.trainerCV };
    state.trainerCV = null;
    go('trainercv');
    return;
  }
  if(action.startsWith('toggle-trainer-animal-')){
    const animal = action.replace('toggle-trainer-animal-','');
    if(!state.trainerCV_draft) state.trainerCV_draft = { bio:'', animals:[] };
    if(!state.trainerCV_draft.animals) state.trainerCV_draft.animals = [];
    const idx = state.trainerCV_draft.animals.indexOf(animal);
    if(idx>-1) state.trainerCV_draft.animals.splice(idx,1);
    else state.trainerCV_draft.animals.push(animal);
    render();
    return;
  }
  if(action==='save-trainer-cv'){
    const experience = document.getElementById('tr-experience').value || '0';
    const bio = document.getElementById('tr-bio').value;
    const certifications = document.getElementById('tr-certifications').value;
    const animals = (state.trainerCV_draft && state.trainerCV_draft.animals) || [];
    if(!bio || animals.length===0){ toast('Add a short bio and pick at least one animal type'); return; }
    state.trainerCV = { experience, bio, certifications, animals };
    state.trainerCV_draft = null;
    toast('Trainer CV saved');
    go('profile');
    return;
  }
  if(action.startsWith('toggle-consent-')){
    const key = action.replace('toggle-consent-','');
    state.consent[key] = !state.consent[key];
    render();
    return;
  }
  if(action==='nav2-mypets'){ go('mypets'); return; }
  if(action==='nav2-payment'){ go('payment'); return; }
  if(action==='nav2-addpet'){ go('addpet'); return; }
  if(action==='nav2-noop'){ return; }

  if(action==='submit-verification'){
    state.verification.status = 'pending';
    toast('Sent for review — usually done within 24h');
    go('profile');
    return;
  }

  if(action==='save-card'){
    const number = (document.getElementById('cc-number').value||'').replace(/\s+/g,'');
    const name = document.getElementById('cc-name').value || 'Card holder';
    const exp = document.getElementById('cc-exp').value || 'MM/YY';
    const cvv = document.getElementById('cc-cvv').value;
    if(number.length < 12 || !cvv){ toast('Check your card details'); return; }
    state.cards.push({
      brand: detectScheme(number) || 'Card',
      bankName: currentCardDetect.bankName || null,
      last4: number.slice(-4), expiry: exp, name
    });
    currentCardDetect = { scheme:null, bankName:null };
    toast('Card added');
    go('payment');
    return;
  }
  if(action && action.startsWith('remove-card-')){
    const i = parseInt(action.replace('remove-card-',''),10);
    state.cards.splice(i,1);
    render();
    return;
  }

  if(action==='save-payout'){
    const name = document.getElementById('po-name').value;
    const bank = document.getElementById('po-bank').value;
    const iban = (document.getElementById('po-iban').value||'').replace(/\s+/g,'');
    if(!name || !bank || iban.length < 6){ toast('Fill in all payout fields'); return; }
    state.payout = { holder:name, bankName:bank, ibanLast4: iban.slice(-4) };
    toast('Payout details saved');
    go('profile');
    return;
  }
  if(action==='remove-payout'){ state.payout = null; render(); return; }

  if(action==='save-pet'){
    const name = document.getElementById('pet-name').value;
    const type = document.getElementById('pet-type').value;
    const breed = document.getElementById('pet-breed').value;
    const age = document.getElementById('pet-age').value;
    const notes = document.getElementById('pet-notes').value;
    if(!name || !pendingUploads.newPetPhoto){ toast('Add a name and photo first'); return; }
    state.myPets.push({ name, type, breed, age, notes, photo: pendingUploads.newPetPhoto });
    delete pendingUploads.newPetPhoto;
    toast(name+' added to your pets');
    go('mypets');
    return;
  }
});

/* ---- file uploads (kept in-memory only, never sent anywhere) ---- */
const pendingUploads = {};
document.addEventListener('change', (e) => {
  if(e.target.id==='f-in' || e.target.id==='f-out'){ render(); return; }
  const input = e.target.closest('[data-upload-input]');
  if(!input || !input.files || !input.files[0]) return;
  const key = input.dataset.uploadInput;
  const reader = new FileReader();
  reader.onload = (ev) => {
    const dataUrl = ev.target.result;
    if(key === 'newPetPhoto' || key === 'stayUpdatePhoto'){
      pendingUploads[key] = dataUrl;
      const tile = input.closest('.upload-tile');
      tile.style.backgroundImage = `url('${dataUrl}')`;
      tile.classList.add('filled');
      tile.innerHTML = `<div class="checkmark">${ICON.check}</div><div class="uplabel">Photo added</div>` + tile.innerHTML;
    } else {
      state.verification[key] = dataUrl;
      render();
    }
  };
  reader.readAsDataURL(input.files[0]);
});

/* ---- live credit card preview: network detection (local) + bank detection (live BIN lookup) ---- */
let currentCardDetect = { scheme: null, bankName: null };
let binLookupTimer = null;
let binLookupToken = 0;

const SCHEME_PATTERNS = [
  { name: 'Troy',        test: n => /^9792/.test(n) },
  { name: 'Amex',        test: n => /^3[47]/.test(n) },
  { name: 'Diners Club', test: n => /^3(?:0[0-5]|[68])/.test(n) },
  { name: 'JCB',         test: n => /^35(?:2[89]|[3-8]\d)/.test(n) },
  { name: 'Discover',    test: n => /^(?:6011|65|64[4-9])/.test(n) },
  { name: 'Mastercard',  test: n => /^(?:5[1-5]|22[2-9]|2[3-6]\d|27[01]\d|2720)/.test(n) },
  { name: 'Visa',        test: n => /^4/.test(n) },
];
/* Brand badge styling — original color/abbreviation pairing, not a reproduction of any brand's official logo artwork */
const SCHEME_META = {
  'Visa':         { bg:'#2C5CE0', abbr:'VISA' },
  'Mastercard':   { bg:'#D9542F', abbr:'MC'   },
  'Amex':         { bg:'#2E7D74', abbr:'AMEX' },
  'Troy':         { bg:'#B8433A', abbr:'TROY' },
  'Discover':     { bg:'#CB7B1E', abbr:'DISC' },
  'Diners Club':  { bg:'#5B6B7A', abbr:'DIN'  },
  'JCB':          { bg:'#3D6B8C', abbr:'JCB'  },
};
function detectScheme(number){
  const hit = SCHEME_PATTERNS.find(p => p.test(number));
  return hit ? hit.name : null;
}

function setBankLine(html){
  const el = document.getElementById('cc-prev-bank');
  if(el) el.innerHTML = html;
}

function lookupBank(bin){
  const myToken = ++binLookupToken;
  setBankLine(`<span class="spinner"></span> Looking up issuing bank…`);
  fetch(`https://lookup.binlist.net/${bin}`, { headers: { 'Accept-Version': '3' } })
    .then(res => { if(!res.ok) throw new Error('not found'); return res.json(); })
    .then(data => {
      if(myToken !== binLookupToken) return; // a newer keystroke superseded this lookup
      const bankName = data.bank && data.bank.name ? data.bank.name : null;
      const country = data.country && data.country.emoji ? ' ' + data.country.emoji : '';
      currentCardDetect.bankName = bankName;
      setBankLine(bankName ? `${bankName}${country}` : 'Bank not identified');
    })
    .catch(() => {
      if(myToken !== binLookupToken) return;
      currentCardDetect.bankName = null;
      setBankLine('Bank not identified');
    });
}

document.addEventListener('input', (e) => {
  if(e.target.id==='cc-number'){
    let v = e.target.value.replace(/\D/g,'').slice(0,16);
    e.target.value = v.replace(/(.{4})/g,'$1 ').trim();
    const shown = v.padEnd(16,'•').replace(/(.{4})/g,'$1 ').trim();
    const numEl = document.getElementById('cc-prev-number');
    if(numEl) numEl.textContent = v.length ? shown.replace(/\d(?=\d{4})/g,'•') : '•••• •••• •••• ••••';

    const scheme = detectScheme(v);
    currentCardDetect.scheme = scheme;
    const schemeEl = document.getElementById('cc-prev-scheme');
    if(schemeEl){
      const meta = SCHEME_META[scheme];
      schemeEl.textContent = meta ? meta.abbr : 'CARD';
      schemeEl.style.background = meta ? meta.bg : 'rgba(241,239,226,0.16)';
    }

    clearTimeout(binLookupTimer);
    if(v.length >= 6){
      binLookupTimer = setTimeout(() => lookupBank(v.slice(0,8)), 450);
    } else {
      binLookupToken++; // cancel any in-flight lookup
      currentCardDetect.bankName = null;
      setBankLine('');
    }
  }
  if(e.target.id==='cc-name'){
    const el = document.getElementById('cc-prev-name');
    if(el) el.textContent = (e.target.value || 'YOUR NAME').toUpperCase();
  }
  if(e.target.id==='cc-exp'){
    let v = e.target.value.replace(/[^\d]/g,'').slice(0,4);
    if(v.length >= 3) v = v.slice(0,2)+'/'+v.slice(2);
    e.target.value = v;
    const el = document.getElementById('cc-prev-exp');
    if(el) el.textContent = v || 'MM/YY';
  }
  if(e.target.id==='cc-cvv'){
    let v = e.target.value.replace(/\D/g,'').slice(0,4);
    e.target.value = v;
    const el = document.getElementById('cc-prev-cvv');
    if(el) el.textContent = v || '•••';
  }
});
// Flip the card to its back (3D) while the CVV or expiry field has focus, front otherwise
function setCardFlip(toBack){
  const flipper = document.getElementById('cc-flipper');
  if(!flipper) return;
  flipper.classList.toggle('flipped', toBack);
}
document.addEventListener('focusin', (e) => {
  if(!document.getElementById('cc-flipper')) return;
  if(e.target.id==='cc-cvv' || e.target.id==='cc-exp'){
    setCardFlip(true);
  } else if(e.target.id==='cc-number' || e.target.id==='cc-name'){
    setCardFlip(false);
  }
});
function guessBrand(number){
  return detectScheme(number) || 'Card';
}

function fmtDate(iso){
  const d = new Date(iso+'T00:00:00');
  return d.toLocaleDateString('en-US',{month:'short', day:'numeric'});
}
function randCode(){
  return Math.random().toString(36).substring(2,6).toUpperCase() + '-' + Math.floor(1000+Math.random()*9000);
}
function parsePrice(str){
  return parseInt(String(str).replace(/[^\d]/g,''),10) || 0;
}
function computeNights(inStr,outStr){
  const d1 = new Date(inStr+'T00:00:00'), d2 = new Date(outStr+'T00:00:00');
  const diff = Math.round((d2-d1)/86400000);
  return diff>0 ? diff : 1;
}
function generateSessions(count, startISO){
  const sessions = [];
  const d = new Date(startISO+'T00:00:00');
  for(let i=0;i<count;i++){
    sessions.push({ date: d.toLocaleDateString('en-US',{month:'short', day:'numeric'}), time:'10:00 AM', done:false });
    d.setDate(d.getDate()+7);
  }
  return sessions;
}

render();

/* ============ SYNTHESIZED "WOOF" SOUND (no audio file — generated in-browser) ============ */
let barkPlayed = false;
function playBark(){
  try{
    const Ctx = window.AudioContext || window.webkitAudioContext;
    const ctx = new Ctx();
    const now = ctx.currentTime;
    function woof(startOffset, duration){
      const bufferSize = Math.floor(ctx.sampleRate * duration);
      const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
      const data = buffer.getChannelData(0);
      for(let i=0;i<bufferSize;i++){ data[i] = (Math.random()*2-1) * Math.pow(1 - i/bufferSize, 1.6); }
      const noise = ctx.createBufferSource();
      noise.buffer = buffer;
      const filter = ctx.createBiquadFilter();
      filter.type = 'bandpass';
      filter.Q.value = 0.8;
      filter.frequency.setValueAtTime(1000, now+startOffset);
      filter.frequency.exponentialRampToValueAtTime(200, now+startOffset+duration);
      const gain = ctx.createGain();
      gain.gain.setValueAtTime(0.0001, now+startOffset);
      gain.gain.exponentialRampToValueAtTime(0.85, now+startOffset+0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, now+startOffset+duration);
      noise.connect(filter); filter.connect(gain); gain.connect(ctx.destination);
      noise.start(now+startOffset);
      noise.stop(now+startOffset+duration+0.02);
    }
    woof(0, 0.16);
    woof(0.20, 0.13);
    barkPlayed = true;
  }catch(e){ /* Web Audio unavailable — fail silently */ }
}

/* ============ LOADING SCREEN ============ */
const loaderEl = document.getElementById('loader');
function hideLoader(){
  if(!loaderEl) return;
  loaderEl.classList.add('hide');
  setTimeout(() => loaderEl.remove(), 550);
}
// Don't wait on window 'load' (fonts/images) — on a slow connection that event can be
// delayed a long time or never fire cleanly, which would leave the loader stuck.
// The app itself doesn't depend on those resources, so we just run on a plain timer.
playBark(); // will silently fail if the browser blocks autoplay audio before any user gesture
setTimeout(hideLoader, 1900);
// Absolute safety net: no matter what happens above, never let the loader stay up more than 5s
setTimeout(hideLoader, 5000);
// Fallback: if autoplay was blocked, play the bark on the visitor's first tap/click anywhere
document.addEventListener('click', function firstGestureBark(){
  if(!barkPlayed) playBark();
}, { once:true });
</script>
