<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1E3A2B">
<title>Pawcation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1E3A2B;
    --ink-soft:#4A5F4F;
    --canvas:#F1EFE2;
    --paper:#FFFFFF;
    --line:#DAD5BF;
    --gold:#E3A23B;
    --gold-deep:#C67F1E;
    --moss:#6E8F72;
    --moss-deep:#4F7256;
    --stamp:#C1442E;
    --shadow: 0 18px 40px -18px rgba(30,58,43,0.35);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0; height:100%;}
  body{
    background:var(--canvas);
    font-family:'Inter',sans-serif;
    color:var(--ink);
    overflow:hidden;
  }

  /* ---------- app shell (fills the real page width) ---------- */
  .screen-wrap{
    width:100%;
    height:100dvh;
    background:var(--canvas);
    position:relative;
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }

  /* content that should stay a comfortable reading/form width even on a wide browser */
  .narrow{ max-width:640px; margin:0 auto; width:100%; }

  /* card lists: single column on phones, multi-column grid once there's room */
  .card-grid{ display:block; }
  @media (min-width:760px){
    .card-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(300px,1fr)); gap:16px; align-items:start; }
    .card-grid .card{ margin-bottom:0; }
  }

  /* ---------- top bar / mode switch ---------- */
  .topbar{
    padding:calc(env(safe-area-inset-top, 0px) + 16px) 20px 14px;
    flex-shrink:0;
  }
  .topbar-row{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    margin-bottom:12px;
  }
  .brand{
    display:flex; align-items:center; gap:8px;
    font-family:'Fraunces',serif; font-weight:700; font-size:19px;
  }
  .brand .mark{
    width:30px;height:30px;border-radius:9px;
    background:var(--ink);
    display:flex;align-items:center;justify-content:center;
    color:var(--gold);
  }
  .backbtn{
    width:34px;height:34px;border-radius:50%;
    background:var(--paper);
    display:flex;align-items:center;justify-content:center;
    border:1px solid var(--line);
    cursor:pointer;
    flex-shrink:0;
  }
  .modeswitch{
    display:flex;
    background:rgba(30,58,43,0.08);
    border-radius:999px;
    padding:3px;
    gap:2px;
  }
  .modeswitch button{
    border:none; background:transparent;
    font-family:'Inter',sans-serif; font-size:12.5px; font-weight:600;
    padding:8px 14px; border-radius:999px;
    color:var(--ink-soft);
    cursor:pointer;
    transition:.2s;
  }
  .modeswitch button.active{
    background:var(--ink); color:var(--canvas);
  }

  /* ---------- content area ---------- */
  .content{
    flex:1;
    overflow-y:auto;
    padding:0 20px 100px;
  }
  @media (min-width:900px){
    .content{ padding:0 40px 100px; }
    .topbar{ padding-left:40px; padding-right:40px; }
  }
  .content::-webkit-scrollbar{display:none;}
  h2.title{
    font-family:'Fraunces',serif; font-weight:600; font-size:24px;
    margin:2px 0 4px;
  }
  .subtitle{
    font-size:13.5px; color:var(--ink-soft); margin:0 0 18px; line-height:1.5;
  }

  /* ---------- search ---------- */
  .searchbar{
    display:flex; align-items:center; gap:10px;
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:16px;
    padding:12px 14px;
    margin-bottom:16px;
  }
  .searchbar input{
    border:none; outline:none; background:transparent;
    font-family:'Inter',sans-serif; font-size:14px; color:var(--ink);
    width:100%;
  }
  .searchbar input::placeholder{color:#9CA694;}

  .chiprow{display:flex; gap:8px; overflow-x:auto; margin-bottom:18px; padding-bottom:2px;}
  .chiprow::-webkit-scrollbar{display:none;}
  .chip{
    flex-shrink:0;
    font-size:12.5px; font-weight:600;
    padding:8px 14px; border-radius:999px;
    background:var(--paper); border:1px solid var(--line);
    color:var(--ink-soft);
    cursor:pointer;
    white-space:nowrap;
  }
  .chip.active{ background:var(--moss); border-color:var(--moss); color:#fff; }

  /* ---------- sitter / pet cards ---------- */
  .card{
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:20px;
    padding:14px;
    margin-bottom:14px;
    display:flex; gap:12px;
    cursor:pointer;
    transition:transform .15s ease;
  }
  .card:active{ transform:scale(0.98); }
  .thumb{
    width:78px;height:78px;border-radius:14px;flex-shrink:0;
    background-size:cover; background-position:center;
    display:flex; align-items:flex-end; justify-content:flex-end;
  }
  .card-body{flex:1; min-width:0;}
  .card-toprow{display:flex; justify-content:space-between; align-items:flex-start; gap:6px;}
  .card-name{font-family:'Fraunces',serif; font-weight:600; font-size:16px;}
  .rating{
    display:flex; align-items:center; gap:3px;
    font-family:'IBM Plex Mono',monospace; font-size:12px; font-weight:600;
    color:var(--gold-deep); flex-shrink:0;
  }
  .card-loc{font-size:12.5px; color:var(--ink-soft); margin:2px 0 6px; display:flex; align-items:center; gap:4px;}
  .tagrow{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:6px;}
  .tag{
    font-size:11px; font-weight:600; color:var(--moss-deep);
    background:rgba(110,143,114,0.14);
    padding:3px 8px; border-radius:8px;
  }
  .price{font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:13.5px;}
  .price span{color:var(--ink-soft); font-weight:400; font-size:11.5px;}

  /* ---------- section label ---------- */
  .section-label{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px; font-weight:600; letter-spacing:.1em; text-transform:uppercase;
    color:var(--ink-soft); margin:22px 0 10px;
  }

  /* ---------- onboarding ---------- */
  .onboard{
    height:100%; max-width:460px; margin:0 auto; display:flex; flex-direction:column; justify-content:center;
    padding:0 22px 60px; text-align:center;
  }
  .onboard .mark-lg{
    width:64px;height:64px;border-radius:20px; background:var(--ink); color:var(--gold);
    display:flex;align-items:center;justify-content:center; margin:0 auto 18px;
  }
  .onboard h1{
    font-family:'Fraunces',serif; font-size:30px; font-weight:600; margin:0 0 8px; line-height:1.15;
  }
  .onboard p.tag{
    font-size:14px; color:var(--ink-soft); line-height:1.5; margin:0 0 34px;
    background:transparent; padding:0;
  }
  .roleoption{
    display:flex; align-items:center; gap:14px; text-align:left;
    background:var(--paper); border:1.5px solid var(--line); border-radius:20px;
    padding:16px; margin-bottom:14px; cursor:pointer;
  }
  .roleoption .ricon{
    width:48px;height:48px;border-radius:14px; flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
  }
  .roleoption.owner .ricon{ background:rgba(227,162,59,0.18); color:var(--gold-deep); }
  .roleoption.sitter .ricon{ background:rgba(110,143,114,0.18); color:var(--moss-deep); }
  .roleoption strong{font-family:'Fraunces',serif; font-size:15.5px; font-weight:600; display:block;}
  .roleoption span{font-size:12.5px; color:var(--ink-soft);}

  /* ---------- buttons ---------- */
  .btn{
    display:flex; align-items:center; justify-content:center; gap:8px;
    font-family:'Inter',sans-serif; font-weight:600; font-size:14.5px;
    padding:15px; border-radius:16px; border:none; cursor:pointer; width:100%;
  }
  .btn-primary{ background:var(--ink); color:var(--canvas); }
  .btn-primary:active{ background:#132a1d; }
  .btn-ghost{ background:transparent; color:var(--ink); border:1.5px solid var(--line); }
  .btn:disabled{ opacity:.45; cursor:not-allowed; }

  /* ---------- detail screen ---------- */
  .hero-img{
    height:230px; width:100%; background-size:cover; background-position:center;
    border-radius:0 0 28px 28px; position:relative; flex-shrink:0;
  }
  .hero-fade{position:absolute; inset:0; background:linear-gradient(180deg, rgba(0,0,0,0) 40%, rgba(14,26,18,0.55) 100%); border-radius:0 0 28px 28px;}
  .hero-topbtn{
    position:absolute; top:16px; width:34px;height:34px;border-radius:50%;
    background:rgba(255,255,255,0.85); backdrop-filter:blur(4px);
    display:flex;align-items:center;justify-content:center;
  }
  .hero-caption{
    position:absolute; bottom:14px; left:20px; right:20px; color:#fff;
  }
  .hero-caption h2{font-family:'Fraunces',serif; font-size:22px; font-weight:600; margin:0 0 2px;}
  .hero-caption .loc{font-size:12.5px; opacity:.9; display:flex; gap:4px; align-items:center;}

  .statrow{ display:flex; gap:10px; margin:16px 0 6px; }
  .stat{
    flex:1; background:var(--paper); border:1px solid var(--line); border-radius:14px;
    padding:10px; text-align:center;
  }
  .stat b{display:block; font-family:'Fraunces',serif; font-size:16px;}
  .stat span{font-size:10.5px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.06em;}

  .bio{ font-size:13.5px; line-height:1.6; color:var(--ink-soft); margin:14px 0; }

  .reviewcard{
    background:var(--paper); border:1px solid var(--line); border-radius:16px; padding:12px 14px; margin-bottom:10px;
  }
  .reviewcard .rh{display:flex; justify-content:space-between; font-size:12.5px; font-weight:600; margin-bottom:4px;}
  .reviewcard p{font-size:12.5px; color:var(--ink-soft); margin:0; line-height:1.5;}

  .stickybar{
    position:sticky; bottom:0; background:linear-gradient(0deg, var(--canvas) 60%, rgba(241,239,226,0));
    padding:18px 0 6px; display:flex; align-items:center; gap:12px;
  }
  .stickybar .pricebox{flex-shrink:0;}
  .stickybar .pricebox b{font-family:'IBM Plex Mono',monospace; font-size:17px;}
  .stickybar .pricebox span{display:block; font-size:11px; color:var(--ink-soft);}

  /* ---------- form ---------- */
  .field{ margin-bottom:14px; }
  .field label{ font-size:12px; font-weight:600; color:var(--ink-soft); display:block; margin-bottom:6px; text-transform:uppercase; letter-spacing:.05em;}
  .field input, .field select, .field textarea{
    width:100%; border:1.5px solid var(--line); border-radius:12px; padding:12px 13px;
    font-family:'Inter',sans-serif; font-size:14px; color:var(--ink); background:var(--paper);
    outline:none;
  }
  .field textarea{resize:vertical; min-height:70px;}
  .field-row{display:flex; gap:10px;}
  .field-row .field{flex:1;}

  /* ---------- ticket / pawcation pass ---------- */
  .ticket{
    background:var(--paper);
    border-radius:22px;
    position:relative;
    box-shadow: 0 14px 30px -14px rgba(30,58,43,0.3);
    margin-bottom:18px;
    overflow:visible;
  }
  .ticket-top{ padding:20px 20px 16px; position:relative; }
  .ticket-brand{ display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;}
  .ticket-brand .tb-name{ font-family:'Fraunces',serif; font-weight:700; font-size:15px;}
  .stampbadge{
    font-family:'IBM Plex Mono',monospace; font-size:10.5px; font-weight:700;
    color:var(--stamp); border:1.5px solid var(--stamp); border-radius:8px;
    padding:3px 8px; transform:rotate(-6deg); letter-spacing:.05em;
  }
  .ticket-route{ display:flex; align-items:center; gap:10px; margin-bottom:14px;}
  .ticket-route .pt{flex:1;}
  .ticket-route .pt b{display:block; font-family:'IBM Plex Mono',monospace; font-size:19px;}
  .ticket-route .pt span{font-size:10.5px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.05em;}
  .ticket-route .dots{flex:1; border-top:2px dotted var(--line); position:relative; top:-2px;}
  .ticket-grid{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; }
  .ticket-grid div span{display:block; font-size:9.5px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.05em; margin-bottom:3px;}
  .ticket-grid div b{font-family:'IBM Plex Mono',monospace; font-size:12.5px;}
  .tear{
    position:relative; height:0; border-top:2px dashed var(--line); margin:0 0;
  }
  .tear::before, .tear::after{
    content:''; position:absolute; top:-11px; width:22px; height:22px; border-radius:50%;
    background: #DCD8C1;
  }
  .tear::before{ left:-31px; }
  .tear::after{ right:-31px; }
  .ticket-bottom{ padding:16px 20px 20px; display:flex; justify-content:space-between; align-items:center;}
  .ticket-code{ font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--ink-soft); letter-spacing:.05em;}
  .pawstamp{ color:var(--moss-deep); }

  .emptystate{ text-align:center; padding:60px 20px; color:var(--ink-soft); }
  .emptystate .ico{ margin-bottom:14px; opacity:.5; }
  .emptystate h3{font-family:'Fraunces',serif; font-size:17px; color:var(--ink); margin:0 0 6px;}
  .emptystate p{font-size:13px; margin:0;}

  /* ---------- messages ---------- */
  .msgrow{ display:flex; gap:12px; align-items:center; padding:12px 0; border-bottom:1px solid var(--line); cursor:pointer;}
  .avatar{ width:46px;height:46px;border-radius:50%; background-size:cover; background-position:center; flex-shrink:0; }
  .msgrow .mbody{flex:1; min-width:0;}
  .msgrow .mtop{display:flex; justify-content:space-between; font-size:13.5px;}
  .msgrow .mtop b{font-weight:600;}
  .msgrow .mtop span{font-size:11px; color:var(--ink-soft);}
  .msgrow p{margin:2px 0 0; font-size:12.5px; color:var(--ink-soft); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .unreaddot{width:8px; height:8px; border-radius:50%; background:var(--stamp); flex-shrink:0;}

  /* ---------- profile ---------- */
  .profile-head{ text-align:center; padding:10px 0 20px; }
  .profile-head .avatar{ width:84px; height:84px; margin:0 auto 12px; }
  .profile-head h2{ font-family:'Fraunces',serif; font-size:20px; margin:0 0 2px;}
  .profile-head p{ font-size:12.5px; color:var(--ink-soft); margin:0;}
  .profile-row{
    display:flex; align-items:center; justify-content:space-between;
    background:var(--paper); border:1px solid var(--line); padding:15px 16px; border-radius:16px; margin-bottom:10px;
    font-size:13.5px; font-weight:500; cursor:pointer;
  }
  .profile-row .left{display:flex; align-items:center; gap:12px;}

  /* ---------- bottom nav ---------- */
  .bottomnav{
    position:absolute; bottom:0; left:0; right:0;
    background:rgba(255,255,255,0.92); backdrop-filter:blur(10px);
    border-top:1px solid var(--line);
    display:flex; padding:10px 10px calc(env(safe-area-inset-bottom, 0px) + 10px);
  }
  .navitem{
    flex:1; display:flex; flex-direction:column; align-items:center; gap:4px;
    color:#A2A891; cursor:pointer; font-size:10.5px; font-weight:600;
  }
  .navitem.active{ color:var(--ink); }

  /* toast */
  .toast{
    position:absolute; left:20px; right:20px; bottom:100px;
    background:var(--ink); color:var(--canvas);
    padding:14px 16px; border-radius:14px;
    display:flex; align-items:center; gap:10px;
    font-size:13px; font-weight:500;
    box-shadow:0 10px 24px rgba(0,0,0,0.25);
    z-index:80;
    opacity:0; transform:translateY(10px); pointer-events:none;
    transition:.25s ease;
  }
  .toast.show{ opacity:1; transform:translateY(0); }

  .fade-in{ animation: fadein .25s ease; }
  @keyframes fadein{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }

  /* ---------- trust banner ---------- */
  .trustnote{
    display:flex; gap:10px; background:rgba(110,143,114,0.12);
    border:1px solid rgba(110,143,114,0.3); border-radius:14px;
    padding:12px 14px; font-size:12px; line-height:1.5; color:var(--moss-deep);
    margin-bottom:18px;
  }
  .trustnote svg{flex-shrink:0; margin-top:1px;}

  .statuspill{
    display:inline-flex; align-items:center; gap:6px;
    font-size:11.5px; font-weight:700; letter-spacing:.03em;
    padding:6px 12px; border-radius:999px; margin-bottom:18px;
  }
  .statuspill.unverified{ background:rgba(193,68,46,0.12); color:var(--stamp); }
  .statuspill.pending{ background:rgba(227,162,59,0.16); color:var(--gold-deep); }
  .statuspill.verified{ background:rgba(110,143,114,0.16); color:var(--moss-deep); }
  .statuspill .dot{ width:6px;height:6px;border-radius:50%; background:currentColor; }

  .upload-tile{
    position:relative;
    aspect-ratio:1/1;
    border-radius:18px;
    border:1.5px dashed var(--line);
    background:var(--paper);
    background-size:cover; background-position:center;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:6px; cursor:pointer; overflow:hidden;
    color:var(--ink-soft);
  }
  .upload-tile.filled{ border-style:solid; border-color:var(--moss); }
  .upload-tile.filled .uplabel{
    position:absolute; bottom:0; left:0; right:0;
    background:linear-gradient(0deg, rgba(14,26,18,0.75), rgba(14,26,18,0));
    color:#fff; padding:20px 8px 8px; font-size:11px; font-weight:600; text-align:center;
  }
  .upload-tile .uplabel-empty{ font-size:11.5px; font-weight:600; text-align:center; padding:0 8px; }
  .upload-tile input[type=file]{ position:absolute; inset:0; opacity:0; cursor:pointer; }
  .upload-tile .checkmark{
    position:absolute; top:8px; right:8px; width:22px;height:22px;border-radius:50%;
    background:var(--moss); color:#fff; display:flex; align-items:center; justify-content:center;
  }
  .upload-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:8px; }
  .upload-grid .full{ grid-column:1/-1; }

  /* ---------- credit card visual: true 3D flip ---------- */
  .cc-perspective{ position:relative; margin-bottom:20px; perspective:1400px; }
  .cc-flipper{
    position:relative; width:100%; aspect-ratio:1.586/1;
    transform-style:preserve-3d; -webkit-transform-style:preserve-3d;
    transform:rotateY(0deg);
    transition:transform .8s cubic-bezier(.45,.05,.15,1);
    border-radius:20px;
  }
  .cc-flipper.flipped{ transform:rotateY(180deg); }

  .cc-face{
    position:absolute; inset:0; border-radius:20px;
    backface-visibility:hidden; -webkit-backface-visibility:hidden;
    overflow:hidden; color:#F1EFE2;
    box-shadow:0 10px 20px -10px rgba(20,32,24,0.28);
  }
  .cc-front{
    background: linear-gradient(135deg, #1E3A2B 0%, #2C4A36 55%, #3E5C45 100%);
    padding:20px 22px; display:flex; flex-direction:column; justify-content:space-between;
  }
  .cc-front::after{
    content:''; position:absolute; width:200px; height:200px; border-radius:50%;
    background:radial-gradient(circle, rgba(227,162,59,0.25), transparent 70%);
    top:-80px; right:-60px;
  }
  .cc-back{
    background: linear-gradient(135deg, #2C4A36 0%, #1E3A2B 100%);
    transform:rotateY(180deg);
    display:flex; flex-direction:column;
  }
  /* a genuine, physically-positioned right-hand edge — hinges with the card in real 3D
     space, so it naturally comes into view exactly when the card is edge-on, giving it
     real thickness instead of vanishing to a flat line */
  .cc-edge{
    position:absolute; top:0; right:0; width:9px; height:100%;
    background:linear-gradient(90deg, rgba(10,18,13,0.95), rgba(80,112,88,0.55));
    transform-origin:right center;
    transform:rotateY(90deg);
    border-radius:0 20px 20px 0;
  }
  .cc-stripe{ width:100%; height:38px; background:#14201A; margin-top:20px; }
  .cc-sigrow{ display:flex; align-items:center; gap:10px; margin:18px 20px 0; }
  .cc-sigline{
    flex:1; height:34px; border-radius:4px;
    background:repeating-linear-gradient(45deg, #E9E5D6, #E9E5D6 3px, #DDD8C4 3px, #DDD8C4 6px);
  }
  .cc-cvvbox{
    background:#F1EFE2; color:#1E3A2B; border-radius:4px;
    padding:8px 12px; font-family:'IBM Plex Mono',monospace; font-style:italic; font-weight:600; font-size:13px;
    min-width:44px; text-align:center;
  }
  .cc-backbottom{
    display:flex; align-items:center; gap:8px; margin:14px 20px 0;
    font-size:9.5px; text-transform:uppercase; letter-spacing:.06em; opacity:.8;
  }
  .cc-backbottom b{ font-family:'IBM Plex Mono',monospace; font-size:13px; text-transform:none; letter-spacing:.03em; opacity:1;}

  .cc-top{ display:flex; justify-content:space-between; align-items:flex-start; z-index:1; }
  .cc-chip{ width:38px; height:28px; border-radius:6px; background:linear-gradient(135deg,#E3A23B,#C67F1E); }
  .cc-scheme{
    font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:11.5px;
    letter-spacing:.06em; text-transform:uppercase;
    border-radius:6px; padding:4px 9px;

/* ============ MASTER RENDER ============ */
function render(){
  renderTopbar();
  renderBottomNav();
  let html = '';
  switch(state.screen){
    case 'onboard': html = screenOnboard(); break;
    case 'browse': html = state.mode==='owner' ? screenBrowseOwner() : screenBrowseSitter(); break;
    case 'detail': html = screenSitterDetail(); break;
    case 'request': html = screenRequestForm(); break;
    case 'requestDetail': html = screenRequestDetail(); break;
    case 'ticket': html = screenTicket(); break;
    case 'bookings': html = screenBookings(); break;
    case 'messages': html = screenMessages(); break;
    case 'profile': html = screenProfile(); break;
    case 'verify': html = screenVerify(); break;
    case 'payment': html = screenPayment(); break;
    case 'mypets': html = screenMyPets(); break;
    case 'addpet': html = screenAddPet(); break;
    default: html = screenOnboard();
  }
  app.content.innerHTML = html;
}

/* ============ EVENTS ============ */
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-action]');
  if(!el) return;
  const action = el.dataset.action;

  if(action==='pick-owner'){ state.onboarded=true; state.mode='owner'; go('browse'); return; }
  if(action==='pick-sitter'){ state.onboarded=true; state.mode='sitter'; go('browse'); return; }
  if(action==='mode-owner'){ setMode('owner'); return; }
  if(action==='mode-sitter'){ setMode('sitter'); return; }
  if(action==='back'){
    if(state.screen==='detail' || state.screen==='requestDetail') go('browse');
    else if(state.screen==='request') go('detail', {selectedId:state.selectedId});
    else if(state.screen==='ticket') go('bookings');
    else if(state.screen==='addpet') go('mypets');
    else if(['verify','payment','mypets'].includes(state.screen)) go('profile');
    else go('browse');
    return;
  }
  if(action.startsWith('nav-')){ go(action.replace('nav-','')); return; }
  if(action.startsWith('filter-')){ state.filter = action.replace('filter-',''); render(); return; }
  if(action.startsWith('open-sitter-')){ go('detail', {selectedId: action.replace('open-sitter-','')}); return; }
  if(action.startsWith('open-request-')){ go('requestDetail', {selectedId: action.replace('open-request-','')}); return; }
  if(action.startsWith('request-stay-')){ go('request', {selectedId: action.replace('request-stay-','')}); return; }

  if(action.startsWith('confirm-request-')){
    const id = action.replace('confirm-request-','');
    const s = SITTERS.find(x=>x.id===id);
    const petName = document.getElementById('f-petname').value || 'Your pet';
    const checkIn = document.getElementById('f-in').value || '2026-07-10';
    const checkOut = document.getElementById('f-out').value || '2026-07-14';
    const booking = {
      id: 'b'+Date.now(), status:'pending',
      petName, hostName: s.name, loc: s.loc.split(',')[0],
      checkIn: fmtDate(checkIn), checkOut: fmtDate(checkOut),
      code: randCode()
    };
    state.bookings.push(booking);
    toast('Request sent to '+s.name.split(' ')[0]);
    go('ticket', {selectedId: booking.id});
    return;
  }

  if(action.startsWith('offer-sit-')){
    const id = action.replace('offer-sit-','');
    const r = REQUESTS.find(x=>x.id===id);
    const [checkIn, checkOut] = r.dates.split(' – ');
    const booking = {
      id: 'b'+Date.now(), status:'confirmed',
      petName: r.pet, hostName: 'You', loc: r.loc.split(',')[0],
      checkIn, checkOut, code: randCode()
    };
    state.bookings.push(booking);
    toast('Offer sent to '+r.owner.split(' ')[0]);
    go('ticket', {selectedId: booking.id});
    return;
  }

  if(action==='nav2-verify'){ go('verify'); return; }
  if(action==='nav2-mypets'){ go('mypets'); return; }
  if(action==='nav2-payment'){ go('payment'); return; }
  if(action==='nav2-addpet'){ go('addpet'); return; }
  if(action==='nav2-noop'){ return; }

  if(action==='submit-verification'){
    state.verification.status = 'pending';
    toast('Sent for review — usually done within 24h');
    go('profile');
    return;
  }

  if(action==='save-card'){
    const number = (document.getElementById('cc-number').value||'').replace(/\s+/g,'');
    const name = document.getElementById('cc-name').value || 'Card holder';
    const exp = document.getElementById('cc-exp').value || 'MM/YY';
    const cvv = document.getElementById('cc-cvv').value;
    if(number.length < 12 || !cvv){ toast('Check your card details'); return; }
    state.cards.push({
      brand: detectScheme(number) || 'Card',
      bankName: currentCardDetect.bankName || null,
      last4: number.slice(-4), expiry: exp, name
    });
    currentCardDetect = { scheme:null, bankName:null };
    toast('Card added');
    go('payment');
    return;
  }
  if(action && action.startsWith('remove-card-')){
    const i = parseInt(action.replace('remove-card-',''),10);
    state.cards.splice(i,1);
    render();
    return;
  }

  if(action==='save-payout'){
    const name = document.getElementById('po-name').value;
    const bank = document.getElementById('po-bank').value;
    const iban = (document.getElementById('po-iban').value||'').replace(/\s+/g,'');
    if(!name || !bank || iban.length < 6){ toast('Fill in all payout fields'); return; }
    state.payout = { holder:name, bankName:bank, ibanLast4: iban.slice(-4) };
    toast('Payout details saved');
    go('profile');
    return;
  }
  if(action==='remove-payout'){ state.payout = null; render(); return; }

  if(action==='save-pet'){
    const name = document.getElementById('pet-name').value;
    const type = document.getElementById('pet-type').value;
    const breed = document.getElementById('pet-breed').value;
    const notes = document.getElementById('pet-notes').value;
    if(!name || !pendingUploads.newPetPhoto){ toast('Add a name and photo first'); return; }
    state.myPets.push({ name, type, breed, notes, photo: pendingUploads.newPetPhoto });
    delete pendingUploads.newPetPhoto;
    toast(name+' added to your pets');
    go('mypets');
    return;
  }
});

/* ---- file uploads (kept in-memory only, never sent anywhere) ---- */
const pendingUploads = {};
document.addEventListener('change', (e) => {
  const input = e.target.closest('[data-upload-input]');
  if(!input || !input.files || !input.files[0]) return;
  const key = input.dataset.uploadInput;
  const reader = new FileReader();
  reader.onload = (ev) => {
    const dataUrl = ev.target.result;
    if(key === 'newPetPhoto'){
      pendingUploads.newPetPhoto = dataUrl;
      const tile = input.closest('.upload-tile');
      tile.style.backgroundImage = `url('${dataUrl}')`;
      tile.classList.add('filled');
      tile.innerHTML = `<div class="checkmark">${ICON.check}</div><div class="uplabel">Photo added</div>` + tile.innerHTML;
    } else {
      state.verification[key] = dataUrl;
      render();
    }
  };
  reader.readAsDataURL(input.files[0]);
});

/* ---- live credit card preview: network detection (local) + bank detection (live BIN lookup) ---- */
let currentCardDetect = { scheme: null, bankName: null };
let binLookupTimer = null;
let binLookupToken = 0;

const SCHEME_PATTERNS = [
  { name: 'Troy',        test: n => /^9792/.test(n) },
  { name: 'Amex',        test: n => /^3[47]/.test(n) },
  { name: 'Diners Club', test: n => /^3(?:0[0-5]|[68])/.test(n) },
  { name: 'JCB',         test: n => /^35(?:2[89]|[3-8]\d)/.test(n) },
  { name: 'Discover',    test: n => /^(?:6011|65|64[4-9])/.test(n) },
  { name: 'Mastercard',  test: n => /^(?:5[1-5]|22[2-9]|2[3-6]\d|27[01]\d|2720)/.test(n) },
  { name: 'Visa',        test: n => /^4/.test(n) },
];
/* Brand badge styling — original color/abbreviation pairing, not a reproduction of any brand's official logo artwork */
const SCHEME_META = {
  'Visa':         { bg:'#2C5CE0', abbr:'VISA' },
  'Mastercard':   { bg:'#D9542F', abbr:'MC'   },
  'Amex':         { bg:'#2E7D74', abbr:'AMEX' },
  'Troy':         { bg:'#B8433A', abbr:'TROY' },
  'Discover':     { bg:'#CB7B1E', abbr:'DISC' },
  'Diners Club':  { bg:'#5B6B7A', abbr:'DIN'  },
  'JCB':          { bg:'#3D6B8C', abbr:'JCB'  },
};
function detectScheme(number){
  const hit = SCHEME_PATTERNS.find(p => p.test(number));
  return hit ? hit.name : null;
}

function setBankLine(html){
  const el = document.getElementById('cc-prev-bank');
  if(el) el.innerHTML = html;
}

function lookupBank(bin){
  const myToken = ++binLookupToken;
  setBankLine(`<span class="spinner"></span> Looking up issuing bank…`);
  fetch(`https://lookup.binlist.net/${bin}`, { headers: { 'Accept-Version': '3' } })
    .then(res => { if(!res.ok) throw new Error('not found'); return res.json(); })
    .then(data => {
      if(myToken !== binLookupToken) return; // a newer keystroke superseded this lookup
      const bankName = data.bank && data.bank.name ? data.bank.name : null;
      const country = data.country && data.country.emoji ? ' ' + data.country.emoji : '';
      currentCardDetect.bankName = bankName;
      setBankLine(bankName ? `${bankName}${country}` : 'Bank not identified');
    })
    .catch(() => {
      if(myToken !== binLookupToken) return;
      currentCardDetect.bankName = null;
      setBankLine('Bank not identified');
    });
}

document.addEventListener('input', (e) => {
  if(e.target.id==='cc-number'){
    let v = e.target.value.replace(/\D/g,'').slice(0,16);
    e.target.value = v.replace(/(.{4})/g,'$1 ').trim();
    const shown = v.padEnd(16,'•').replace(/(.{4})/g,'$1 ').trim();
    const numEl = document.getElementById('cc-prev-number');
    if(numEl) numEl.textContent = v.length ? shown.replace(/\d(?=\d{4})/g,'•') : '•••• •••• •••• ••••';

    const scheme = detectScheme(v);
    currentCardDetect.scheme = scheme;
    const schemeEl = document.getElementById('cc-prev-scheme');
    if(schemeEl){
      const meta = SCHEME_META[scheme];
      schemeEl.textContent = meta ? meta.abbr : 'CARD';
      schemeEl.style.background = meta ? meta.bg : 'rgba(241,239,226,0.16)';
    }

    clearTimeout(binLookupTimer);
    if(v.length >= 6){
      binLookupTimer = setTimeout(() => lookupBank(v.slice(0,8)), 450);
    } else {
      binLookupToken++; // cancel any in-flight lookup
      currentCardDetect.bankName = null;
      setBankLine('');
    }
  }
  if(e.target.id==='cc-name'){
    const el = document.getElementById('cc-prev-name');
    if(el) el.textContent = (e.target.value || 'YOUR NAME').toUpperCase();
  }
  if(e.target.id==='cc-exp'){
    let v = e.target.value.replace(/[^\d]/g,'').slice(0,4);
    if(v.length >= 3) v = v.slice(0,2)+'/'+v.slice(2);
    e.target.value = v;
    const el = document.getElementById('cc-prev-exp');
    if(el) el.textContent = v || 'MM/YY';
  }
  if(e.target.id==='cc-cvv'){
    let v = e.target.value.replace(/\D/g,'').slice(0,4);
    e.target.value = v;
    const el = document.getElementById('cc-prev-cvv');
    if(el) el.textContent = v || '•••';
  }
});
// Flip the card to its back (3D) while the CVV or expiry field has focus, front otherwise
function setCardFlip(toBack){
  const flipper = document.getElementById('cc-flipper');
  if(!flipper) return;
  flipper.classList.toggle('flipped', toBack);
}
document.addEventListener('focusin', (e) => {
  if(!document.getElementById('cc-flipper')) return;
  if(e.target.id==='cc-cvv' || e.target.id==='cc-exp'){
    setCardFlip(true);
  } else if(e.target.id==='cc-number' || e.target.id==='cc-name'){
    setCardFlip(false);
  }
});
function guessBrand(number){
  return detectScheme(number) || 'Card';
}

function fmtDate(iso){
  const d = new Date(iso+'T00:00:00');
  return d.toLocaleDateString('en-US',{month:'short', day:'numeric'});
}
function randCode(){
  return Math.random().toString(36).substring(2,6).toUpperCase() + '-' + Math.floor(1000+Math.random()*9000);
}

render();

/* ============ SYNTHESIZED "WOOF" SOUND (no audio file — generated in-browser) ============ */
let barkPlayed = false;
function playBark(){
  try{
    const Ctx = window.AudioContext || window.webkitAudioContext;
    const ctx = new Ctx();
    const now = ctx.currentTime;
    function woof(startOffset, duration){
      const bufferSize = Math.floor(ctx.sampleRate * duration);
      const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
      const data = buffer.getChannelData(0);
      for(let i=0;i<bufferSize;i++){ data[i] = (Math.random()*2-1) * Math.pow(1 - i/bufferSize, 1.6); }
      const noise = ctx.createBufferSource();
      noise.buffer = buffer;
      const filter = ctx.createBiquadFilter();
      filter.type = 'bandpass';
      filter.Q.value = 0.8;
      filter.frequency.setValueAtTime(1000, now+startOffset);
      filter.frequency.exponentialRampToValueAtTime(200, now+startOffset+duration);
      const gain = ctx.createGain();
      gain.gain.setValueAtTime(0.0001, now+startOffset);
      gain.gain.exponentialRampToValueAtTime(0.85, now+startOffset+0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, now+startOffset+duration);
      noise.connect(filter); filter.connect(gain); gain.connect(ctx.destination);
      noise.start(now+startOffset);
      noise.stop(now+startOffset+duration+0.02);
    }
    woof(0, 0.16);
    woof(0.20, 0.13);
    barkPlayed = true;
  }catch(e){ /* Web Audio unavailable — fail silently */ }
}

/* ============ LOADING SCREEN ============ */
const loaderEl = document.getElementById('loader');
function hideLoader(){
  if(!loaderEl) return;
  loaderEl.classList.add('hide');
  setTimeout(() => loaderEl.remove(), 550);
}
// Don't wait on window 'load' (fonts/images) — on a slow connection that event can be
// delayed a long time or never fire cleanly, which would leave the loader stuck.
// The app itself doesn't depend on those resources, so we just run on a plain timer.
playBark(); // will silently fail if the browser blocks autoplay audio before any user gesture
setTimeout(hideLoader, 1900);
// Absolute safety net: no matter what happens above, never let the loader stay up more than 5s
setTimeout(hideLoader, 5000);
// Fallback: if autoplay was blocked, play the bark on the visitor's first tap/click anywhere
document.addEventListener('click', function firstGestureBark(){
  if(!barkPlayed) playBark();
}, { once:true });
</script>
